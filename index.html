 ac:{chart:'line', caption:'Percentage of households with three types of technology in one country, 2000 to 2020 (invented data for practice)', xs:['2000','2005','2010','2015','2020'], unit:'%', series:[['Landline telephone',[94,88,76,60,45]],['Home internet',[30,58,78,88,95]],['Smart speaker',[0,0,0,8,38]]],
  prompt:`The graph shows the percentage of households in one country that had a landline telephone, home internet access and a smart speaker between 2000 and 2020.<br>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.<br>Write at least 150 words.`,
  model:`The line graph illustrates changes in the proportion of households in one country with three kinds of technology over a twenty-year period from 2000.

Overall, home internet access grew rapidly and became almost universal, while ownership of landline telephones declined steadily. Smart speakers, which did not exist at the beginning of the period, spread quickly in the final five years.

In 2000, almost all households (94%) had a landline, compared with less than a third (30%) with home internet. Over the following decade, the internet figure more than doubled to 78%, overtaking landlines around 2008, while landline ownership fell to 76%.

This divergence continued after 2010. By 2020, home internet access had reached 95% of households, whereas the proportion with a landline had dropped to less than half, at 45%.

Smart speakers first appeared in the data in 2015, when 8% of households owned one. Five years later, this figure had risen almost fivefold to 38%, suggesting that the technology was being adopted far faster than the internet had been in its early years.`},
 gt:{prompt:`You recently stayed at a friend's house for a week while you were visiting their city.<br>Write a letter to your friend. In your letter:<br>• thank your friend for their hospitality<br>• describe what you enjoyed most about your visit<br>• invite your friend to visit you<br>Write at least 150 words. You do NOT need to write any addresses. Begin your letter: <i>Dear ...,</i>`,
  model:`Dear Tom,

I just wanted to say a huge thank you for letting me stay with you last week. You and Anna made me feel completely at home, and I really appreciated you giving up your spare room and taking time off work to show me around. The dinner you cooked on my last night was delicious – I'm still trying to work out how you made that sauce!

I enjoyed every part of the trip, but the highlight for me was the boat trip along the river on Saturday. Seeing the old city from the water at sunset was unforgettable, and the little fish restaurant where we stopped afterwards was perfect. I'd never have found it without you.

Now it's your turn to visit me. The best time would be in October, when the weather here is cooler and the festival season begins. I've got plenty of space, and I'd love to take you to the hills and introduce you to proper local food.

Let me know what dates might work for you.

Best wishes,
Ravi`},
 t2:{prompt:`Some people think that governments should spend more money on public transport, while others believe that building more roads is a better solution to traffic problems.<br>Discuss both views and give your own opinion.<br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.<br>Write at least 250 words.`,
  model:`Traffic congestion is a serious problem in many growing cities, and there is disagreement about the best way to solve it. While some argue that building more roads is the answer, I believe that investing in public transport is the more effective long-term solution.

Supporters of new roads make a reasonable case. In many places, the existing road network was designed for far fewer vehicles, and widening roads or building ring roads can reduce bottlenecks quickly. Roads also serve people in rural areas and businesses that rely on lorries, for whom public transport is not a realistic option.

However, there is strong evidence that new roads often fill up again within a few years, a phenomenon known as induced demand. When driving becomes easier, more people choose to drive, and congestion returns. Building roads also consumes large amounts of land and increases air pollution, which harms public health.

Public transport, by contrast, can move far more people using the same amount of space. A single bus can replace dozens of cars, and a metro line can carry tens of thousands of passengers an hour. Cities such as Delhi have seen how a reliable metro system can attract large numbers of commuters who would otherwise drive. Good public transport also benefits those who cannot afford a car, making cities fairer.

In conclusion, although some road improvements will always be necessary, I believe governments should give priority to public transport, because it addresses the causes of congestion rather than temporarily relieving its symptoms.`}
},

readingAc:[
 {title:'The world\'s oldest trees', paras:[
  ['',`High in the White Mountains of California grow some of the oldest living things on Earth. Great Basin bristlecone pines can live for more than four thousand years, and one tree, known as Methuselah, is estimated to be over 4,800 years old. Its exact location is kept secret to protect it from visitors.`],
  ['',`Bristlecone pines are not impressive to look at. Many are short and twisted, with large sections of dead wood. Yet these features are part of their survival strategy. They grow in harsh conditions, at high altitude, with cold temperatures, strong winds and little rainfall, where few other plants can survive. This means they face little competition and few insects or diseases.`],
  ['',`They also grow extremely slowly, sometimes adding less than a millimetre of width a year. The resulting wood is very dense and contains a lot of resin, which makes it resistant to rot, insects and fungi. When part of the tree is damaged, it can allow that section to die while keeping a narrow strip of living bark connected to the remaining branches.`],
  ['',`Because each year's growth produces a ring in the wood, old trees provide a record of past climates: wide rings indicate good growing years, while narrow rings suggest cold or dry conditions. By matching the patterns of rings in living trees with those in dead wood found nearby, scientists have built a continuous record stretching back more than eight thousand years. This record was used to improve the accuracy of radiocarbon dating, a method used to estimate the age of ancient objects.`],
  ['',`To count a tree's rings without cutting it down, researchers use a tool called an increment borer, which removes a core of wood the width of a pencil. In 1964, however, a researcher studying another bristlecone in Nevada was given permission to cut down the tree, partly because his borer had become stuck. Only afterwards did he count almost five thousand rings, revealing that it had been one of the oldest trees then known.`],
  ['',`Today, bristlecones face new threats. Rising temperatures may allow other tree species and insects to move to higher altitudes, and the trees may be affected by a disease known as white pine blister rust. Scientists are monitoring populations closely.`]],

 {title:'Learning a language as an adult', paras:[
  ['A',`It is widely believed that children learn languages more easily than adults. Like many popular beliefs, this one contains some truth, but the full picture is more complicated, and more encouraging for adult learners than is often assumed.`],
  ['B',`The clearest advantage children have is in pronunciation. People who begin learning a language in early childhood are much more likely to develop a native-like accent than those who start as adults. This is often linked to the idea of a "critical period", a window of time during which the brain is especially sensitive to the sounds of language.`],
  ['C',`For grammar, the evidence is also in children's favour, at least in the long run. A large online study published in 2018, involving around 670,000 participants, suggested that the ability to learn grammar to a native-like level remains strong until around the age of seventeen or eighteen and declines after that. However, the study measured final achievement, not how quickly people learn.`],
  ['D',`In terms of speed, adults often have the advantage, particularly at the beginning. Studies comparing learners in the same programme have found that older children and adults usually make faster progress in the first months than younger children. Adults can use their knowledge of their first language, they are better at understanding explicit explanations of grammar, and they often have more effective study strategies.`],
  ['E',`Children's long-term advantage may also have as much to do with circumstances as with biology. Young children who learn a language usually do so by being surrounded by it at home or school, for many hours a day, over many years. Adults typically study for a few hours a week, often while working, and have fewer opportunities to use the language naturally.`],
  ['F',`Motivation and anxiety play a role, too. Adults are often more self-conscious about making mistakes, which can make them reluctant to speak. Children are generally less worried about sounding foolish, and so they get more practice.`],
  ['G',`For adults, then, the message is not that it is too late, but that the conditions matter. Regular exposure to the language, plenty of speaking practice, and a willingness to make mistakes can help adult learners achieve a high level, even if a perfect accent remains difficult.`]],

 {title:'The value of boredom', paras:[
  ['A',`Boredom has a bad reputation. It is usually seen as an unpleasant state to be avoided, and modern technology makes avoiding it easier than ever: few people now wait for a bus or stand in a queue without reaching for a phone. Yet a number of researchers have begun to argue that boredom may serve a useful purpose.`],
  ['B',`One influential line of thought sees boredom as a signal. In the same way that pain tells us to remove our hand from something hot, boredom tells us that what we are doing is not meaningful or engaging enough, and pushes us to look for something better. On this view, boredom is not a problem in itself; it is information.`],
  ['C',`Some studies have also linked boredom with creativity. In one frequently cited experiment, participants who had first carried out a dull task, copying numbers from a telephone directory, then came up with more ideas in a creative task than those who had not. The researchers suggested that boredom encourages the mind to wander, which can lead to new connections.`],
  ['D',`I would urge some caution here. Experiments of this kind have been relatively small, and not all attempts to repeat their findings have succeeded. It seems reasonable to say that boredom can sometimes encourage creative thinking, but not that it reliably does so.`],
  ['E',`It is also important to distinguish between occasional boredom and chronic boredom. People who are frequently bored, particularly in situations they cannot escape, such as repetitive work, are more likely to experience stress and low mood. Boredom of this kind is unlikely to lead to anything creative; it is a problem that needs addressing.`],
  ['F',`What does seem clear is that our constant use of phones has changed our relationship with boredom. When every empty moment is filled with messages, news and videos, we rarely experience the kind of mental space in which the mind wanders. Whether this is harmful is still an open question, but I suspect that many of us would benefit from occasionally leaving our phones in our pockets.`],
  ['G',`Perhaps the most sensible conclusion is that boredom, like many unpleasant feelings, is neither simply good nor simply bad. What matters is how we respond to it: as a prompt to find something more meaningful to do, or as something to be immediately removed with the nearest distraction.`]],

 {title:'Section 3', texts:[
  {title:'The humble pencil eraser and other small inventions', paras:[
   ['A',`Some of the most useful inventions are so ordinary that we never think about who created them. Their stories, however, often reveal how innovation really happens: not through a single moment of genius, but through small improvements, accidents and the needs of everyday life.`],
   ['B',`Consider the eraser. For centuries, people rubbed out pencil marks using bread. In 1770, the English scientist Joseph Priestley noted that a substance called rubber, from South America, was excellent for removing pencil marks; according to some accounts, the material got its English name from this use. Early rubber, however, became sticky in heat and hard in cold, until the process of vulcanisation, developed by Charles Goodyear in the 1840s, made it far more stable.`],
   ['C',`The paper clip has a similar history of gradual improvement. Many different designs of bent-wire clips were patented in the late nineteenth century. The most familiar shape, known as the Gem clip, was never patented by its unknown designer, and was produced by a British company, the Gem Manufacturing Company.`],
   ['D',`Sticky notes owe their existence to an accident. In 1968, Spencer Silver, a scientist at the company 3M, was trying to develop a very strong adhesive, but instead created a weak one that could be removed easily. For years, nobody could think of a use for it. Then his colleague Art Fry, frustrated that paper bookmarks kept falling out of his hymn book, realised that the adhesive could be used to make bookmarks that stayed in place.`],
   ['E',`The zip took decades to become practical. Early versions in the 1890s were unreliable. It was a Swedish-American engineer, Gideon Sundback, who in 1913 developed the design of interlocking teeth that is still used today. Even then, it took years before zips were widely used in clothing.`],
   ['F',`These stories suggest that successful inventions often depend less on the original idea than on finding the right application, and on the persistence of people willing to improve something that already exists.`]]}],
  groups:[
   {type:'match', instr:'Match each person with the correct statement. Write the correct letter, A to E.', options:[['A','created a weak adhesive by accident'],['B','made rubber more stable'],['C','developed the modern zip'],['D','noticed that rubber removed pencil marks'],['E','found a practical use for a discovery']], items:[
    ['Joseph Priestley','D'],['Charles Goodyear','B'],['Spencer Silver','A'],['Art Fry','E'],['Gideon Sundback','C']]},
   {type:'gap', instr:'Complete the sentences. Choose ONE WORD ONLY from the text for each answer.', items:[

    ['Early rubber became sticky in','heat',''],

    ['The designer of the Gem clip is','unknown',''],
    ['Art Fry\'s paper bookmarks kept falling out of his hymn','book',''],
    ['Sundback designed interlocking','teeth','']]},
   {type:'tfng', instr:'Do the following statements agree with the information in the text? Write TRUE, FALSE or NOT GIVEN.', items:[

    ['Zips were widely used in clothing as soon as Sundback\'s design appeared.','F']]}]}

 ac:{chart:'process', caption:'How rainwater is collected and used in a household system', cycle:false, steps:[
   ['Rain falls on the roof','Water runs off the roof surface'],

  prompt:`The diagram shows how rainwater is collected and used in a household system.<br>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.<br>Write at least 150 words.`,
  model:`The diagram illustrates the process by which rainwater is collected from the roof of a house, stored and then used for household purposes.

Overall, the process consists of eight stages, beginning with rain falling on the roof and ending with the water being used in the home. Filtering takes place at two points, and the system includes an overflow to deal with excess water.

First, rain falls on the roof and runs off its surface into the gutters, which channel it into a downpipe. Before entering storage, the water passes through a leaf filter, where leaves and other large debris are removed. It is then held in an underground storage tank.

When water is needed, a pump sends it up into the house, where it passes through a second, finer filter that removes small particles. The treated water is then used for purposes that do not require drinking-quality water, namely flushing toilets, running the washing machine and watering the garden. If the tank becomes full, the excess water is drained away into the sewer through an overflow pipe.`},
 gt:{prompt:`You have seen an advertisement for a part-time job at a local museum.<br>Write a letter to the museum manager. In your letter:<br>• say which job you are interested in and where you saw it advertised<br>• explain why you would be suitable for the job<br>• say when you would be available to work<br>Write at least 150 words. You do NOT need to write any addresses. Begin your letter: <i>Dear Sir or Madam,</i>`,
  model:`Dear Sir or Madam,

I am writing to apply for the position of part-time visitor guide, which I saw advertised on the noticeboard at the city library last week.

I believe I would be well suited to the role for several reasons. I am currently studying history at university, and I have a particular interest in the local industrial heritage featured in your collection. Last summer, I worked as a volunteer at a heritage railway, where I led groups of visitors and answered their questions, so I am confident speaking to the public. I also speak Hindi and Tamil fluently, which may be useful when helping international visitors.

My lectures take place from Monday to Wednesday, so I would be available to work on Thursdays, Fridays and at weekends. During the university holidays, I could work additional hours if required.

I have attached my CV and would be happy to attend an interview at your convenience.

Yours faithfully,
Priya Nair`},
 t2:{prompt:`Some people believe that university students should be required to study subjects outside their main field, such as arts students studying science and science students studying arts.<br>To what extent do you agree or disagree?<br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.<br>Write at least 250 words.`,
  model:`In some education systems, university students specialise in a single field from the start, while in others they are required to take courses across a range of disciplines. I largely agree that students should study some subjects outside their main field, although such requirements should not take up too much of their degree.

The strongest argument for broader study is that many modern problems cross traditional boundaries. Climate change, for example, involves science, economics, politics and ethics. An engineer who understands how policy is made, or a law student who understands basic statistics, is likely to be more effective in their career. Employers also frequently value communication and critical thinking, which arts and humanities subjects develop.

Furthermore, studying different subjects can help students discover new interests. Many people choose their degree at eighteen, with limited knowledge of the options available. A required course in an unfamiliar area might lead a student to a career they had never considered.

On the other hand, there are legitimate concerns. Degrees in fields such as medicine or engineering already contain a heavy workload, and adding unrelated courses could reduce the time available for essential professional training. Students who are forced to take courses they have no interest in may also make little effort, gaining little from them.

On balance, I believe a modest requirement, perhaps one or two courses outside the main field, offers the benefits of a broader education without seriously weakening specialist training. Universities should also offer courses designed specifically for non-specialists, so that these requirements are genuinely useful.`}
},

readingAc:[
 {title:'The secret life of fungi', paras:[
  ['',`When most people think of fungi, they picture mushrooms. But a mushroom is only the reproductive part of a much larger organism, in the same way that an apple is the fruit of a tree. The main body of most fungi is a network of thread-like structures called hyphae, which spread through soil, wood and other materials, often over large areas, and together form what is known as a mycelium.`],
  ['',`Fungi are neither plants nor animals. Unlike plants, they cannot make their own food from sunlight. Instead, many feed by releasing chemicals called enzymes that break down dead material, such as fallen leaves and wood, and then absorbing the nutrients. Without fungi and bacteria, forests would be buried under dead vegetation, and the nutrients locked in it would not return to the soil.`],
  ['',`One of the most important relationships in nature is that between fungi and plant roots, known as mycorrhizae. The great majority of land plants form such partnerships. The fungus helps the plant absorb water and minerals, particularly phosphorus, from the soil, and in return, the plant supplies the fungus with sugars produced by photosynthesis.`],
  ['',`In the 1990s, research led by the forest ecologist Suzanne Simard suggested that these networks could connect different trees, allowing carbon to pass between them. This idea, popularly called the "wood wide web", attracted enormous public interest. Some popular accounts went further, claiming that mother trees deliberately feed their young through the network or warn neighbours of danger.`],
  ['',`More recently, a number of scientists have argued that the evidence for these stronger claims is weak. A review published in 2023 concluded that, although fungal networks certainly exist, there is limited field evidence that they commonly transfer significant amounts of resources between trees, and little support for the idea that trees use them to help their offspring. The debate continues, but it illustrates how scientific ideas can be simplified as they spread.`],
  ['',`Whatever the outcome of that debate, the practical importance of fungi is clear. Fungi gave us penicillin, the first widely used antibiotic, discovered by Alexander Fleming in 1928. They are essential for making bread and many drinks, through the action of yeast, which is itself a fungus. And researchers are now exploring the use of mycelium to create packaging and building materials that could replace some plastics.`]],

 {title:'Measuring national wellbeing', paras:[
  ['A',`For most of the twentieth century, the success of a country's economy was judged largely by one number: gross domestic product, or GDP, the total value of goods and services produced. GDP was developed in the 1930s and 1940s, partly to help governments manage their economies during the Great Depression and the Second World War.`],
  ['B',`Even one of its creators warned against misusing it. The economist Simon Kuznets, who developed early national income accounts for the United States, wrote in 1934 that the welfare of a nation could scarcely be inferred from a measure of national income.`],
  ['C',`GDP's limitations are well known. It counts activities that may harm wellbeing, such as cleaning up after a disaster, as positive. It ignores unpaid work, such as caring for children or elderly relatives, even though this has great value. And it says nothing about how income is distributed: GDP can rise while most people's incomes stay the same.`],
  ['D',`In response, several countries have developed additional measures. Bhutan is famous for its concept of Gross National Happiness, which the country has used as a guide to policy. In 2010, the United Kingdom began measuring national wellbeing, including asking people how satisfied they are with their lives. New Zealand introduced a "wellbeing budget" in 2019, requiring government spending to be assessed against goals such as mental health and child poverty.`],
  ['E',`Measuring wellbeing raises its own difficulties. Questions about life satisfaction rely on how people feel when asked, which may be affected by temporary events such as the weather. People in different cultures may also interpret such questions differently, making international comparisons uncertain.`],
  ['F',`There is also a risk that wellbeing measures become a distraction. Critics argue that governments may prefer to talk about happiness rather than address problems such as low pay or poor housing, which can be measured more directly.`],
  ['G',`Most economists now agree that GDP alone is not enough, but that it remains useful, particularly for measuring economic activity in the short term. The challenge is to use it alongside other measures, rather than to replace it entirely.`]],
  groups:[
   {type:'headings', instr:'The passage has seven paragraphs, A to G. Choose the correct heading for each paragraph from the list of headings.', options:[['i','Problems with the alternative'],['ii','An early warning'],['iii','Using several measures together'],['iv','The origins of a single number'],['v','What one figure leaves out'],['vi','A convenient way to avoid hard issues'],['vii','New approaches around the world'],['viii','Why wellbeing has fallen']], items:[

 {title:'Is handwriting still worth teaching?', paras:[
  ['A',`In many schools, children now spend more time typing than writing by hand, and some education systems have reduced or removed the requirement to teach joined-up handwriting. To some, this seems a sensible response to a digital world. To others, it represents a serious loss. Having looked at the research, I believe the truth lies between these positions, though closer to the second than many people assume.`],
  ['B',`The most persuasive evidence concerns early literacy. Several studies suggest that young children who practise forming letters by hand recognise them more easily than those who learn by typing. One explanation is that writing a letter requires the child to produce its shape from memory, step by step, which strengthens their mental image of it, whereas pressing a key requires only recognition.`],
  ['C',`Research on note-taking is often cited too. A well-known study published in 2014 found that university students who took notes by hand performed better on conceptual questions than those who typed. The researchers suggested that because handwriting is slower, students had to summarise ideas in their own words, while typists tended to copy lectures word for word. However, a later attempt to repeat this study produced less clear results, so I would not rely too heavily on it.`],
  ['D',`None of this means that typing should not be taught. It clearly should: most writing in adult life is done on keyboards, and pupils who type fluently can produce longer and better-organised work. The question is not which skill to teach, but how to balance them.`],
  ['E',`It is sometimes argued that handwriting matters because it is part of a culture's heritage, and that people who cannot read joined-up writing will be unable to read historical documents. I find this argument weak. Most people never need to read historical manuscripts, and those who do can learn the necessary skills when required.`],
  ['F',`My own view, then, is that handwriting should continue to be taught carefully in the early years, when the evidence for its benefits is strongest, while typing should be introduced alongside it as children grow older. Whether children need to learn joined-up writing, rather than clear printed letters, seems to me a much less important question.`]],

 {title:'Section 3', texts:[
  {title:'Lighthouses: a history', paras:[
   ['A',`For thousands of years, sailors have relied on lights on the coast to guide them. The most famous early lighthouse was the Pharos of Alexandria in Egypt, completed in the third century BCE. It was one of the Seven Wonders of the Ancient World and stood for many centuries before it was destroyed by earthquakes.`],
   ['B',`Early lighthouses used open fires of wood or coal, which gave a weak and unreliable light. Later, candles and oil lamps were used, but much of their light was lost because it spread in all directions.`],
   ['C',`A major improvement came in 1822, when the French physicist Augustin-Jean Fresnel developed a new type of lens. Made of many rings of glass, it was much thinner and lighter than a conventional lens of the same size, and it could focus light into a powerful beam visible many miles away.`],
   ['D',`To help sailors identify them, lighthouses developed individual patterns of flashes, known as their "character". A sailor seeing, for example, two flashes every ten seconds could check a chart and know exactly which lighthouse it was.`],
   ['E',`Life for lighthouse keepers was often lonely and difficult, especially at lighthouses built on isolated rocks far out at sea. Keepers worked in shifts to ensure the light never went out, and in bad weather they could be cut off from the mainland for weeks.`],
   ['F',`During the twentieth century, lighthouses were gradually automated. In the United Kingdom, the last staffed lighthouse in England and Wales, North Foreland in Kent, was automated in 1998. Today, satellite navigation means lighthouses are less essential, but many are still maintained as a back-up and as important historical buildings.`]]}],

  prompt:`The maps show the village of Ashford in 2000 and today.<br>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.<br>Write at least 150 words.`,
  model:`The two maps illustrate the changes that have taken place in the village of Ashford between 2000 and the present day.

Overall, the village has become considerably more developed and residential, with much of the countryside north of the main road replaced by housing and parking, although the area south of the road has changed relatively little.

In 2000, the land to the north of the main road consisted entirely of countryside, with farmland in the north-west and a forest in the north-east. Today, the farmland has been replaced by a large housing estate, and the forest has been reduced to roughly half its original size, with a car park built on the cleared land next to the road.

South of the main road, the row of houses remains unchanged. However, the small shop in the south-west has been replaced by a supermarket, and the school has been extended to the east. Finally, a new path has been built along the bank of the river, which runs along the southern edge of the village.`},
 gt:{prompt:`You are going to be away from your home for two weeks and a neighbour has agreed to look after it.<br>Write a letter to your neighbour. In your letter:<br>• thank them for agreeing to help<br>• explain what you would like them to do<br>• tell them how to contact you while you are away<br>Write at least 150 words. You do NOT need to write any addresses. Begin your letter: <i>Dear ...,</i>`,
  model:`Dear Mrs Patel,

Thank you so much for agreeing to keep an eye on the house while we are in Canada. It is a great relief to know that someone we trust will be close by, and we really appreciate it.

There are just a few things I would be grateful if you could do. Could you please collect our post from the doormat every couple of days and leave it on the kitchen table? The plants in the front room need watering twice a week, and the tomatoes in the greenhouse will need a little water every day if the weather is hot. Finally, our bins are collected on Tuesday mornings, so it would be very kind if you could put the green bin out on Monday evening.

The spare key is in the envelope with this letter. If anything goes wrong, you can call or message me on my mobile, 07700 900123, as I will have it with me at all times. The time difference is five hours, so please don't worry if I reply late.

Many thanks again,
Sunita`},
 t2:{prompt:`In many workplaces, employees now work from home for some or all of the week.<br>Do the advantages of this trend outweigh the disadvantages?<br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.<br>Write at least 250 words.`,
  model:`Since the pandemic, working from home has become normal for many office workers, with large numbers now dividing their week between home and the office. In my opinion, the advantages of this trend outweigh its disadvantages, provided that it is managed carefully.

The benefits for employees are considerable. Many people in large cities spend over an hour commuting each day, and working from home allows them to use this time for rest, exercise or family. It also gives greater flexibility to parents and carers, and it can open up jobs to people who live far from major cities or who have disabilities that make travel difficult. For employers, remote work can reduce office costs and make it possible to recruit talented staff from a much wider area.

There are, however, real disadvantages. Some workers feel isolated at home, and the boundary between work and personal life can become blurred, leading to longer working hours. Younger employees, in particular, may miss out on learning informally from experienced colleagues, which happens naturally in an office. Collaboration and creativity can also suffer when teams rarely meet in person.

These problems, though, can largely be reduced through a hybrid approach. Many companies now ask teams to come into the office on the same two or three days each week, so that meetings, training and social contact take place in person, while focused individual work is done at home.

In conclusion, while working from home brings genuine challenges, I believe its benefits for wellbeing, flexibility and opportunity are greater, especially when it is combined with regular time in the office.`}
},

const canSpeak = 'speechSynthesis' in window;
let accent = store.get('accent','en-GB'), voice = null, curUtter = null;
function pickVoice(){
  if(!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>v.lang.replace('_','-')===accent && /natural|google|premium|enhanced/i.test(v.name)) || vs.find(v=>v.lang.replace('_','-')===accent) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function voiceFor(lg){ if(!canSpeak) return null; const vs = speechSynthesis.getVoices(); return vs.find(v=>v.lang.replace('_','-')===lg) || null; }
function say(text, rate=.95, btn, lang){
  if(!canSpeak || !text) return;
  const s = speechSynthesis;
  document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
  const go = () => {
    curUtter = new SpeechSynthesisUtterance(text); const lg = lang || accent; curUtter.lang = lg; const vv = lg===accent ? voice : voiceFor(lg); if(vv) curUtter.voice = vv; curUtter.rate = rate;
    if(btn){ btn.classList.add('on'); curUtter.onend = curUtter.onerror = () => btn.classList.remove('on'); }
    s.resume(); s.speak(curUtter);
  };
  if(s.speaking || s.pending){ s.cancel(); setTimeout(go,120); } else go();
}

/* ---------- markdown (for Vincy) ---------- */
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines = String(src||'').replace(/\r/g,'').split('\n'); let out = '', list = null, para = [];
  const flush = () => { if(para.length){ out += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for(const raw of lines){
    const l = raw.trimEnd(); let m;
    if(!l.trim()){ flush(); close(); continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)/))){ flush(); if(list!=='ul'){ close(); out += '<ul>'; list='ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ flush(); if(list!=='ol'){ close(); out += '<ol>'; list='ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if((m = l.match(/^#{1,4}\s+(.*)/))){ flush(); close(); out += `<p><b>${inline(m[1])}</b></p>`; continue; }
    close(); para.push(l);
  }
  flush(); close(); return out;
}

const normA = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
$('page').addEventListener('click', e=>{
  const o = e.target.closest('.opt');
  if(o){
    const q = o.closest('.q'); if(q.dataset.done) return; q.dataset.done = '1';
    const a = +q.dataset.ans, pick = +o.dataset.opt;
    q.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled = true; if(j===a) b.classList.add('right'); });
    if(pick!==a) o.classList.add('wrong'); else q.dataset.ok = '1';
    const w = q.querySelector('.why'); if(w.innerHTML.trim()) { w.innerHTML = (pick===a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+w.innerHTML; w.hidden = false; } else if(pick!==a){ w.innerHTML = '<b>Not quite.</b> The right answer is highlighted.'; w.hidden = false; }
    const quiz = q.closest('.quiz'), qs = quiz.querySelectorAll('.q'), answered = quiz.querySelectorAll('.q[data-done]').length;
    if(answered===qs.length){
      const ok = quiz.querySelectorAll('.q[data-ok]').length, sc = quiz.querySelector('.score');
      sc.hidden = false;
      sc.innerHTML = `<b>${ok}/${qs.length}</b><span>${ok===qs.length?'Perfect score.':ok>=qs.length*.6?'Good work. Review the explanations above.':'Worth another look. Read the pattern again, then retry.'}</span><span class="hspace" style="flex:1"></span><button class="btn ghost sm quiz-reset">Try again</button>`;
    }
    return;
  }
  if(e.target.closest('.quiz-reset')){
    const quiz = e.target.closest('.quiz');
    quiz.querySelectorAll('.q').forEach(q=>{ delete q.dataset.done; delete q.dataset.ok; q.querySelectorAll('.opt').forEach(b=>{ b.disabled=false; b.classList.remove('right','wrong'); }); const w = q.querySelector('.why'); w.hidden = true; w.innerHTML = w.innerHTML.replace(/^<b>(Correct\.|Not quite\.)<\/b> ?/,'').replace(/^The right answer is highlighted\.$/,''); });
    quiz.querySelector('.score').hidden = true; return;
  }
  const gc = e.target.closest('.gap-check'), gs = e.target.closest('.gap-show');
  if(gc || gs){
    const box = (gc||gs).closest('.gaps'); let ok = 0; const ins = box.querySelectorAll('.gap-in');
    ins.forEach(inp=>{
      const answers = inp.dataset.ans.split('|');
      if(gs){ inp.value = answers[0]; }
      const right = answers.some(a=>normA(a)===normA(inp.value));
      inp.classList.toggle('ok', right); inp.classList.toggle('no', !right && !!inp.value.trim());
      if(right) ok++;
      const w = inp.closest('.q').querySelector('.why'), base = esc(w.dataset.base||'');
      if(right) w.innerHTML = `<b>${gs?'Answer.':'Correct.'}</b> ${base}`;
      else if(inp.value.trim()) w.innerHTML = `<b>Answer:</b> ${esc(answers.join(' / '))}. ${base}`;
      w.hidden = !(right || inp.value.trim());
    });
    if(gc){ const sc = box.querySelector('.score'); sc.hidden = false; sc.innerHTML = `<b>${ok}/${ins.length}</b><span>${ok===ins.length?'All correct.':'Fix the red ones, or ask Vincy why.'}</span>`; }
    return;
  }
  const dc = e.target.closest('.d-chk');
  if(dc){
    const box = dc.closest('.dict'), tgt = box.dataset.target, got = box.querySelector('.d-in').value;
    const n = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
    const tw = n(tgt).split(' '), gw = n(got).split(' ');
    const res = box.querySelector('.res');
    if(!got.trim()){ res.innerHTML = '<span style="color:var(--muted)">Play the sentence, then type it.</span>'; return; }
    if(n(tgt)===n(got)) res.innerHTML = `<span style="color:var(--ok);font-weight:700">Perfect.</span> ${esc(tgt)}`;
    else { const marked = tw.map((w,i)=> gw[i]===w ? esc(w) : `<b style="color:var(--bad)">${esc(w)}</b>`).join(' '); res.innerHTML = `<span style="font-weight:700">Close. Check the highlighted words:</span> ${marked}`; }
    return;
  }
  const fb = e.target.closest('.fb-btn'); if(fb){ writingFeedback(fb.closest('.task')); return; }
});

function setBusy(b){
  busy = b; const s = $('vincySend');
  s.innerHTML = b ? I.stop : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  s.setAttribute('aria-label', b ? 'Stop Vincy' : 'Send');

async function ask(q, shown){
  q = (q||'').trim(); if(!q || busy) return;
  if($('vincyPanel').hidden) openVincy();
  addMsg(shown || q, 'me');
  if(!sampleReady){ const w = addMsg('<span class="thinking">Connecting…</span>'); for(let i=0;i<40 && !sampleReady;i++) await new Promise(r=>setTimeout(r,250)); w.closest('.msg').remove(); }
  if(!sample){ addMsg(offlineRespond(q)); return; }
  turns.push({role:'user', content:q});
  if(turns.length > MAX_TURNS) turns = turns.slice(-MAX_TURNS);
  while(turns.length && turns[0].role!=='user') turns.shift();
  const bub = addMsg('Thinking…'); bub.classList.add('thinking');
  setBusy(true); ctl = new AbortController();
  try{
    const { text } = await sample([{role:'user', content:rules()}, ...turns], {
      cache:false, signal:ctl.signal,
      onText: ({text}) => { bub.classList.remove('thinking'); bub.innerHTML = md(text); $('vincyBody').scrollTop = $('vincyBody').scrollHeight; }
    });
    bub.classList.remove('thinking'); bub.innerHTML = md(text);
    turns.push({role:'assistant', content:text});
  }catch(e){
    bub.classList.remove('thinking');
    const keep = e && e.text ? md(e.text) : '';
    if(e && e.code==='cancelled'){ bub.innerHTML = keep || '<i>Stopped.</i>'; if(e.text) turns.push({role:'assistant', content:e.text}); }
    else { bub.innerHTML = keep + `<p style="color:var(--bad)">${esc(errCopy(e && e.code))}</p>`; turns.pop(); }
  }finally{ setBusy(false); $('vincyBody').scrollTop = $('vincyBody').scrollHeight; }
}

async function writingFeedback(task){
  const txt = task.querySelector('textarea').value.trim(), out = task.querySelector('.fb-out');
  const btn = task.querySelector('.fb-btn');
  if(txt.split(/\s+/).length < 5){ out.innerHTML = `<div class="fb">Write at least a sentence or two first, then ask Vincy for feedback.</div>`; return; }
  if(!sampleReady){ out.innerHTML = `<div class="fb">Connecting to Vincy…</div>`; for(let i=0;i<40 && !sampleReady;i++) await new Promise(r=>setTimeout(r,250)); }
  if(!sample){
    const model = task.dataset.model;
    out.innerHTML = `<div class="fb"><div class="who">${mascot()}Vincy</div>Live feedback works when this page is opened in Claude. ${model?'Meanwhile, compare your answer with the model answer: check tenses, linking words and register.':'Meanwhile, re-read your answer and check tenses, linking words and register.'}</div>`; return;
  }
  const l = LMAP[current];
  const prompt = `You are Vincy, an expert English writing tutor for CEFR B1–C2 learners. Give feedback on a learner's answer.

Lesson: "${l.t}" (${LV[l.lv].name}, ${LV[l.lv].cefr}).
Task: ${task.dataset.task}
${task.dataset.model ? 'Model answer (for your reference only, do not just repeat it): ' + task.dataset.model : ''}

Learner's answer:
"""
${txt.slice(0,4000)}
"""

Reply in simple Markdown (bold, italics, bullet lists; no headings or tables), in this order:
1. One encouraging sentence and an estimated CEFR level for this piece of writing.
2. **What works**: two short bullets.
3. **Corrections**: up to five bullets, each showing *original* → **corrected** with a one-line reason. Focus on the lesson's target language first.
4. **Upgraded version**: the learner's text rewritten at one level higher, keeping their ideas.
Keep it under 280 words.`;
  btn.disabled = true;
  out.innerHTML = `<div class="fb"><div class="who">${mascot()}Vincy</div><div class="md thinking-text" style="color:var(--muted)">Reading your answer…</div></div>`;
  const body = out.querySelector('.md');
  try{
    const { text } = await sample(prompt, { cache:false, onText: ({text}) => { body.style.color = ''; body.innerHTML = md(text); } });
    body.style.color = ''; body.innerHTML = md(text);
  }catch(e){ body.style.color = ''; body.innerHTML = (e && e.text ? md(e.text) : '') + `<p style="color:var(--bad)">${esc(errCopy(e && e.code))}</p>`; }
  finally{ btn.disabled = false; }
}

/* offline fallback: answers from the app's own content */
function offlineRespond(q){
  const n = q.toLowerCase();
  if(/quiz|test me|practi[sc]e/.test(n)){
    const pool = (current ? [LMAP[current]] : LESSONS).flatMap(l=>l.blocks.filter(b=>b.k==='mc').flatMap(b=>b.items.map(it=>({it, l}))));
    const all = pool.length ? pool : LESSONS.flatMap(l=>l.blocks.filter(b=>b.k==='mc').flatMap(b=>b.items.map(it=>({it,l}))));
    const {it:[qq,opts,a,why], l} = all[Math.floor(Math.random()*all.length)];
    return `<p><b>Quick question</b> from <i>${esc(l.t)}</i>:</p><p>${qq}</p><div class="opts" data-l="${l.lv}">${opts.map((o,j)=>`<button class="opt" data-lq="${j===a?1:0}" data-why="${esc(strip(why||''))}">${o}</button>`).join('')}</div>`;
  }
  if(current && /explain|lesson|this|what is/.test(n)){
    const l = LMAP[current]; const tips = l.blocks.find(b=>b.k==='tips');
    return `<p><b>${esc(l.t)}</b>: ${l.intro}</p>${tips?`<p>Key point: ${tips.items[0].replace(/^!/,'')}</p>`:''}`;
  }
  const words = n.replace(/[^a-z ]/g,' ').split(' ').filter(w=>w.length>3 && !/^(what|about|where|which|there|should|could|would|explain|help|with|this|that|find|lesson|learn|study)$/.test(w));
  const hits = LESSONS.map(l=>({l, s:words.filter(w=>l.index.includes(w)).length + words.filter(w=>l.t.toLowerCase().includes(w)).length*3})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,3);
  if(hits.length) return `<p>These lessons look relevant:</p><div class="row">${hits.map(h=>`<button class="chip-btn" data-go="${h.l.id}">${esc(h.l.t)}</button>`).join('')}</div>`;
  return `<p>I can’t answer open questions in this view. Try “quiz me”, “explain this lesson”, or a topic such as “passive” or “idioms”.</p>`;
}

  return {word:v.w, found:true, level:v.lvl, ipa_uk:m?m[0]:'', ipa_us:'', note_pron:v.pron.replace(m?m[0]:'','').trim(),
    senses:v.senses.map((s,i)=>({pos:s.pos, definition:s.meaning, examples:s.ex, synonyms:i===0?words(d.syn):[], antonyms:i===0?words(d.opp):[]})),
    word_family:forms, collocations:splitList(d.col), local:true};

    ${groups.map(g=>`<div class="d-pos-h"><span class="pos-tag" data-pos="${esc(g.pos)}">${esc(g.pos)}</span></div>
      <ol class="d-senses">${g.list.map(s=>`<li><div class="d-def">${s.grammar?`<span class="d-gram">${esc(s.grammar)}</span>`:''}${s.register?`<span class="d-reg">${esc(s.register)}</span>`:''}${esc(s.definition)}</div>
        ${(s.examples||[]).length?`<ul class="d-ex">${s.examples.map(x=>`<li><span>${esc(x)}</span>${sayBtn(x)}</li>`).join('')}</ul>`:''}

function dictPrompt(q){
  return `You are an expert English-to-English learner's dictionary, as detailed and accurate as the Oxford Advanced Learner's Dictionary, for learners at CEFR B1 to C2 (many of them speakers of Indian languages).
Write the entry for: "${q.slice(0,80)}"

Reply with ONLY a JSON object of this shape:
{"word":"the headword in its dictionary form","found":true,"suggestions":[],"ipa_uk":"/…/","ipa_us":"/…/","syllables":"ex·am·ple","level":"CEFR level such as B2","frequency":"very common | common | less common | rare",
"senses":[{"pos":"noun | verb | adjective | adverb | preposition | conjunction | pronoun | determiner | interjection | phrasal verb | idiom","grammar":"short grammar label such as [countable], [transitive], + to infinitive, or empty","register":"formal | informal | literary | technical | old-fashioned | British | American, or empty","definition":"clear definition in simple English that does not use the headword","examples":["three natural, varied sentences"],"synonyms":["up to 4"],"antonyms":["up to 3"]}],
"forms":[{"label":"plural | third person | past simple | past participle | -ing form | comparative | superlative","form":"…"}],
"word_family":[{"word":"…","pos":"…"}],
"collocations":["up to 8 common collocations"],
"phrases":[{"phrase":"idiom or phrasal verb with this word","meaning":"…","example":"…"}],
"usage_note":"one or two sentences on how the word is really used, or empty","common_mistake":"a typical learner mistake and the correct form, or empty","british_american":"any spelling, meaning or pronunciation difference, or empty","etymology":"one sentence on the origin"}

Rules: list senses for EVERY part of speech the word commonly has, most common first, at most 8 senses in total. Give exactly three example sentences for each sense. Include only real, common phrases. If the input is misspelt or not English, set "found" to false, leave "senses" empty and put up to five likely intended words in "suggestions".`;
}
async function lookup(raw){
  const q = String(raw||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!q){ dictHome(); return; }
  const seq = ++dictSeq;
  dictRecent = [q, ...dictRecent.filter(w=>w!==q)].slice(0,10); store.set('dictRecent', dictRecent);
  if(dictCache.has(q)){ $('dictBody').innerHTML = renderEntry(dictCache.get(q)); $('dictBody').scrollTop = 0; return; }
  const local = localEntry(q);
  if(!sampleReady){ $('dictBody').innerHTML = `<div class="d-status"><span class="spin"></span>Connecting…</div>`; for(let i=0;i<40 && !sampleReady;i++) await new Promise(r=>setTimeout(r,250)); if(seq!==dictSeq) return; }
  if(!sample){
    if(local){ $('dictBody').innerHTML = `<div class="d-status">This short entry comes from the app's word list. Full entries work when this page is opened in Claude.</div>` + renderEntry(local); return; }
    const near = VOCAB.filter(v=>v.w.startsWith(q.slice(0,2))).slice(0,6);
    $('dictBody').innerHTML = `<div class="d-empty"><h4>No entry for “${esc(q)}” in this view</h4><p>Full dictionary entries work when this page is opened in Claude. The app's own word list doesn't include this word.</p>${near.length?`<div class="d-rel"><span>Nearby words:</span>${near.map(v=>`<button class="d-chip" data-dword="${esc(v.w)}">${esc(v.w)}</button>`).join('')}</div>`:''}</div>`;
    return;
  }
  $('dictBody').innerHTML = `<div class="d-status"><span class="spin"></span>Writing the full entry for “${esc(q)}”. This usually takes a few seconds.</div>` + (local ? renderEntry(local) : '');
  $('dictBody').scrollTop = 0;
  try{
    const d = await sample.json(dictPrompt(q));
    if(seq!==dictSeq) return;
    if(!d || typeof d!=='object') throw {code:'invalid_json'};
    if(d.found===false || !(d.senses||[]).length){
      const sug = (d.suggestions||[]).filter(Boolean);
      $('dictBody').innerHTML = `<div class="d-empty"><h4>No entry found for “${esc(q)}”</h4><p>Check the spelling and try again.</p>${sug.length?`<div class="d-rel"><span>Did you mean:</span>${sug.map(w=>`<button class="d-chip" data-dword="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}</div>`;
      return;
    }
    d.word = d.word || q;
    dictCache.set(q, d);
    $('dictBody').innerHTML = renderEntry(d); $('dictBody').scrollTop = 0;
  }catch(e){
    if(seq!==dictSeq) return;
    const msg = e && e.code==='invalid_json' ? 'The entry came back incomplete. Press Look up to try again.' : errCopy(e && e.code);
    $('dictBody').innerHTML = `<div class="d-status" style="background:var(--bad-soft)">${esc(msg)}</div>` + (local ? renderEntry(local) : '');
  }
}

const SP_LV = Object.fromEntries(SPEECH.map(l=>[l.id,l]));
const SP_COUNT = SPEECH.reduce((n,l)=>n+l.sets.reduce((m,s)=>m+s.words.length,0),0);

let spLevel = 'beg';

let recBusy = false;
const spKey = w => String(w).toLowerCase();
const spBand = s => s>=85 ? 'great' : s>=70 ? 'good' : s>=50 ? 'ok' : 'bad';

function spStatusHTML(){
  if(inClaude) return `<div class="sp-status warn">${I.mic}<div><b>Recording is switched off inside Claude.</b> Pages opened in Claude can't use the microphone, so the Record button won't work here. Everything else does: listen, repeat aloud and compare. To record yourself and get a clarity score, open the app file in Chrome or Edge.</div></div>`;

  return `<div class="sp-status ok">${I.mic}<div><b>How the check works.</b> Press Record and say the word once. A speech recogniser trained on native ${accent==='en-GB'?'British':'American'} English tries to recognise it. If it understands your word, you were clear, and the score reflects how sure it was. It checks clarity rather than every detail of your accent, so also compare your recording with the native voice. Change the accent with UK / US at the top.</div></div>`;
}
function customWord(w){
  const v = VOCAB.find(x=>x.w.toLowerCase()===w.toLowerCase());
  const m = v && v.pron.match(/\/[^/]+\//);
  for(const L of SPEECH) for(const s of L.sets) for(const x of s.words) if(x.w.toLowerCase()===w.toLowerCase()) return x;
  return {w, uk: m ? m[0] : '', us:'', r:'', tip: v ? `${v.senses[0].pos}: ${v.senses[0].meaning}` : 'Your own word. Listen to the native voice first, then record yourself.'};

    <div class="sp-top"><div class="sp-head"><div class="sp-word">${esc(w.w)}</div>${w.r?`<div class="sp-resp" title="How it sounds, with the stressed syllable in capitals">${esc(w.r)}</div>`:''}</div>${best!=null?`<span class="sp-best ${spBand(best)}" title="Your best score">${best}</span>`:''}</div>
    ${w.uk||w.us?`<div class="sp-ipa">${w.uk?`<span><b>UK</b> ${esc(w.uk)}</span>`:''}${w.us?`<span><b>US</b> ${esc(w.us)}</span>`:''}</div>`:''}

    <div class="sp-res" aria-live="polite"></div>

function renderSpeech(level, custom){

/* ---------- scoring ---------- */
const normW = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){ const cur = [i]; for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev = cur; }
  return prev[n];
}
function scoreSpeech(target, alts){
  const t = normW(target), tc = t.replace(/[ ']/g,'');
  const heard = alts.length ? alts[0].t.trim() : '';
  let idx = -1;
  alts.forEach((a,i)=>{ if(idx>=0) return; const n = normW(a.t); if(n===t || n.replace(/[ ']/g,'')===tc || (' '+n+' ').includes(' '+t+' ')) idx = i; });
  if(idx===0){
    const c = alts[0].c>0 ? Math.min(1, alts[0].c) : .85, score = Math.round(70 + 30*c);
    return {score, label: score>=85 ? 'Very clear' : 'Clear', msg: `The recogniser understood “${heard}” straight away.` + (score>=85 ? ' Excellent.' : ' It was a little unsure, so compare with the native voice and try for a higher score.')};
  }
  if(idx>0) return {score: Math.max(50, 62 - idx*4), label:'Nearly', msg:`Its first guess was “${heard}”, but your word was among its other guesses. Listen again and focus on the tip above.`};
  const sim = alts.length ? Math.max(...alts.map(a=>{ const n = normW(a.t).replace(/[ ']/g,''); return 1 - lev(n, tc)/Math.max(n.length, tc.length, 1); })) : 0;
  return {score: Math.max(5, Math.round(sim*49)), label:'Try again', msg: heard ? `The recogniser heard “${heard}” instead. Listen to the native voice, read the tip and try again slowly.` : `The recogniser couldn't make out a word. Try again, a little louder and closer to the microphone.`};
}
const SR_ERR = {
  'no-speech':'I didn’t hear anything. Check that your microphone is on, then speak a little louder and try again.',
  'audio-capture':'No microphone was found. Connect one and try again.',
  'not-allowed':'Speech checking is blocked. Allow the microphone for this page in your browser settings, then try again.',
  'service-not-allowed':'This browser blocks speech checking on this page. Try Chrome or Edge.',
  'network':'Speech checking needs an internet connection. Your recording is still available below.',
  'language-not-supported':'Speech checking isn’t available for this accent in your browser. Try switching between UK and US.'
};

/* ---------- recording ---------- */
async function recordCard(card){
  if(recBusy) return;
  const word = card.dataset.word, res = card.querySelector('.sp-res'), btn = card.querySelector('[data-rec]');
  if(inClaude){ res.innerHTML = `<div class="sp-out ok"><p><b>Recording isn't available inside Claude.</b> Pages opened in Claude can't use the microphone. Open the app file in Chrome or Edge to record and get a score. For now, say the word aloud along with the native voice.</p></div>`; return; }
  if(!canRecord){ res.innerHTML = `<div class="sp-out ok"><p>This browser can't record audio. Try the latest Chrome, Edge or Safari.</p></div>`; return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ res.innerHTML = `<div class="sp-out bad"><p>The microphone is blocked. Allow microphone access for this page in your browser's settings, then press Record again.</p></div>`; return; }
  recBusy = true; card.classList.add('recording'); btn.innerHTML = I.mic+'Listening…'; btn.disabled = true;
  res.innerHTML = `<div class="sp-live"><span class="dot"></span><span>Say “${esc(word)}” now</span><div class="meter"><i></i></div></div>`;
  let ac = null, raf = 0, peak = 0;
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize), bar = res.querySelector('.meter i');
    const tick = () => { an.getByteTimeDomainData(buf); let m = 0; for(const v of buf) m = Math.max(m, Math.abs(v-128)); peak = Math.max(peak, m); if(bar) bar.style.width = Math.min(100, m/128*220)+'%'; raf = requestAnimationFrame(tick); };
    tick();
  }catch(e){}
  const chunks = []; let mr = null;
  try{ mr = new MediaRecorder(stream); mr.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); }; mr.start(); }catch(e){ mr = null; }
  let alts = null, err = null;
  await new Promise(resolve=>{
    if(!SRClass){ setTimeout(resolve, 3000); return; }
    const r = new SRClass(); r.lang = accent; r.maxAlternatives = 5; r.interimResults = false; r.continuous = false;
    r.onresult = e => { alts = Array.from(e.results[0]).map(a=>({t:a.transcript, c:a.confidence})); };
    r.onerror = e => { err = e.error || 'error'; };
    r.onend = () => resolve();
    try{ r.start(); }catch(e){ err = 'start'; resolve(); }
    setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 6000);
  });
  const blob = await new Promise(resolve=>{
    if(!mr || mr.state==='inactive') return resolve(null);
    mr.onstop = () => resolve(chunks.length ? new Blob(chunks, {type: mr.mimeType || 'audio/webm'}) : null);
    try{ mr.stop(); }catch(e){ resolve(null); }
  });
  stream.getTracks().forEach(t=>t.stop()); cancelAnimationFrame(raf); try{ ac && ac.close(); }catch(e){}
  recBusy = false; card.classList.remove('recording'); btn.disabled = false; btn.innerHTML = I.mic+'Record again';
  showSpeechResult(card, word, alts, err, blob ? URL.createObjectURL(blob) : null, peak);
}
function showSpeechResult(card, word, alts, err, url, peak){
  const res = card.querySelector('.sp-res');
  const mine = url ? `<button class="btn ghost sm" data-playrec="${url}">${I.play}Your recording</button>` : '';
  const native = canSpeak ? `<button class="btn ghost sm" data-say="${esc(word)}" data-rate=".9">${I.speak}Native voice</button>` : '';
  const quiet = peak && peak < 10 ? `<p class="sp-note">Your recording was very quiet. Move closer to the microphone.</p>` : '';
  if(!SRClass){
    res.innerHTML = `<div class="sp-out ok"><p>Play your recording, then the native voice. How close were you?</p>${quiet}<div class="row">${mine}${native}</div><div class="row sp-self"><button class="d-chip" data-selfrate="90">Sounded the same</button><button class="d-chip" data-selfrate="65">Close</button><button class="d-chip" data-selfrate="30">Needs work</button></div></div>`;
    return;
  }
  if(!alts){
    res.innerHTML = `<div class="sp-out bad"><p>${esc(SR_ERR[err] || 'The speech check didn’t work that time. Press Record and try again.')}</p>${quiet}<div class="row">${mine}${native}</div></div>`;
    return;
  }
  const s = scoreSpeech(word, alts);
  saveSpeechScore(card, word, s.score);
  const others = alts.slice(1).map(a=>a.t.trim()).filter(Boolean);
  res.innerHTML = `<div class="sp-out ${spBand(s.score)}"><div class="sp-score"><b>${s.score}</b><span>${s.label}</span></div><p>${esc(s.msg)}</p>${others.length && s.score<70 ? `<p class="sp-note">Other guesses: ${others.map(o=>`“${esc(o)}”`).join(', ')}</p>` : ''}${quiet}<div class="row">${mine}${native}</div></div>`;
}
function saveSpeechScore(card, word, score){
  const k = spKey(word);
  if(score > (spScores[k]||0)){ spScores[k] = score; store.set('spScores', spScores); }
  const best = spScores[k], top = card.querySelector('.sp-top');
  let chip = top.querySelector('.sp-best');
  if(!chip){ chip = document.createElement('span'); top.appendChild(chip); }
  chip.className = 'sp-best ' + spBand(best); chip.textContent = best; chip.title = 'Your best score';
}
let curAudio = null;
$('page').addEventListener('click', e=>{
  const r = e.target.closest('[data-rec]'); if(r){ recordCard(r.closest('.sp-card')); return; }
  const p = e.target.closest('[data-playrec]'); if(p){ try{ curAudio && curAudio.pause(); curAudio = new Audio(p.dataset.playrec); curAudio.play(); }catch(err){} return; }
  const sr = e.target.closest('[data-selfrate]'); if(sr){ const card = sr.closest('.sp-card'); saveSpeechScore(card, card.dataset.word, +sr.dataset.selfrate); sr.parentElement.innerHTML = `<span class="sp-note">Saved. Keep practising until it sounds the same.</span>`; }
});

/* Approximate raw-score-to-band tables (out of 40). Official IELTS figures vary slightly by test version. */
const IE_BANDS = {
  listening: [[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[2,2],[1,1],[0,0]],
  acReading: [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[2,2],[1,1],[0,0]],
  gtReading: [[40,9],[39,8.5],[37,8],[36,7.5],[34,7],[32,6.5],[30,6],[27,5.5],[23,5],[19,4.5],[15,4],[12,3.5],[9,3],[6,2.5],[3,2],[1,1],[0,0]]
};
const rawToBand = (tbl, raw) => { for(const [min,b] of IE_BANDS[tbl]) if(raw>=min) return b; return 0; };
/* Overall band: average rounded to the nearest half band; .25 rounds up to .5 and .75 up to the next whole band. */
function overallBand(bands){
  const avg = bands.reduce((a,b)=>a+b,0)/bands.length, whole = Math.floor(avg), f = +(avg - whole).toFixed(4);
  return {avg, band: f < .25 ? whole : f < .75 ? whole + .5 : whole + 1};
}
const fmtBand = b => Number.isInteger(b) ? b.toFixed(1) : String(b);
const mmss = s => `${Math.floor(s/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
const BAND_OPTS = [9,8.5,8,7.5,7,6.5,6,5.5,5,4.5,4,3.5,3];

function ieChart(b){
  const W = 640, H = 330, m = {l:46, r:110, t:18, b:40}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const xs = i => m.l + i*(iw/(b.years.length-1)), ys = v => m.t + ih - v/100*ih;
  const cols = ['var(--int)','var(--rul)','var(--adv)'];
  let g = '';
  for(let v=0; v<=100; v+=20) g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${ys(v)+4}" text-anchor="end" class="ie-ax">${v}%</text>`;
  b.years.forEach((y,i)=> g += `<text x="${xs(i)}" y="${H-m.b+22}" text-anchor="middle" class="ie-ax">${y}</text>`);
  b.series.forEach(([name,vals],k)=>{
    const pts = vals.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" style="stroke:${cols[k]}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v,i)=> g += `<circle cx="${xs(i)}" cy="${ys(v)}" r="${i===vals.length-1?4.5:3.2}" style="fill:${i===vals.length-1?cols[k]:'var(--panel)'};stroke:${cols[k]}" stroke-width="2"><title>${esc(name)}, ${b.years[i]}: ${v}%</title></circle>`);
    g += `<text x="${xs(vals.length-1)+10}" y="${ys(vals[vals.length-1])+4}" class="ie-lab" style="fill:${cols[k]}">${esc(name)}</text>`;
  });
  return `<figure class="ie-chart"><figcaption>${esc(b.caption)}</figcaption><div class="tw" style="border:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.caption)}">${g}</svg></div></figure>`;
}

  const l = rawToBand('listening', clamp(v('l'))), r = rawToBand(v('rt'), clamp(v('r'))), w = +v('w'), s = +v('s');
  const {avg, band} = overallBand([l,r,w,s]);
  box.querySelector('.ie-calc-out').innerHTML = `<div class="ie-bands">${[['Listening',l],['Reading',r],['Writing',w],['Speaking',s]].map(([n,b])=>`<div><span>${n}</span><b>${fmtBand(b)}</b></div>`).join('')}<div class="ie-overall"><span>Overall</span><b>${fmtBand(band)}</b></div></div><p class="ie-note">Average ${avg.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}, rounded to the nearest half band.</p>`;
}

/* ---------- listening player: reads each line in turn ---------- */
let ieSpeaking = null;
function stopAudio(){ if(ieSpeaking){ ieSpeaking.stopped = true; ieSpeaking = null; } try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.ie-audio').forEach(a=>{ const p = a.querySelector('.ie-play'), s = a.querySelector('.ie-stop'); if(p) p.hidden = false; if(s) s.hidden = true; const pr = a.querySelector('.ie-prog'); if(pr) pr.textContent = ''; }); }
function playAudio(box){
  stopAudio();
  const lines = JSON.parse(box.dataset.lines), run = {stopped:false}; ieSpeaking = run;
  box.querySelector('.ie-play').hidden = true; box.querySelector('.ie-stop').hidden = false;
  const prog = box.querySelector('.ie-prog'), speakers = [...new Set(lines.map(l=>l[0]))];
  const vs = speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-')===accent);
  let i = 0;
  const next = () => {
    if(run.stopped) return;
    if(i >= lines.length){ prog.textContent = 'Finished. Now check your answers.'; box.querySelector('.ie-play').hidden = false; box.querySelector('.ie-play').innerHTML = I.play+'Play again'; box.querySelector('.ie-stop').hidden = true; ieSpeaking = null; return; }
    const [who, text] = lines[i], k = speakers.indexOf(who);
    const u = new SpeechSynthesisUtterance(text); u.lang = accent; u.rate = .95;
    if(vs.length > 1) u.voice = vs[k % vs.length]; else { if(voice) u.voice = voice; u.pitch = k % 2 ? 1.15 : .9; }
    u.onend = () => { i++; setTimeout(next, 350); };
    u.onerror = () => { i++; setTimeout(next, 100); };
    prog.textContent = `Playing ${i+1} of ${lines.length}`;
    curUtter = u; speechSynthesis.speak(u);
  };
  speechSynthesis.cancel(); setTimeout(next, 150);
}

const ieTimers = new Map();

function ieTimer(box){
  const btn = box.querySelector('.ie-timer'), clock = box.querySelector('.ie-clock'), total = +box.dataset.secs;
  let st = ieTimers.get(box);
  if(st && st.running){ clearInterval(st.h); st.running = false; btn.innerHTML = I.play+'Resume timer'; return; }
  if(!st || st.left <= 0) st = {left: total};
  st.running = true; btn.innerHTML = I.stop+'Pause timer'; ieTimers.set(box, st);
  st.h = setInterval(()=>{
    if(!document.body.contains(box)){ clearInterval(st.h); return; }

    if(st.left <= 0){ clearInterval(st.h); st.running = false; clock.textContent = "Time's up"; btn.innerHTML = I.play+'Start again'; }
  }, 1000);
}
async function ieFeedback(box){
  const txt = box.querySelector('.ie-text').value.trim(), out = box.querySelector('.fb-out'), btn = box.querySelector('.ie-fb');
  const task = +box.dataset.task, gt = box.dataset.gt==='1', n = wordCount(txt), min = +box.dataset.min;
  if(n < 40){ out.innerHTML = `<div class="fb">Write at least a few paragraphs first. The examiner-style estimate needs a complete answer (${min}+ words).</div>`; return; }
  if(!sampleReady){ out.innerHTML = `<div class="fb">Connecting to Vincy…</div>`; for(let i=0;i<40 && !sampleReady;i++) await new Promise(r=>setTimeout(r,250)); }
  if(!sample){ out.innerHTML = `<div class="fb"><div class="who">${mascot()}Vincy</div>Band estimates work when this page is opened in Claude. Meanwhile, compare your answer with the model and check: did you answer every part of the task${task===1&&!gt?', and is there a clear overview':''}?${n<min?` You're ${min-n} words under the minimum.`:''}</div>`; return; }
  const crit1 = task===1 ? 'Task Achievement' : 'Task Response';
  const prompt = `You are an experienced IELTS Writing examiner. Assess this ${task===1 ? (gt ? 'General Training Task 1 letter' : 'Academic Task 1 report') : 'Task 2 essay'} using the public IELTS band descriptors.

Task:
${box.dataset.prompt}
${box.dataset.model ? '\nA model answer exists for reference (do not simply compare to it):\n' + box.dataset.model.slice(0,1800) : ''}

Candidate's answer (${n} words; minimum is ${min}):
"""
${txt.slice(0,5000)}
"""

Reply in simple Markdown (bold, bullet lists; no headings or tables), in this order:
1. **Estimated bands**: one bullet each for ${crit1}, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy, then an **Overall** estimate for this task based on the four criteria, which carry equal weight. Give a short reason for each in one line.
2. **What would raise your band**: three specific, practical changes${task===1&&!gt?' (comment explicitly on the overview)':''}${n<min?' (mention the word count penalty)':''}.
3. **Corrections**: up to five bullets, *original* → **corrected**, with a one-line reason.
4. **Improved paragraph**: rewrite the weakest paragraph at about one band higher.
Be honest and calibrated: do not inflate scores. Say clearly that this is an estimate, not an official score. Keep it under 380 words.`;
  btn.disabled = true;
  out.innerHTML = `<div class="fb"><div class="who">${mascot()}Vincy, examiner mode</div><div class="md" style="color:var(--muted)">Reading your answer…</div></div>`;
  const body = out.querySelector('.md');
  try{
    const { text } = await sample(prompt, { cache:false, onText: ({text}) => { body.style.color = ''; body.innerHTML = md(text); } });
    body.style.color = ''; body.innerHTML = md(text);
  }catch(e){ body.style.color = ''; body.innerHTML = (e && e.text ? md(e.text) : '') + `<p style="color:var(--bad)">${esc(errCopy(e && e.code))}</p>`; }
  finally{ btn.disabled = false; }
}

/* ---------- cue card: 1 minute to prepare, 2 minutes to speak ---------- */
async function runCue(card){
  const btn = card.querySelector('.ie-cue-go'), phase = card.querySelector('.ie-phase'), clock = card.querySelector('.ie-clock'), out = card.querySelector('.ie-cue-out');
  if(card.dataset.state === 'prep'){ card.dataset.skip = '1'; return; }        // "Start speaking now" during prep
  if(card.dataset.state === 'speak'){ card.dataset.stop = '1'; return; }       // "Finish" during speaking
  out.innerHTML = ''; card.dataset.skip = ''; card.dataset.stop = '';
  const countdown = (secs, label, btnText, flag) => new Promise(res=>{
    let left = secs; phase.textContent = label; clock.textContent = mmss(left); btn.innerHTML = btnText;
    const h = setInterval(()=>{ left--; clock.textContent = mmss(left); clock.classList.toggle('low', left<=10);
      if(left<=0 || card.dataset[flag] || !document.body.contains(card)){ clearInterval(h); clock.classList.remove('low'); res(); } }, 1000);
  });
  card.dataset.state = 'prep';
  card.querySelector('.ie-notes').focus();
  await countdown(60, 'Prepare', I.next+'Start speaking now', 'skip');
  if(!document.body.contains(card)) return;
  const wantRec = card.querySelector('.ie-rec input')?.checked;
  let stream = null, mr = null, chunks = [];
  if(wantRec){
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); mr = new MediaRecorder(stream); mr.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); }; mr.start(); }
    catch(e){ out.innerHTML = `<p class="ie-note">The microphone is blocked, so this attempt won't be recorded. You can still speak aloud with the timer.</p>`; }
  }
  card.dataset.state = 'speak';
  await countdown(120, mr ? 'Speak now (recording)' : 'Speak now', I.stop+'Finish', 'stop');
  card.dataset.state = '';
  let url = null;
  if(mr){ url = await new Promise(r=>{ mr.onstop = ()=>r(chunks.length ? URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'})) : null); try{ mr.stop(); }catch(e){ r(null); } }); stream.getTracks().forEach(t=>t.stop()); }
  phase.textContent = 'Done'; clock.textContent = '0:00'; btn.innerHTML = I.play+'Try again';
  out.innerHTML = `<div class="sp-out ok"><p><b>Well done.</b> Did you cover every prompt and keep talking until the end? Now answer the follow-up questions aloud.</p>${url?`<div class="row"><button class="btn ghost sm" data-playrec="${url}">${I.play}Listen to your answer</button></div>`:''}</div>`;
}

/* ---------- bar chart for Writing Task 1 ---------- */
function barChartSVG(w){
  const W = 640, H = 340, m = {l:46, r:16, t:16, b:70}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const max = Math.max(...w.series.flatMap(s=>s[1])), top = Math.ceil(max/20)*20 || 20;
  const ys = v => m.t + ih - v/top*ih, gw = iw / w.cats.length, bw = Math.min(26, (gw-18)/w.series.length);
  const cols = ['var(--rul)','var(--adv)','var(--int)'];
  let g = '';
  for(let v=0; v<=top; v+=20) g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)"/><text x="${m.l-8}" y="${ys(v)+4}" text-anchor="end" class="ie-ax">${v}%</text>`;
  w.cats.forEach((c,i)=>{
    const x0 = m.l + i*gw + (gw - bw*w.series.length - 4*(w.series.length-1))/2;
    w.series.forEach(([nm,vals],k)=>{ const x = x0 + k*(bw+4), v = vals[i];
      g += `<rect x="${x}" y="${ys(v)}" width="${bw}" height="${ys(0)-ys(v)}" rx="3" style="fill:${cols[k]}"><title>${esc(nm)}, ${esc(c)}: ${v}%</title></rect><text x="${x+bw/2}" y="${ys(v)-5}" text-anchor="middle" class="ie-val">${v}</text>`; });
    const words = c.split(' '), half = Math.ceil(words.length/2);
    g += `<text x="${m.l+i*gw+gw/2}" y="${H-m.b+20}" text-anchor="middle" class="ie-ax">${esc(words.slice(0,half).join(' '))}</text>${words.length>1?`<text x="${m.l+i*gw+gw/2}" y="${H-m.b+36}" text-anchor="middle" class="ie-ax">${esc(words.slice(half).join(' '))}</text>`:''}`;
  });
  const legend = w.series.map(([nm],k)=>`<span><i style="background:${cols[k]}"></i>${esc(nm)}</span>`).join('');
  return `<figure class="ie-chart"><figcaption>${esc(w.caption)}</figcaption><div class="ie-legend">${legend}</div><div class="tw" style="border:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(w.caption)}">${g}</svg></div></figure>`;
}

    w.series.forEach(([nm,vals],k)=>{

    const legend=`<div class="ie-legend">${w.series.map(([nm],k)=>`<span><i style="background:${cols[k]}"></i>${esc(nm)}</span>`).join('')}</div>`;
    return fig(`<div class="tw" style="border:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(w.caption)}">${g}</svg></div>`, legend);
  }
