<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Articulate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EE; --panel:#FFFFFF; --panel2:#F6F8F5; --ink:#17251F; --muted:#5A6A62; --line:#D8E0DA;
  --forest:#1D4A3C; --forest-2:#2A6553; --mane:#E59E2E; --mane-ink:#9B5F0B; --mane-soft:#FCEFD6;
  --int:#2F7F6C; --int-soft:#E1F1EC; --adv:#B86E12; --adv-soft:#FBEBD4; --exp:#7B3F6E; --exp-soft:#F3E3EF;
  --rul:#3B5BA5; --rul-soft:#E4EAF8; --voc:#B0466A; --voc-soft:#F8E4EB; --spk:#1C6E8C; --spk-soft:#DFF0F6; --ie:#5B49B8; --ie-soft:#ECE8FA; --ok:#2E7D4F; --ok-soft:#E2F3E8; --bad:#B8402F; --bad-soft:#FBE6E2;
  --sans:'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1814; --panel:#15221D; --panel2:#1A2A24; --ink:#E5EEE9; --muted:#9AB0A6; --line:#283A33;
    --forest:#9FD4C1; --forest-2:#7CC2AA; --mane:#F2B04A; --mane-ink:#F5BE66; --mane-soft:#3A2A12;
    --int:#6CC6AF; --int-soft:#16332B; --adv:#EBA54A; --adv-soft:#3A2810; --exp:#D896C8; --exp-soft:#36202F;
    --rul:#93ACEC; --rul-soft:#1B2643; --voc:#EE93B2; --voc-soft:#3A1C27; --spk:#7CC9E3; --spk-soft:#14303B; --ie:#B3A6F2; --ie-soft:#241D40; --ok:#6FCB92; --ok-soft:#173326; --bad:#F08A78; --bad-soft:#3A1B16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1814; --panel:#15221D; --panel2:#1A2A24; --ink:#E5EEE9; --muted:#9AB0A6; --line:#283A33;
  --forest:#9FD4C1; --forest-2:#7CC2AA; --mane:#F2B04A; --mane-ink:#F5BE66; --mane-soft:#3A2A12;
  --int:#6CC6AF; --int-soft:#16332B; --adv:#EBA54A; --adv-soft:#3A2810; --exp:#D896C8; --exp-soft:#36202F;
  --rul:#93ACEC; --rul-soft:#1B2643; --voc:#EE93B2; --voc-soft:#3A1C27; --spk:#7CC9E3; --spk-soft:#14303B; --ie:#B3A6F2; --ie-soft:#241D40; --ok:#6FCB92; --ok-soft:#173326; --bad:#F08A78; --bad-soft:#3A1B16; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--mane);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px 12px 12px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;min-height:50px;padding:0 4px}
.icon-btn.menu-btn{display:none}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.brand .mark{width:36px;height:40px;flex:none;display:block;color:var(--ink)}
.brand .word{font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1;color:var(--forest)}
.brand .lv{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-left:2px;white-space:nowrap}
.hspace{flex:1}
.search{width:clamp(180px,24vw,300px);display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:19px;background:var(--panel);color:var(--muted)}
.search:focus-within{border-color:var(--forest-2)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:19px;background:var(--panel);padding:3px;height:38px}
.seg button{border:0;background:none;border-radius:16px;padding:0 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--panel)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:18px;height:18px}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:290px 1fr;gap:10px;min-height:0}
.side,.content{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.side-scroll{overflow-y:auto;padding:12px;flex:1}
.content-scroll{overflow-y:auto;flex:1;scroll-behavior:smooth}
.page{max-width:900px;margin:0 auto;padding:26px 34px 110px}

/* sidebar */
.nav-home{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:14px;color:var(--ink)}
.nav-home svg{width:17px;height:17px;color:var(--mane-ink)}
.nav-home[aria-current="page"]{border-color:var(--mane);background:var(--mane-soft)}
.lvl{margin-bottom:16px}
.lvl-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.lvl-head b{font-size:17px;letter-spacing:-.02em}
.lvl-head .cefr{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px}
.lvl-head .pct{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.lvl-bar{height:4px;border-radius:2px;background:var(--line);margin:0 4px 8px;overflow:hidden}
.lvl-bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .4s}
.sec-btn{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 8px 8px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink);border-left:3px solid var(--c)}
.sec-btn:hover{background:var(--panel2)}
.sec-btn .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.sec-btn svg{width:14px;height:14px;color:var(--muted);transition:transform .2s;flex:none}
.sec-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.sec-list{margin:2px 0 6px 15px;padding:0;list-style:none;border-left:1px solid var(--line)}
.sec-list button{width:100%;display:flex;align-items:center;gap:6px;text-align:left;border:0;background:none;padding:6px 10px;font-size:13.5px;color:var(--muted);cursor:pointer;border-radius:0 8px 8px 0}
.sec-list button:hover{color:var(--ink);background:var(--panel2)}
.sec-list button[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--soft);box-shadow:inset 2px 0 0 var(--c)}
.sec-list .tick{margin-left:auto;color:var(--ok);font-weight:800}
.nomatch{color:var(--muted);font-size:13.5px;padding:8px}
.side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* ---------- home ---------- */
.hero{position:relative;padding:8px 0 30px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero .kick{font-size:14px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.hero .kick .dot{width:8px;height:8px;border-radius:50%;background:var(--mane)}
.sotd{font-family:var(--serif);font-size:clamp(28px,4.2vw,46px);line-height:1.18;letter-spacing:-.01em;font-weight:400;margin:0 0 14px;max-width:24ch;color:var(--ink)}
.sotd-note{font-family:var(--serif);font-size:17px;color:var(--muted);max-width:60ch;margin:0 0 18px;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--forest);background:var(--forest);color:var(--panel);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent;color:var(--forest);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--forest-2);filter:none}
.btn.vincy{background:var(--mane);border-color:var(--mane);color:#2A1A04}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.lcol h3{margin:0;font-size:30px;letter-spacing:-.035em;line-height:1;color:var(--c)}
.lcol .cefr{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);margin:4px 0 10px}
.lcol p.d{font-size:14px;color:var(--muted);margin:0 0 12px;min-height:63px}
.lcol .lvl-bar{margin:0 0 14px}
.lcol ul{list-style:none;margin:0;padding:0}
.lcol li button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;display:flex;align-items:baseline;gap:8px;color:var(--ink);font-weight:600;font-size:15px}
.lcol li button:hover{color:var(--c)}
.lcol li button span{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.kick-link{border:0;background:none;padding:0;cursor:pointer;color:var(--mane-ink);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.resume{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:26px}
.resume .t{flex:1;min-width:0}
.resume small{display:block;color:var(--muted);font-size:12.5px}
.resume b{font-size:15.5px}

/* ---------- lesson ---------- */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px;font-size:13px;color:var(--muted)}
.crumbs .sep{opacity:.6}
.crumbs .lnk{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:13px}
.crumbs .lnk:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--soft);color:var(--c)}
.lesson-title{font-size:clamp(30px,4vw,42px);line-height:1.06;letter-spacing:-.04em;margin:10px 0 8px;font-weight:800}
.lesson-sub{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--muted);margin:0 0 8px;max-width:62ch}
.lesson-intro{font-size:15.5px;max-width:68ch;margin:12px 0 0}
.lesson-actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
h3.bh{display:flex;align-items:center;gap:10px;margin:36px 0 12px;font-size:19px;letter-spacing:-.02em}
h3.bh::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--c)}
h3.bh .x{font-weight:500;font-size:13px;color:var(--muted);margin-left:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel2);padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .s{font-family:var(--serif);font-size:16px}
td b{font-weight:700}
.ex-list{display:flex;flex-direction:column;gap:2px}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .t{flex:1;min-width:0}
.ex .en{font-family:var(--serif);font-size:18px;line-height:1.45}
.ex .gl{font-size:13.5px;color:var(--muted);margin-top:3px}
.say{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--forest-2)}
.say:hover{border-color:var(--forest-2)}
.say.on{background:var(--forest);color:var(--panel);border-color:var(--forest)}
.say svg{width:15px;height:15px}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel2);font-size:14.5px}
.tip svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--forest-2)}
.tip.warn{background:var(--mane-soft)}
.tip.warn svg{color:var(--mane-ink)}
.tip p{margin:0}

/* exercises */
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-family:var(--serif);font-size:18px;margin:0 0 10px;line-height:1.45}
.q .qt .qn{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--c);margin-right:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14.5px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:14px;color:var(--muted);padding-left:12px;border-left:3px solid var(--line)}
.why b{color:var(--ink)}
.gapline{font-family:var(--serif);font-size:18px;line-height:2.1}
.gap-in{font-family:var(--serif);font-size:17px;border:0;border-bottom:2px solid var(--c);background:var(--soft);padding:2px 8px;border-radius:4px 4px 0 0;min-width:120px;width:auto;outline:none}
.gap-in.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap-in.no{border-color:var(--bad);background:var(--bad-soft)}
.score{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--panel2);font-size:14px}
.score b{font-size:20px;color:var(--c)}
textarea.w{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);font-family:var(--serif);font-size:16.5px;line-height:1.55;margin:4px 0 10px}
textarea.w:focus{border-color:var(--c);outline:none}
.task{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.task h4{margin:0 0 8px;font-size:15.5px}
details.rev{margin-top:10px}
details.rev summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--forest-2)}
details.rev .model{font-family:var(--serif);font-size:16.5px;line-height:1.6;white-space:pre-line;padding:12px 14px;background:var(--panel2);border-radius:10px;margin-top:8px}
.fb{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--mane-soft);font-size:14.5px;line-height:1.6}
.fb .who{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.fb .who svg{width:24px;height:24px}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:4px 0 8px;padding-left:20px}
.md li{margin:2px 0}
.md code{font-size:.92em;background:var(--panel2);padding:1px 5px;border-radius:4px}
.read{border:1px solid var(--line);border-radius:16px;padding:22px 26px;background:var(--panel2)}
.read h4{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.read .src{font-size:13px;color:var(--muted);margin-bottom:14px}
.read p.para{font-family:var(--serif);font-size:18px;line-height:1.7;margin:0 0 14px;max-width:66ch}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:12px;align-items:flex-start}
.line .who{width:86px;flex:none;font-weight:700;font-size:13px;color:var(--c);padding-top:4px}
.line .bub{flex:1;font-family:var(--serif);font-size:17px;line-height:1.5;padding:10px 14px;border-radius:14px;background:var(--panel2)}
.line.b .bub{background:var(--soft)}
.dict{padding:14px 0;border-bottom:1px solid var(--line)}
.dict .row input{flex:1;min-width:200px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel);font-family:var(--serif);font-size:16px}
.dict .res{margin-top:8px;font-size:14px}
.role{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--mane-soft)}
.role svg.av{width:56px;height:56px;flex:none}
.role p{margin:0 0 10px;font-size:14.5px}
.role b{display:block;font-size:16px;margin-bottom:2px}
.done-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.done-bar .hspace{flex:1}
.btn.done{background:var(--ok);border-color:var(--ok)}

/* level colour scopes */
[data-l="int"]{--c:var(--int);--soft:var(--int-soft)}
[data-l="adv"]{--c:var(--adv);--soft:var(--adv-soft)}
[data-l="exp"]{--c:var(--exp);--soft:var(--exp-soft)}
[data-l="rules"]{--c:var(--rul);--soft:var(--rul-soft)}
[data-l="voc"]{--c:var(--voc);--soft:var(--voc-soft)}
[data-l="sp"]{--c:var(--spk);--soft:var(--spk-soft)}
[data-l="ielts"]{--c:var(--ie);--soft:var(--ie-soft)}

/* ---------- Vincy ---------- */
.vincy-fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:2px solid #E8731C;background:#FFFFFF;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px rgba(20,40,30,.28);z-index:40;padding:0}
.vincy-fab svg{width:60px;height:60px}
.vincy-fab .ping{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--mane);border:2px solid var(--panel)}
.vincy-panel{position:fixed;right:22px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 24px));height:min(620px,calc(100% - 130px));background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(15,30,25,.25);display:flex;flex-direction:column;overflow:hidden;z-index:41;transform-origin:bottom right;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.vincy-panel[hidden]{display:none}
.vincy-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--head-bg);color:var(--head-fg)}
.vincy-head svg.av{width:42px;height:42px;flex:none}
.vincy-head .id{flex:1;min-width:0}
.vincy-head b{display:block;font-size:17px;letter-spacing:-.01em}
.vincy-head small{font-size:12.5px;opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vincy-head button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:inherit;display:grid;place-items:center;cursor:pointer}
.vincy-head button svg{width:17px;height:17px}
.vincy-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .mini{width:28px;height:28px;flex:none}
.msg .bb{padding:10px 13px;border-radius:16px 16px 16px 4px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end}
.msg.me .bb{background:var(--forest);color:var(--panel);border-color:var(--forest);border-radius:16px 16px 4px 16px}
.msg .bb.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0;background:var(--panel)}
.chip-btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--forest-2)}
.chip-btn:hover{border-color:var(--forest-2)}
.vincy-foot{display:flex;gap:8px;padding:10px 14px 14px;background:var(--panel)}
.vincy-foot textarea{flex:1;resize:none;height:44px;max-height:120px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--panel2);font-size:14.5px;outline:none;line-height:1.4}
.vincy-foot textarea:focus{border-color:var(--forest-2)}
.vincy-foot button{width:44px;height:44px;border-radius:50%;border:0;background:var(--mane);color:#2A1A04;display:grid;place-items:center;cursor:pointer;flex:none}
.vincy-foot button svg{width:19px;height:19px}
.vincy-ctx{font-size:12px;color:var(--muted);padding:6px 14px 0;background:var(--panel)}
.offline{font-size:12.5px;color:var(--muted);background:var(--mane-soft);padding:8px 14px}

/* ---------- owl ---------- */
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.owl.blink .lid{animation:blink 7s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}

/* ---------- sidebar: vocabulary entry ---------- */
.nav-vocab{border-left:3px solid var(--voc)}
.nav-vocab svg{color:var(--voc)}
.nav-vocab .n{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.nav-vocab[aria-current="page"]{border-color:var(--voc);background:var(--voc-soft)}
.vhits{margin:-8px 0 14px 15px}
.nav-home + .nav-home{margin-top:-6px}

/* ---------- home: feature row ---------- */
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:34px}
.feat-cefr{font-family:var(--serif);font-weight:400;color:var(--muted);font-size:13.5px;margin-left:4px}
.feat{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--panel)}
.feat h3{margin:0;font-size:22px;letter-spacing:-.03em;color:var(--c)}
.feat .cefr{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin:2px 0 12px}
.feat ul{list-style:none;margin:0;padding:0}
.feat li button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 0;cursor:pointer;display:flex;align-items:baseline;gap:8px;color:var(--ink);font-weight:600;font-size:14.5px}
.feat li button:hover{color:var(--c)}
.feat li button span{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.mini-alpha{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mini-alpha button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);padding:0}
.mini-alpha button:hover{border-color:var(--voc);color:var(--voc);background:var(--voc-soft)}

/* ---------- vocabulary page ---------- */
.alpha{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 14px}
.alpha button{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.alpha button:hover{border-color:var(--c);color:var(--c)}
.alpha button[aria-current="true"]{background:var(--c);border-color:var(--c);color:var(--panel)}
.vfilter{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);max-width:420px;color:var(--muted)}
.vfilter:focus-within{border-color:var(--c)}
.vfilter svg{width:16px;height:16px;flex:none}
.vfilter input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;color:var(--ink)}
.vw-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vw + .vw{border-top:1px solid var(--line)}
.vw-head{width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-align:left;border:0;background:var(--panel);padding:14px 16px;cursor:pointer;color:var(--ink)}
.vw-head:hover{background:var(--panel2)}
.vw-head[aria-expanded="true"]{background:var(--soft)}
.vw-word{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
.vw-pron{font-size:13.5px;color:var(--muted)}
.vw-pos{display:flex;gap:5px;margin-left:auto}
.vw-head > svg{width:15px;height:15px;color:var(--muted);transition:transform .2s;flex:none}
.vw-head[aria-expanded="true"] > svg{transform:rotate(90deg)}
.pos-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pos-tag[data-pos="noun"]{color:var(--int);border-color:var(--int);background:var(--int-soft)}
.pos-tag[data-pos="verb"]{color:var(--adv);border-color:var(--adv);background:var(--adv-soft)}
.pos-tag[data-pos="adjective"]{color:var(--exp);border-color:var(--exp);background:var(--exp-soft)}
.pos-tag[data-pos="adverb"],.pos-tag[data-pos="conjunction"]{color:var(--rul);border-color:var(--rul);background:var(--rul-soft)}
.vw-body{padding:4px 18px 18px;background:var(--panel)}
.sense{padding:14px 0 6px;border-bottom:1px dashed var(--line)}
.sense:last-of-type{border-bottom:0}
.sense-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sense .mean{margin:0;font-size:15.5px;font-weight:600;flex:1;min-width:200px}
.sense .ex .en{font-size:17px}
.vw-act{margin-top:10px}
.btn svg.owl{width:22px;height:22px}

/* ---------- dictionary ---------- */
.dict-fab{position:fixed;right:100px;bottom:calc(30px + env(safe-area-inset-bottom,0px));height:48px;padding:0 18px 0 14px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 6px 18px rgba(20,40,30,.18);z-index:40}
.dict-fab:hover{border-color:var(--rul)}
.dict-fab .aa{width:30px;height:30px;border-radius:50%;background:var(--rul);color:var(--panel);display:grid;place-items:center;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.02em}
.dict-fab[aria-expanded="true"]{border-color:var(--rul);background:var(--rul-soft)}
.vincy-head.dict-head{background:var(--dhead-bg)}
.dict-head .aa{width:42px;height:42px;border-radius:50%;background:#FFF3DC;color:#2E3F78;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:600;flex:none}
.dict-panel{width:min(480px,calc(100vw - 24px))}
.dict-form{display:flex;gap:8px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.dict-form input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--panel2);font-family:var(--serif);font-size:17px;outline:none}
.dict-form input:focus{border-color:var(--rul)}
.dict-form button{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--rul);color:var(--panel);font-weight:700;cursor:pointer}
.dict-body{flex:1;overflow-y:auto;padding:16px 18px 22px;background:var(--panel)}
.d-empty{color:var(--muted);font-size:14px;line-height:1.6}
.d-empty h4{color:var(--ink);font-size:15px;margin:0 0 6px}
.d-recent{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.dw{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.1}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:8px 0 4px;font-size:13px;color:var(--muted)}
.d-pron{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0 6px;font-size:14.5px}
.d-pron span{display:inline-flex;align-items:center;gap:6px}
.d-pron b{font-size:11.5px;color:var(--muted);font-weight:700}
.d-pron .say{width:28px;height:28px}
.d-lvl{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:11px;background:var(--rul-soft);color:var(--rul);font-weight:700;font-size:12px}
.d-sec{margin-top:20px}
.d-sec > h5{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--rul);display:flex;align-items:center;gap:8px}
.d-sec > h5::after{content:"";flex:1;height:1px;background:var(--line)}
.d-pos-h{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
ol.d-senses{margin:0;padding-left:22px}
ol.d-senses > li{margin:0 0 14px;padding-left:2px}
ol.d-senses > li::marker{font-weight:700;color:var(--rul)}
.d-def{font-size:15px;line-height:1.5}
.d-gram{font-size:12px;color:var(--muted);margin-right:6px}
.d-reg{font-size:11.5px;font-style:italic;color:var(--mane-ink);margin-right:6px}
ul.d-ex{list-style:none;margin:6px 0 0;padding:0}
ul.d-ex li{display:flex;gap:8px;align-items:flex-start;font-family:var(--serif);font-size:15.5px;line-height:1.45;padding:4px 0 4px 12px;border-left:2px solid var(--rul-soft)}
ul.d-ex li .say{width:26px;height:26px;margin-left:auto}
ul.d-ex li .say svg{width:13px;height:13px}
.d-rel{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.d-chip{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.d-chip:hover{border-color:var(--rul);color:var(--rul)}
.d-forms{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.d-forms dt{color:var(--muted)}
.d-forms dd{margin:0;font-weight:600}
.d-phr{margin:0 0 10px;font-size:14.5px}
.d-phr i{display:block;font-family:var(--serif);font-size:15px;color:var(--muted)}
.d-note{font-size:14px;line-height:1.55}
.d-status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--rul-soft);font-size:13.5px;margin-bottom:14px}
.d-status .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--rul);border-top-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.d-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}


@media (max-width:900px){ .features{grid-template-columns:1fr} }
@media (max-width:820px){
  .dict-fab{right:88px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:52px;height:52px;padding:0;justify-content:center}
  .dict-fab .lbl{display:none}
  .vw-pos{margin-left:0;width:100%}
  .vw-head > svg{position:absolute;right:16px}
  .vw-head{position:relative;padding-right:40px}
}

/* ---------- sidebar: speech entry ---------- */
.nav-speech{border-left:3px solid var(--spk)}
.nav-speech svg{color:var(--spk)}
.nav-speech .n{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.nav-speech[aria-current="page"]{border-color:var(--spk);background:var(--spk-soft)}

/* ---------- vocabulary details ---------- */
.lvl-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:800;letter-spacing:.02em;background:var(--ink);color:var(--panel)}
dl.vd{margin:14px 0 0;display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:var(--panel2)}
.vd-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:baseline}
.vd-row dt{font-size:12.5px;font-weight:700;color:var(--muted)}
.vd-row dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.vd-chip{border:1px dashed var(--line);border-radius:12px;padding:3px 10px;font-size:12.5px;color:var(--ink)}
.pos-filter{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.pos-filter button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.pos-filter button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel)}

/* ---------- speech practice ---------- */
.sp-status{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px;line-height:1.55;margin:18px 0 6px}
.sp-status svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--spk)}
.sp-status.warn{background:var(--mane-soft);border-color:transparent}
.sp-status.warn svg{color:var(--mane-ink)}
.sp-status.ok{background:var(--spk-soft);border-color:transparent}
.sp-levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:22px 0 4px}
.sp-levels button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);text-align:left}
.sp-levels button b{font-size:16px;letter-spacing:-.01em}
.sp-levels button span{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted)}
.sp-levels button small{font-size:12px;color:var(--muted);margin-top:4px}
.sp-levels button:hover{border-color:var(--spk)}
.sp-levels button[aria-current="true"]{border-color:var(--spk);background:var(--spk-soft);box-shadow:inset 0 -3px 0 var(--spk)}
.sp-own{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px;align-items:center}
.sp-own .vfilter{flex:1;min-width:220px;max-width:none}
.sp-set-d{margin:-4px 0 14px;font-size:14px;color:var(--muted)}
.sp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sp-grid.one{grid-template-columns:minmax(0,1fr);max-width:540px}
.sp-card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.sp-card.recording{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.sp-top{display:flex;align-items:flex-start;gap:10px}
.sp-head{flex:1;min-width:0}
.sp-word{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.sp-resp{font-size:13.5px;font-weight:700;color:var(--spk);letter-spacing:.03em;margin-top:4px}
.sp-best{min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.sp-best.great,.sp-out.great .sp-score b{background:var(--ok);color:var(--panel)}
.sp-best.good,.sp-out.good .sp-score b{background:var(--ok-soft);color:var(--ok)}
.sp-best.ok,.sp-out.ok .sp-score b{background:var(--mane-soft);color:var(--mane-ink)}
.sp-best.bad,.sp-out.bad .sp-score b{background:var(--bad-soft);color:var(--bad)}
.sp-ipa{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14.5px}
.sp-ipa b{font-size:11px;color:var(--muted);margin-right:3px}
.sp-tip{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.sp-act{margin-top:auto;padding-top:4px}
.btn.rec{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.btn.rec:disabled{opacity:.75}
.sp-res:empty{display:none}
.sp-live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--bad-soft);font-size:14px;font-weight:600}
.sp-live .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.sp-live .meter{flex:1;min-width:100px;height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.sp-live .meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .08s}
.sp-out{padding:12px 14px;border-radius:12px;background:var(--panel2);font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.sp-out p{margin:0}
.sp-score{display:flex;align-items:center;gap:10px}
.sp-score b{min-width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.sp-score span{font-weight:800;font-size:16px}
.sp-note{font-size:13px;color:var(--muted)}
.sp-self{gap:6px}
@media (max-width:820px){ .sp-levels{grid-template-columns:1fr 1fr} .sp-grid{grid-template-columns:minmax(0,1fr)} .vd-row{grid-template-columns:1fr;gap:4px} }

/* ---------- IELTS ---------- */
.ie-note{font-size:13px;color:var(--muted);margin:8px 0 0}
.ie-instr{margin:0 0 10px;font-size:14px;font-weight:700;letter-spacing:.01em}
.ie-calc{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel2)}
.ie-calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ie-calc-grid label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.ie-calc-grid label span{font-weight:400;font-size:12px;color:var(--muted)}
.ie-calc-grid input,.ie-calc-grid select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--panel);font-size:15px;font-variant-numeric:tabular-nums}
.ie-calc-grid input:focus,.ie-calc-grid select:focus{border-color:var(--ie);outline:none}
.ie-bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
.ie-bands div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ie-bands span{font-size:12px;color:var(--muted);font-weight:600}
.ie-bands b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ie-bands .ie-overall{background:var(--ie);border-color:var(--ie)}
.ie-bands .ie-overall span,.ie-bands .ie-overall b{color:var(--panel)}
.ie-audio{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ie-prog{font-size:13px;color:var(--muted)}
.ie-passage{border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:var(--panel2)}
.ie-passage h4{margin:0 0 14px;font-family:var(--serif);font-size:22px;font-weight:600}
.ie-para{display:flex;gap:12px;align-items:flex-start}
.ie-para p{margin:0 0 14px;font-family:var(--serif);font-size:17px;line-height:1.7;max-width:68ch}
.ie-pl{flex:none;width:26px;height:26px;border-radius:7px;background:var(--ie);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:3px}
.mk-navbtn svg{width:15px;height:15px;color:var(--c)}
.mk-navbtn[aria-current]{background:var(--soft,var(--panel2));font-weight:700}
.mk-proc{list-style:none;margin:6px 0 10px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:none}
.mk-proc li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:3px;position:relative}
.mk-proc b{font-size:14px}.mk-proc small{color:var(--muted);font-size:12.5px;line-height:1.4}
.mk-pn{width:24px;height:24px;border-radius:50%;background:var(--ie);color:#fff;font-weight:800;font-size:12.5px;display:grid;place-items:center}
.mk-cyc{margin:0 0 8px;font-size:13px;color:var(--muted)}
.mk-maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:8px}
.mk-map h5{margin:0 0 6px;font-size:14px}.ie-chart .mk-map svg{width:100%;min-width:0;height:auto;display:block}
.ie-chart{margin:0;border:1px solid var(--line);border-radius:16px;padding:16px 18px 8px}
.ie-chart figcaption{font-weight:700;font-size:14.5px;margin-bottom:6px}
.ie-chart svg{width:100%;min-width:480px;height:auto;display:block}
.ie-ax{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ie-lab{font-size:12.5px;font-weight:700}
.ie-write{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}

<script>
/* ======================================================================
   CONTENT
   Block kinds: table, ex, tips, mc, gap, write, read, dlg, dict, role, pairs
   A table cell starting with § is an English sentence with a listen button.
   ====================================================================== */
const LEVELS = [
 {id:'ielts', name:'IELTS preparation', cefr:'Band 5 – 9', d:'Academic and General Training: test format, band scores, and timed practice for Listening, Reading, Writing and Speaking with examiner-style feedback.', sections:[]},
 {id:'rules', name:'Rules handbook', cefr:'All levels', d:'Parts of speech, sentence types, spelling, pronunciation and punctuation rules, organised for quick reference.', sections:[]},
 {id:'int', name:'Intermediate', cefr:'B1 – B2', d:'Control the tenses, build flexible sentences and handle everyday work and social situations with confidence.', sections:[]},
 {id:'adv', name:'Advanced', cefr:'C1', d:'Use emphasis, precise vocabulary and the right register so your English sounds deliberate, fluent and professional.', sections:[]},
 {id:'exp', name:'Expert', cefr:'C2', d:'Master nuance, tone, rhetoric and academic style: the subtle choices that separate fluent speakers from masterful ones.', sections:[]}
];
const SEC = (lv, t, lessons) => LEVELS.find(l=>l.id===lv).sections.push({t, lessons});

/* ======================= INTERMEDIATE ======================= */
SEC('int','Tenses in depth',[
{id:'ppps', t:'Present perfect vs past simple', sub:'Finished time or connected to now?',
 intro:"Both tenses talk about the past. The difference is whether the speaker sees the time as <b>finished</b> (past simple) or still <b>connected to the present</b> (present perfect).",
 blocks:[
 {k:'table', title:'The core difference', head:['','Past simple','Present perfect'], rows:[
  ['Time','Finished period: <i>yesterday, in 2019, last week, ago</i>','Unfinished period or no time given: <i>today, this year, ever, yet, so far</i>'],
  ['Focus','<b>When</b> it happened','The <b>result</b> or experience now'],
  ['Form','<i>I worked, I went</i>','<i>I have worked, she has gone</i>'],
  ['Example','§I lost my keys yesterday.','§I\'ve lost my keys. (I still can\'t find them.)']]},
 {k:'ex', title:'In context', items:[
  ["Have you ever been to Japan? Yes, I went there in 2018.","Question about experience (perfect), then a specific time (simple)."],
  ["She has worked here since March.","Started in the past, still true now. Use since + point, for + period."],
  ["I've just finished the report.","Just, already and yet are classic present perfect partners in British English."],
  ["Shakespeare wrote 39 plays.","He is dead, so the period is finished: past simple."],
  ["Have you seen Tom this morning?","Said at 10 a.m.: the morning is not over. After lunch you would say Did you see…"]]},
 {k:'tips', items:[
  "!Never use the present perfect with a finished time expression: not <i>I have seen him yesterday</i>.",
  "American English often uses the past simple with just, already and yet: <i>Did you eat yet?</i> Both are correct in their variety.",
  "<b>Been vs gone:</b> <i>She has been to Paris</i> (and came back). <i>She has gone to Paris</i> (she is there now)."]},
 {k:'mc', title:'Choose the right tense', items:[
  ["I ___ my wallet. Can you lend me ten pounds?",["lost","have lost","had lost"],1,"The result matters now: no money. No finished time is given."],
  ["We ___ to Rome last summer.",["went","have gone","have been"],0,"<i>Last summer</i> is a finished time."],
  ["How long ___ you known each other?",["did","do","have"],2,"Duration up to now: present perfect."],
  ["When ___ you start learning English?",["have","did","had"],1,"Questions with <i>when</i> ask for a finished point in time."],
  ["She ___ three novels so far.",["wrote","has written","writes"],1,"<i>So far</i> means up to now and she may write more."]]},
 {k:'gap', title:'Complete the sentences', items:[
  ["I","haven't seen|have not seen","him since Christmas. (not see)","Since + point in time links to now."],
  ["Mozart","wrote","over 600 works. (write)","Mozart's life is finished."],
  ["","Have you finished|Did you finish","the book yet? (you / finish)","British: Have you finished… yet? American: Did you finish… yet?"]]}
 ]},
{id:'narr', t:'Narrative tenses', sub:'Telling stories with past simple, continuous and perfect',
 intro:"Good storytellers move between three past tenses to show which events were the background, which happened in sequence, and which happened earlier still.",
 blocks:[
 {k:'table', title:'Three tenses, three jobs', head:['Tense','Job in a story','Example'], rows:[
  ['Past simple','Main events in order','§She opened the door and screamed.'],
  ['Past continuous','Background, or an action interrupted','§It was raining and the wind was howling.'],
  ['Past perfect','An event before the main story time','§She realised she had left the gas on.'],
  ['Past perfect continuous','Duration before a past moment','§He had been waiting for two hours when the train finally came.']]},
 {k:'ex', items:[
  ["I was cooking dinner when the lights went out.","Long background action (continuous) interrupted by a short event (simple)."],
  ["By the time we arrived, the film had already started.","The film started first: past perfect."],
  ["While she was studying, her flatmates were having a party.","Two background actions at the same time."],
  ["He was exhausted because he had been running all morning.","The duration explains a past state."]]},
 {k:'tips', items:[
  "Use the past perfect only when the order is unclear or important. <i>After I finished, I left</i> is fine without it.",
  "!State verbs (know, believe, own, want) rarely take continuous forms: <i>I knew</i>, not <i>I was knowing</i>."]},
 {k:'mc', items:[
  ["When I got to the station, the train ___.",["left","had left","was leaving"],1,"It left before I got there. (<i>was leaving</i> is possible if it was pulling out at that moment.)"],
  ["I ___ along the beach when I found the ring.",["walked","was walking","had walked"],1,"Background action interrupted by finding the ring."],
  ["She was tired because she ___ all night.",["had been working","has worked","worked"],0,"Duration leading up to a past moment."],
  ["They ___ each other for years before they got married.",["knew","had known","were knowing"],1,"State verb, earlier period: past perfect simple."]]},

 ]},
{id:'fut', t:'Future forms', sub:'Will, going to, present continuous and beyond',
 intro:"English has no single future tense. The form you choose shows <b>how</b> you see the future event: a decision, a plan, an arrangement, a prediction or a timetable.",
 blocks:[
 {k:'table', head:['Form','Use','Example'], rows:[
  ['will','Instant decisions, promises, predictions from opinion','§It\'s cold. I\'ll close the window.'],
  ['be going to','Plans already made; predictions from evidence','§Look at those clouds. It\'s going to rain.'],
  ['Present continuous','Fixed arrangements with people, time and place','§I\'m meeting Sara at six.'],
  ['Present simple','Timetables and schedules','§The train leaves at 9.15.'],
  ['Future continuous','An action in progress at a future time','§This time tomorrow I\'ll be flying to Delhi.'],
  ['Future perfect','Completed before a future time','§By June, I\'ll have finished my degree.']]},
 {k:'ex', items:[
  ["I'm going to start running every morning.","An intention you have already decided on."],
  ["Will you be using the car tonight?","Future continuous makes a polite, indirect question."],
  ["Don't worry, I'll help you move.","An offer or promise made now."],
  ["The conference starts on Monday.","Official schedule."]]},
 {k:'mc', items:[
  ["A: The phone's ringing. B: OK, I ___ it.",["'m answering","'ll answer","'m going to answer"],1,"Decision made at the moment of speaking."],
  ["We ___ dinner with the Patels on Friday. It's all arranged.",["have","'ll have","'re having"],2,"Personal arrangement with a fixed time."],
  ["Careful! You ___ that glass.",["'ll drop","'re going to drop","drop"],1,"Evidence in front of you."],
  ["By 2030, scientists ___ a cure.",["will find","will have found","are finding"],1,"Completed before a future point."]]},
 {k:'gap', items:[
  ["Don't call at eight. We","'ll be having|will be having","dinner then. (have)","In progress at a future time."],
  ["Hurry up! The film","starts","in ten minutes. (start)","Timetabled event: present simple."]]}
 ]},
{id:'cond', t:'Conditionals', sub:'Zero, first, second, third and mixed',
 intro:"Conditionals describe a result that depends on a condition. The tense tells the listener how <b>real</b> or <b>likely</b> the situation is.",
 blocks:[
 {k:'table', head:['Type','Form','Meaning','Example'], rows:[
  ['Zero','if + present, present','Always true','§If you heat ice, it melts.'],
  ['First','if + present, will','Real future possibility','§If it rains, we\'ll stay in.'],
  ['Second','if + past, would','Unreal or unlikely now / future','§If I had more time, I would learn Japanese.'],
  ['Third','if + past perfect, would have + pp','Unreal past','§If you had told me, I would have helped.'],
  ['Mixed','if + past perfect, would + verb','Past condition, present result','§If I had taken the job, I would be living in Paris now.']]},
 {k:'tips', items:[
  "Use <b>unless</b> to mean <i>if not</i>: <i>We'll miss the bus unless we hurry.</i>",
  "<b>If I were you</b> is the standard way to give advice. <i>If I was</i> is common in speech but less formal.",
  "!Do not put <i>will</i> or <i>would</i> in the if-clause: not <i>If it will rain…</i>"]},
 {k:'mc', items:[
  ["If I ___ the lottery, I'd buy a house by the sea.",["win","won","had won"],1,"Unlikely situation: second conditional."],
  ["If she had caught the train, she ___ late.",["wouldn't be","won't be","wouldn't have been"],2,"Unreal past with a past result."],
  ["If you mix red and blue, you ___ purple.",["get","will get","would get"],0,"A general truth: zero conditional."],
  ["If I hadn't stayed up so late, I ___ so tired now.",["wouldn't have been","wouldn't be","won't be"],1,"Mixed: past cause, present result."],
  ["I won't go ___ you come with me.",["if","unless","when"],1,"Unless = if not."]]},
 {k:'gap', items:[
  ["If I","were|was","you, I'd apologise. (be)","Advice uses the second conditional."],
  ["We would have won if our goalkeeper","hadn't been|had not been","injured. (not be)","Third conditional."]]},
 {k:'write', items:[["Write three sentences about your own life: one second conditional, one third conditional and one mixed conditional.","If I lived closer to the mountains, I would go hiking every weekend.\nIf I had studied harder at school, I would have gone to a better university.\nIf I hadn't moved to Bangalore, I wouldn't know my best friend."]]}
 ]}
]);

SEC('int','Grammar toolkit',[
{id:'modal', t:'Modals of deduction & obligation', sub:'Must, might, can\'t, should, have to',
 intro:"Modal verbs show how certain you are, or how necessary something is. The same word can do both jobs, so context is everything.",
 blocks:[
 {k:'table', title:'Deduction: how sure are you?', head:['Certainty','Present','Past'], rows:[
  ['Almost certain (yes)','§She must be at home. The lights are on.','§He must have forgotten our meeting.'],
  ['Possible','§They might be stuck in traffic.','§I may have left it on the bus.'],
  ['Almost certain (no)','§That can\'t be Tom. He\'s in Spain.','§She can\'t have seen us. It was too dark.']]},
 {k:'table', title:'Obligation and advice', head:['Meaning','Modal','Example'], rows:[
  ['Strong obligation (from the speaker)','must','§I must call my mother tonight.'],
  ['Obligation (from rules, outside)','have to','§We have to wear a uniform at work.'],
  ['No obligation','don\'t have to','§You don\'t have to come if you\'re busy.'],
  ['Prohibition','mustn\'t','§You mustn\'t smoke in here.'],
  ['Advice','should / ought to','§You should see a doctor about that cough.'],
  ['Criticism of the past','should have','§You should have told me earlier.']]},
 {k:'tips', items:[
  "!<b>Mustn't ≠ don't have to.</b> <i>You mustn't tell her</i> (it's forbidden). <i>You don't have to tell her</i> (it's your choice).",
  "The opposite of deductive <i>must</i> is <i>can't</i>, not <i>mustn't</i>."]},
 {k:'mc', items:[
  ["He's been working for 14 hours. He ___ be exhausted.",["can't","must","should"],1,"Logical certainty."],
  ["You ___ pay. The museum is free on Sundays.",["mustn't","don't have to","can't"],1,"No obligation."],
  ["I can't find my phone. I ___ have left it in the taxi.",["might","must","should"],0,"A possibility, not a certainty."],
  ["She ___ have written this. She doesn't speak German.",["mustn't","can't","shouldn't"],1,"Negative deduction about the past."]]},
 {k:'gap', items:[
  ["You look awful. You","should|ought to","go home and rest.","Advice."],
  ["The streets are wet. It","must have rained|must have been raining","last night.","Past deduction from evidence."]]}
 ]},
{id:'pass', t:'The passive voice', sub:'When the action matters more than who did it',
 intro:"Use the passive when the person who does the action is unknown, unimportant or obvious, or when you want to keep the focus on the topic of your sentence.",
 blocks:[
 {k:'table', head:['Tense','Active','Passive'], rows:[
  ['Present simple','They make cars here.','§Cars are made here.'],
  ['Past simple','Someone stole my bike.','§My bike was stolen.'],
  ['Present perfect','They have cancelled the flight.','§The flight has been cancelled.'],
  ['Future','They will announce the results.','§The results will be announced.'],
  ['Modal','You must sign the form.','§The form must be signed.'],
  ['Continuous','They are repairing the road.','§The road is being repaired.']]},
 {k:'ex', title:'Beyond the basics', items:[
  ["It is believed that the painting is a fake.","Impersonal passive: common in news and formal writing."],
  ["He is said to be the richest man in the city.","Subject + passive reporting verb + to-infinitive."],
  ["I had my hair cut yesterday.","Causative: someone else did it for you."],
  ["She got promoted last month.","Get-passive: informal, often for changes or events."]]},
 {k:'tips', items:[
  "Add <b>by + agent</b> only when it adds information: <i>Hamlet was written by Shakespeare.</i>",
  "Intransitive verbs (arrive, happen, die) have no passive. Not <i>The accident was happened.</i>"]},
 {k:'mc', items:[
  ["The new bridge ___ next year.",["will build","will be built","is building"],1,"The bridge receives the action."],
  ["My laptop ___ at the moment, so I'm using my phone.",["is repaired","is being repaired","has repaired"],1,"In progress now: continuous passive."],
  ["The suspect is thought ___ the country.",["to leave","to have left","leaving"],1,"Perfect infinitive for an earlier action."],
  ["I need to have my eyes ___.",["test","testing","tested"],2,"Causative have + object + past participle."]]},
 {k:'gap', items:[
  ["Thousands of homes","have been destroyed","by the floods. (destroy, present perfect)","Present perfect passive."],
  ["We're","having|getting","our kitchen redecorated next week.","Causative."]]}
 ]},
{id:'rep', t:'Reported speech', sub:'Telling people what others said',
 intro:"When we report what someone said, we usually move the tense one step back, and change pronouns, times and places to fit the new situation.",
 blocks:[
 {k:'table', head:['Direct speech','Reported speech'], rows:[
  ['“I <b>am</b> tired.”','§She said she was tired.'],
  ['“I <b>have finished</b>.”','§He said he had finished.'],
  ['“I <b>will</b> call you.”','§She said she would call me.'],

  ['“Where <b>do</b> you live?”','§She asked me where I lived.'],
  ['“Don\'t be late.”','§He told us not to be late.']]},
 {k:'table', title:'Time and place shifts', head:['Direct','Reported'], rows:[
  ['today','that day'],['tomorrow','the next day / the following day'],['yesterday','the day before / the previous day'],['here','there'],['this','that'],['ago','before']]},
 {k:'tips', items:[
  "If the fact is still true, you can keep the tense: <i>She said she lives in Pune.</i>",
  "!Reported questions use normal word order: <i>He asked where I was</i>, not <i>where was I</i>.",
  "Use reporting verbs for nuance: <i>suggest, admit, deny, insist, warn, refuse, promise, remind</i>."]},
 {k:'mc', items:[
  ["“I'm leaving tomorrow.” → She said she ___ the next day.",["is leaving","was leaving","left"],1,"Present continuous → past continuous."],
  ["“Did you see the match?” → He asked me ___ the match.",["did I see","if I had seen","if I saw it"],1,"Yes/no question: if/whether + backshift."],
  ["“You should apologise.” → She ___ apologising.",["suggested","told","said me"],0,"Suggest + -ing."],

 ]},
{id:'rel', t:'Relative clauses', sub:'Who, which, that, whose, where',
 intro:"Relative clauses add information about a noun. The key question is whether the information is <b>essential</b> (defining) or <b>extra</b> (non-defining).",
 blocks:[

  ['Defining','No','Yes','§The woman who lives next door is a pilot.'],
  ['Non-defining','Yes','No','§My sister, who lives in Leeds, is a pilot.']]},
 {k:'table', title:'Relative words', head:['Word','For','Example'], rows:[
  ['who','people','§the man who called'],['which','things, ideas','§the book which I lent you'],['whose','possession','§the student whose essay won'],['where','places','§the café where we met'],['when','times','§the year when I was born'],['whom','people, as object (formal)','§the candidate whom we interviewed']]},
 {k:'tips', items:[
  "In defining clauses you can drop the pronoun when it is the object: <i>the book (that) I'm reading</i>.",
  "<i>Which</i> can refer to a whole clause: <i>He arrived on time, which surprised everyone.</i>",
  "!Never use <i>that</i> after a comma."]},

  ["Lata Mangeshkar, ___ voice was known worldwide, died in 2022.",["who","whose","that"],1,"Possession."],
  ["She failed the exam, ___ was a shock to all of us.",["that","what","which"],2,"Refers back to the whole clause."],
  ["Which sentence is correct?",["My father, that is a doctor, works long hours.","My father, who is a doctor, works long hours.","My father who is a doctor, works long hours."],1,"Non-defining: commas on both sides and no <i>that</i>."]]},
 {k:'write', items:[["Combine into one sentence with a relative clause: <i>Kerala is in the south of India. It is famous for its backwaters.</i>","Kerala, which is in the south of India, is famous for its backwaters."]]}

{id:'gerinf', t:'Gerund or infinitive?', sub:'Enjoy doing, want to do, stop to do',
 intro:"After some verbs English uses the -ing form, after others the to-infinitive. A few verbs take both, with a change in meaning.",

 {k:'table', head:['Pattern','Common verbs','Example'], rows:[

  ["Would you mind ___ the window?",["to open","opening","open"],1,"Mind + -ing."],

SEC('int','Vocabulary builder',[
{id:'phr', t:'Phrasal verbs', sub:'Verb + particle, new meaning',
 intro:"Phrasal verbs are everywhere in natural spoken English. Learn them in groups and always with an example sentence.",
 blocks:[
 {k:'pairs', title:'Essential phrasal verbs', head:['Phrasal verb','Meaning','Example'], items:[
  ['bring up','mention a topic; raise a child','She brought up an interesting point in the meeting.'],
  ['carry on','continue','Carry on with your work. I\'ll be back soon.'],
  ['come across','find by chance; seem','I came across an old photo of us. He comes across as shy.'],
  ['figure out','understand, solve','I can\'t figure out how this app works.'],
  ['get over','recover from','It took her months to get over the flu.'],
  ['give up','stop trying; quit a habit','Don\'t give up now. You\'re nearly there.'],
  ['look into','investigate','The manager promised to look into my complaint.'],
  ['put off','postpone','We\'ve put off the wedding until spring.'],
  ['run out of','have none left','We\'ve run out of milk.'],
  ['set up','establish, arrange','She set up her own company at 24.'],
  ['turn down','reject; lower the volume','He turned down the job offer.'],
  ['work out','calculate; exercise; end well','Everything worked out in the end.']]},
 {k:'tips', items:[
  "<b>Separable:</b> <i>turn the music down / turn it down</i>. With a pronoun, the object must go in the middle: not <i>turn down it</i>.",

 {k:'mc', items:[

  ["Can you ___ the kids while I'm at the shops?",["look for","look after","look up"],1,"Take care of."],

{id:'coll', t:'Collocations', sub:'Words that naturally go together',

{id:'conf', t:'Commonly confused words', sub:'Pairs that trip up even fluent speakers',
 intro:"These pairs look or sound similar but are not interchangeable. Learn the difference once and you will stop second-guessing.",
 blocks:[
 {k:'pairs', head:['Pair','Difference','Example'], items:[
  ['affect / effect','affect is usually a verb; effect is usually a noun','The drought affected crops. The effect was severe.'],
  ['borrow / lend','borrow = take; lend = give','Can I borrow your pen? Can you lend me your pen?'],
  ['economic / economical','economic = about the economy; economical = saves money','This car is very economical on fuel.'],
  ['fun / funny','fun = enjoyable; funny = makes you laugh','The party was fun and his speech was funny.'],
  ['lose / loose','lose = verb; loose = not tight','I always lose weight when these jeans feel loose.'],
  ['raise / rise','raise needs an object; rise does not','They raised prices. Prices rose.'],
  ['sensible / sensitive','sensible = practical; sensitive = easily affected','That\'s a sensible plan. She\'s sensitive to criticism.'],
  ['actually / currently','actually = in fact; currently = now','I\'m currently in Hyderabad. Actually, I live in Chennai.']]},
 {k:'tips', items:["!<b>Actually</b> never means <i>now</i> in English. Speakers of many European and Indian languages often use it that way."]},
 {k:'mc', items:[
  ["The new policy will ___ thousands of workers.",["effect","affect"],1,"Verb: affect."],
  ["Could you ___ me some money until Friday?",["borrow","lend"],1,"Lend = give temporarily."],
  ["The sun ___ at 6 a.m.",["raises","rises"],1,"No object: rise."],
  ["It would be ___ to book in advance.",["sensitive","sensible"],1,"Practical, wise."]]}
 ]},

{id:'readB2', t:'Reading: The last bookshop', sub:'A short story with comprehension questions',
 intro:"Read the story, listen to it, then answer the questions. Try to guess the meaning of new words from context before you ask Vincy.",
 blocks:[
 {k:'read', title:'The last bookshop on Marlow Street', src:'Original short story, about 300 words', paras:[
  "For forty years, Arthur Penhale had opened his bookshop at exactly nine o'clock. He would unlock the door, turn the sign from Closed to Open, and put the kettle on, even on the days when nobody came in at all. Lately, those days had become the rule rather than the exception.",
  "The street had changed around him. The butcher's had become a phone repair shop, the bakery a branch of a coffee chain, and the cinema, where he had once taken his late wife on their first date, now sold mattresses. Arthur did not complain. He simply kept the shelves dusted and the prices low, and waited.",
  "One wet Tuesday in November, a girl of about fifteen sheltered in his doorway. She was clutching a phone with a cracked screen and looked as though she had been crying. Arthur, who was not in the habit of interfering, found himself offering her a cup of tea.",
  "She stayed for two hours. She had never been in a bookshop before, she admitted; she had always read on her phone. Arthur showed her his favourite shelves, and by the time the rain stopped she had chosen a battered copy of Jane Eyre. She tried to pay. He refused.",
  "The following Saturday she came back with three friends. The Saturday after that, there were eleven of them, and a teacher who asked whether Arthur might host a reading club. By spring, the shop that had been dying was the busiest place on Marlow Street, and Arthur had started opening at half past eight."]},
 {k:'mc', title:'Comprehension', items:[
  ["What does “those days had become the rule rather than the exception” mean?",["Days with no customers were now normal.","Arthur had made new rules for the shop.","Customers were coming less on exceptional days."],0,"The rule = what usually happens."],
  ["How did Arthur feel about the changes on his street?",["Angry","Accepting","Excited"],1,"“Arthur did not complain.”"],
  ["Why is it surprising that Arthur offered the girl tea?",["He didn't like teenagers.","He usually avoided getting involved in other people's business.","The shop was about to close."],1,"“Not in the habit of interfering.”"],
  ["What best describes the ending?",["Ironic","Tragic","Hopeful"],2,"The shop comes back to life."],
  ["What does “battered” mean in “a battered copy of Jane Eyre”?",["Old and damaged from use","Expensive and rare","Brand new"],0,"Battered = worn, damaged."]]},
 {k:'write', items:[["In 80 to 100 words, continue the story: what happens to the shop one year later?",""]]}
 ]}
]);

SEC('exp','Academic & critical',[
{id:'acad', t:'Academic writing', sub:'Precise, impersonal, evidence-based',
 intro:"Academic English values precision over decoration. Claims are supported, sources are integrated smoothly and the writer's stance is carefully controlled.",
 blocks:[
 {k:'table', title:'Reporting verbs and stance', head:['Neutral','Supportive','Critical / distancing'], rows:[
  ['states, notes, observes, describes','demonstrates, establishes, confirms, shows','claims, asserts, alleges, purports']]},
 {k:'ex', items:[
  ["Smith (2019) demonstrates that sleep loss impairs memory consolidation.","Demonstrates: the writer accepts the finding."],
  ["Jones (2021) claims that the effect is negligible; however, her sample was small.","Claims: the writer signals doubt."],
  ["These findings are consistent with earlier work on adolescent sleep (Lee, 2015).","Integrating a source without quoting it."],
  ["Further research is needed to establish whether the effect persists in adults.","A standard way to acknowledge limitations."]]},
 {k:'tips', items:["Avoid vague words like <i>thing, stuff, a lot, nice, big</i>. Prefer <i>factor, aspect, considerable, substantial</i>.","Do not start sentences with <i>And</i> or <i>But</i> in formal academic prose; use <i>Furthermore</i> or <i>However</i>."]},
 {k:'mc', items:[
  ["Which verb shows the writer doubts the source?",["demonstrates","purports","establishes"],1,""],
  ["Most academic: ",["There's loads of research on this.","A substantial body of research addresses this issue.","Lots of people have studied this a lot."],1,""]]},
 {k:'write', items:[["Paraphrase this source sentence in academic style and add a citation: <i>‘People who exercise regularly are less likely to feel anxious.’ (Patel, 2020)</i>","Regular physical activity appears to be associated with lower levels of anxiety (Patel, 2020)."]]}
 ]},
{id:'nom', t:'Nominalisation & concision', sub:'Turning actions into concepts',
 intro:"Nominalisation turns verbs and adjectives into nouns. It makes writing more abstract, dense and formal, which suits academic and policy writing, though overuse makes text heavy.",

  ['Prices rose sharply, so people were angry.','§The sharp rise in prices led to widespread anger.'],

  ['If we analyse the data carefully, we can see that…','§Careful analysis of the data reveals that…']]},

 ]},
{id:'crit', t:'Critical reading', sub:'Read between, behind and beyond the lines',
 intro:"Critical reading means evaluating a text, not just understanding it. Ask what is claimed, what evidence is offered, what is assumed and what is left out.",
 blocks:[
 {k:'read', title:'The four-day week', src:'Original opinion piece, about 220 words', paras:[
  "Every so often an idea arrives that seems too good to be true, and the four-day working week is the latest. Its advocates point to trials in which companies reported equal or higher productivity, happier staff and lower sickness rates. Who, they ask, could possibly object?",
  "Quite a few people, as it happens. The trials that generate the most enthusiastic headlines tend to involve office-based firms that volunteered to take part, which is rather like testing a new diet only on people who already enjoy salad. Hospitals, schools and factories, where output is tied to hours on site, have proved far less willing to experiment.",
  "None of this means the idea should be dismissed. A modest reduction in hours might well pay for itself in many sectors. But a policy that works beautifully for a design agency in London may be ruinous for a care home in Leeds. The debate would benefit from fewer slogans and rather more honesty about who, exactly, gets the extra day off."]},
 {k:'mc', title:'Evaluate the argument', items:[
  ["What is the writer's overall position?",["The four-day week should be banned.","The four-day week has promise but its evidence is limited and it won't suit every sector.","The four-day week is a proven success."],1,""],
  ["The salad comparison is used to point out…",["a sampling bias in the trials","the health benefits of a shorter week","that office workers eat better"],0,"Self-selected participants skew results."],
  ["“Who, they ask, could possibly object?” is an example of…",["a rhetorical question, presented with mild irony","a genuine survey question","a hedge"],0,""],
  ["Which word best describes the writer's tone?",["furious","sceptical but fair","enthusiastic"],1,""]]},
 {k:'write', items:[["In 80 to 120 words, identify one assumption the writer makes and one piece of evidence that would strengthen or weaken the argument.",""]]}
 ]}
]);

hest or most successful point","ex":["The empire reached its zenith in the 16th century.","At the zenith of her career, she retired.","The sun was at its zenith."]}]},{"w":"zero","pron":"/ˈzɪərəʊ/","lvl":"A1","d":{"syn":"nothing, nil, nought","col":"below zero, zero per cent, absolute zero, start from zero"},"senses":[{"pos":"noun","meaning":"the number 0; nothing at all","ex":["The temperature dropped below zero.","The chances are close to zero.","We started the business from zero."]},{"pos":"adjective","meaning":"not any","ex":["There is zero tolerance for cheating.","He has zero interest in sport.","The loan has zero interest."]}]},{"w":"zero in on","pron":"/ˌzɪərəʊ ˈɪn ɒn/","lvl":"C1","d":{"syn":"focus on, target, concentrate on","col":"zero in on the problem, zero in on a target"},"senses":[{"pos":"phrasal verb","meaning":"to give all your attention to one thing; to aim at something exactly","ex":["Let's zero in on the main issue.","The camera zeroed in on her face.","Police zeroed in on the suspect."]}]},{"w":"zero tolerance","pron":"/ˌzɪərəʊ ˈtɒlərəns/","lvl":"C1","d":{"syn":"strict enforcement, no exceptions","col":"zero-tolerance policy, zero tolerance for"},"senses":[{"pos":"noun","meaning":"a policy of strictly punishing every case of something, however small","ex":["The school has a zero-tolerance policy on bullying.","There's zero tolerance for drink-driving.","The company practises zero tolerance on harassment."]}]},{"w":"zero-sum","pron":"/ˌzɪərəʊ ˈsʌm/","lvl":"C2","d":{"syn":"win-lose","opp":"win-win","col":"zero-sum game"},"senses":[{"pos":"adjective","meaning":"(of a situation) in which one person's gain is another person's loss","ex":["Trade doesn't have to be a zero-sum game.","They see politics as zero-sum.","In a zero-sum game, someone always loses."]}]},{"w":"zest","pron":"/zest/","lvl":"C1","d":{"syn":"enthusiasm, energy, gusto; peel","opp":"apathy","forms":"zesty (adj)","col":"zest for life, lemon zest, add zest to"},"senses":[{"pos":"noun","meaning":"enthusiasm and energy; the outer skin of a lemon or orange","ex":["She has a real zest for life.","Add the zest of one lemon.","He approached every task with zest."]}]},{"w":"zesty","pron":"/ˈzesti/","lvl":"C1","d":{"syn":"tangy, lively, fresh","opp":"bland","col":"zesty flavour, zesty dressing"},"senses":[{"pos":"adjective","meaning":"having a strong, pleasant, slightly sour taste; full of energy","ex":["The salad has a zesty lime dressing.","Try this zesty mango pickle.","It was a zesty performance."]}]},{"w":"zigzag","pron":"/ˈzɪɡzæɡ/","lvl":"B2","d":{"syn":"wind, twist / zigzag line","col":"zigzag path, zigzag pattern, zigzag up the hill"},"senses":[{"pos":"noun","meaning":"a line with sharp turns from side to side","ex":["The path went up the hill in a zigzag.","The fabric has a zigzag pattern.","Draw a zigzag across the page."]},{"pos":"verb","meaning":"to move forward with sharp turns","ex":["The road zigzags up the mountain.","The rabbit zigzagged across the field.","He zigzagged through the traffic on his scooter."]}]},{"w":"zilch","pron":"/zɪltʃ/","lvl":"C1","d":{"syn":"nothing, zero, nil","col":"absolutely zilch"},"senses":[{"pos":"noun","meaning":"nothing (informal)","ex":["I know zilch about cars.","We earned zilch from the project.","The investigation found zilch."]}]},{"w":"zillion","pron":"/ˈzɪljən/","lvl":"B2","d":{"syn":"countless, millions","col":"a zillion times, zillions of"},"senses":[{"pos":"noun","meaning":"an extremely large number (informal)","ex":["I've told you a zillion times!","There are zillions of stars in the sky.","She has a zillion questions."]}]},{"w":"zinc","pron":"/zɪŋk/","lvl":"B2","d":{"syn":"metal, mineral","col":"zinc deficiency, zinc supplement"},"senses":[{"pos":"noun","meaning":"a bluish-white metal, also a mineral the body needs","ex":["The roof is made of zinc sheets.","Zinc helps the immune system.","Nuts and seeds are rich in zinc."]}]},{"w":"zip","pron":"/zɪp/","lvl":"B1","d":{"syn":"fastener (zipper US); speed / fasten; compress","col":"zip up, zip file, do up a zip, zip across"},"senses":[{"pos":"noun","meaning":"a fastener with two rows of metal or plastic teeth; energy (informal)","ex":["The zip on my jacket is broken.","Do up your zip.","The team played with lots of zip."]},{"pos":"verb","meaning":"to fasten with a zip; to move very fast; to compress computer files","ex":["Zip up your coat; it's cold.","Scooters zipped past us.","Zip the files before you email them."]}]},{"w":"zip code","pron":"/ˈzɪp kəʊd/","lvl":"B1","d":{"syn":"postcode (UK), PIN code (India)","col":"enter your zip code"},"senses":[{"pos":"noun","meaning":"a group of numbers in an address that helps deliver post (US); in India called a PIN code","ex":["Enter your zip code to find a store.","What's the zip code for this area?","In India, we write a six-digit PIN code."]}]},{"w":"zippy","pron":"/ˈzɪpi/","lvl":"C1","d":{"syn":"lively, quick, nippy","opp":"sluggish","col":"zippy little car, zippy tune"},"senses":[{"pos":"adjective","meaning":"lively and fast (informal)","ex":["She drives a zippy little car.","It's a zippy pop song.","The new laptop feels zippy."]}]},{"w":"zodiac","pron":"/ˈzəʊdiæk/","lvl":"B2","d":{"syn":"star signs, horoscope","col":"sign of the zodiac, Chinese zodiac"},"senses":[{"pos":"noun","meaning":"the twelve signs used in astrology","ex":["What sign of the zodiac are you?","2024 was the Year of the Dragon in the Chinese zodiac.","Many newspapers print zodiac predictions."]}]},{"w":"zombie","pron":"/ˈzɒmbi/","lvl":"B2","d":{"syn":"walking dead; exhausted person","col":"zombie film, feel like a zombie"},"senses":[{"pos":"noun","meaning":"a dead body brought back to life in horror stories; a person who seems tired and unaware","ex":["The film is about a zombie attack.","I felt like a zombie after the night shift.","He walked around like a zombie."]}]},{"w":"zone","pron":"/zəʊn/","lvl":"B2","d":{"syn":"area, region, sector / designate","forms":"zoning (n)","col":"time zone, no-parking zone, comfort zone, in the zone"},"senses":[{"pos":"noun","meaning":"an area with a particular feature or use","ex":["This is a no-parking zone.","They live in an earthquake zone.","When I'm painting, I'm in the zone."]},{"pos":"verb","meaning":"to officially decide how an area of land can be used","ex":["The land is zoned for housing.","The area was zoned as a green belt.","The council zoned the street for shops."]}]},{"w":"zonked","pron":"/zɒŋkt/","lvl":"C1","d":{"syn":"exhausted, worn out","opp":"energetic","col":"zonked out"},"senses":[{"pos":"adjective","meaning":"extremely tired (informal)","ex":["I was totally zonked after the trek.","He fell asleep, zonked out on the sofa.","We were zonked after the wedding."]}]},{"w":"zoo","pron":"/zuː/","lvl":"A1","d":{"syn":"zoological park, menagerie","col":"go to the zoo, city zoo, it's a zoo in here"},"senses":[{"pos":"noun","meaning":"a place where wild animals are kept for people to see; a very busy, chaotic place (informal)","ex":["We took the children to the zoo.","The zoo has two white tigers.","The office was a zoo this morning."]}]},{"w":"zoology","pron":"/zuˈɒlədʒi/","lvl":"B2","d":{"syn":"animal biology","forms":"zoologist (n), zoological (adj)","col":"study zoology, degree in zoology"},"senses":[{"pos":"noun","meaning":"the scientific study of animals","ex":["She has a degree in zoology.","Zoology is part of the biology syllabus.","He became interested in zoology as a child."]}]},{"w":"zoom","pron":"/zuːm/","lvl":"B1","d":{"syn":"speed, rush; magnify","col":"zoom in, zoom out, zoom past, zoom lens"},"senses":[{"pos":"verb","meaning":"to move very fast; to make an image bigger or smaller with a camera or screen","ex":["Cars zoomed past on the highway.","Zoom in to see the details.","Prices zoomed up after the budget."]},{"pos":"noun","meaning":"a lens that makes distant things look closer","ex":["Use the zoom to photograph the birds.","This camera has a powerful zoom.","The zoom lens is heavy."]}]},{"w":"zucchini","pron":"/zuˈkiːni/","lvl":"B1","d":{"syn":"courgette (UK)","col":"grilled zucchini, zucchini soup"},"senses":[{"pos":"noun","meaning":"a long green vegetable (American English; British English: courgette)","ex":["Slice the zucchini thinly.","Zucchini grows well in summer.","In Britain, zucchini is called a courgette."]}]}];
