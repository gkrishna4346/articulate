  }
  if(w.chart==='maps'){
    const sty = {b:'fill:var(--panel2);stroke:var(--ink)', g:'fill:var(--int-soft);stroke:var(--int)', w:'fill:var(--rul-soft);stroke:var(--rul)', r:'fill:var(--line);stroke:none', p:'fill:var(--panel);stroke:var(--muted);stroke-dasharray:4 3'};
    const one = mp => `<div class="mk-map"><h5>${esc(mp.label)}</h5><svg viewBox="0 0 600 380" role="img" aria-label="${esc(mp.label)}"><rect x="4" y="4" width="592" height="372" rx="10" style="fill:var(--bg);stroke:var(--ink)" stroke-width="2"/>${mp.areas.map(([t,x,y,ww,hh,k])=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${k==='r'?0:7}" style="${sty[k]||sty.b}" stroke-width="1.4"/>${t?`<text x="${x+ww/2}" y="${y+hh/2+5}" text-anchor="middle" class="pl-f" style="font-size:${t.length>12?17:19}px">${esc(t)}</text>`:''}`).join('')}<text x="300" y="34" text-anchor="middle" class="pl-f" style="font-weight:800;font-size:18px">N ↑</text></svg></div>`;
    return fig(`<div class="mk-maps">${w.maps.map(one).join('')}</div>`);
  }
  return '';
}

/* ---------- question rendering (exam style: answer now, marked on submit) ---------- */
const OPT_L = 'ABCDEFGHIJ';
function renderGroups(groups, ctx){
  return groups.map(g=>{
    const first = ctx.n + 1;
    let body = '', count = 0;
    const qn = () => { ctx.n++; count++; return ctx.n; };
    const push = (key, kind, extra) => { ctx.keys.push(Object.assign({n:ctx.n, key, kind}, extra||{})); };
    if(g.type==='gap'){
      body = (g.title?`<div class="mq-title">${esc(g.title)}</div>`:'') + g.items.map(([pre,ans,post])=>{ const n = qn(); push(ans,'text'); return `<div class="mq-row"><span class="mq-n">${n}</span><span class="mq-gap">${pre} <input class="mq-in" data-q="${n}" autocomplete="off" spellcheck="false" aria-label="Question ${n}"> ${post}</span></div>`; }).join('');
    } else if(g.type==='mc'){
      body = g.items.map(([q,opts,a])=>{ const n = qn(); push(OPT_L[a],'radio'); return `<div class="mq-row col"><div><span class="mq-n">${n}</span> ${q}</div><div class="mq-opts">${opts.map((o,j)=>`<label class="mq-opt"><input type="radio" name="q${n}" value="${OPT_L[j]}" data-q="${n}"><b>${OPT_L[j]}</b> ${o}</label>`).join('')}</div></div>`; }).join('');
    } else if(g.type==='mc2'){
      const n1 = qn(), n2 = qn();
      ctx.keys.push({n:n1, n2, kind:'pair', key:g.answers.map(i=>OPT_L[i])});
      body = `<div class="mq-row col"><div><span class="mq-n">${n1}–${n2}</span> ${g.q||''}</div><div class="mq-opts">${g.opts.map((o,j)=>`<label class="mq-opt"><input type="checkbox" value="${OPT_L[j]}" data-pair="${n1}"><b>${OPT_L[j]}</b> ${o}</label>`).join('')}</div></div>`;
    } else if(g.type==='match' || g.type==='map'){
      const letters = g.type==='map' ? g.letters.split('') : g.options.map(o=>o[0]);
      body = (g.options ? `<div class="mq-box">${g.options.map(([l,t])=>`<div><b>${l}</b> ${t}</div>`).join('')}</div>` : '') +
        g.items.map(([t,a])=>{ const n = qn(); push(a,'select'); return `<div class="mq-row"><span class="mq-n">${n}</span><span class="mq-txt">${t}</span><select class="mq-sel" data-q="${n}" aria-label="Question ${n}"><option value="">–</option>${letters.map(l=>`<option>${l}</option>`).join('')}</select></div>`; }).join('');
    } else if(g.type==='tfng'){
      const opts = g.yn ? [['Y','YES'],['N','NO'],['NG','NOT GIVEN']] : [['T','TRUE'],['F','FALSE'],['NG','NOT GIVEN']];
      body = g.items.map(([s,a])=>{ const n = qn(); push(a,'radio'); return `<div class="mq-row col"><div><span class="mq-n">${n}</span> ${s}</div><div class="mq-opts tf">${opts.map(([v,l])=>`<label class="mq-opt"><input type="radio" name="q${n}" value="${v}" data-q="${n}">${l}</label>`).join('')}</div></div>`; }).join('');
    } else if(g.type==='headings'){
      body = `<div class="mq-box"><div class="mq-box-h">List of headings</div>${g.options.map(([l,t])=>`<div><b>${l}</b> ${t}</div>`).join('')}</div>` +
        g.items.map(([t,a])=>{ const n = qn(); push(a,'select'); return `<div class="mq-row"><span class="mq-n">${n}</span><span class="mq-txt">${t}</span><select class="mq-sel" data-q="${n}" aria-label="Question ${n}"><option value="">–</option>${g.options.map(o=>`<option>${o[0]}</option>`).join('')}</select></div>`; }).join('');
    } else if(g.type==='summary'){
      let i = 0;
      const txt = esc(g.text).replace(/\{\d+\}/g, ()=>{ const n = qn(); push(g.answers[i++],'select'); return `<span class="mq-n sm">${n}</span><select class="mq-sel in" data-q="${n}" aria-label="Question ${n}"><option value="">–</option>${g.options.map(o=>`<option>${o[0]}</option>`).join('')}</select>`; });
      body = `<div class="mq-box">${g.options.map(([l,t])=>`<span class="mq-word"><b>${l}</b> ${t}</span>`).join('')}</div><p class="mq-sum">${txt}</p>`;
    }
    const last = ctx.n;
    return `<section class="mq-group"><div class="mq-head">Questions ${first}${last>first?'–'+last:''}</div><p class="mq-instr">${g.instr}</p>${body}</section>`;
  }).join('');
}
const normAns = s => String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/£/g,'').replace(/\s+/g,' ').replace(/[.!?,]+$/,'').trim();
function markTest(root, keys){
  let raw = 0;
  const results = keys.map(k=>{
    let user = '', ok = false, pts = 1;
    if(k.kind==='text'){ const el = root.querySelector(`.mq-in[data-q="${k.n}"]`); user = el.value.trim(); ok = !!user && k.key.split('|').some(a=>normAns(a)===normAns(user)); el.classList.add(ok?'ok':'no'); el.disabled = true; }
    else if(k.kind==='radio'){ const el = root.querySelector(`input[name="q${k.n}"]:checked`); user = el ? el.value : ''; ok = user===k.key; root.querySelectorAll(`input[name="q${k.n}"]`).forEach(x=>{ x.disabled = true; const lab = x.closest('.mq-opt'); if(x.value===k.key) lab.classList.add('right'); else if(x.checked) lab.classList.add('wrong'); }); }
    else if(k.kind==='select'){ const el = root.querySelector(`.mq-sel[data-q="${k.n}"]`); user = el.value; ok = !!user && k.key.split('|').includes(user); el.classList.add(ok?'ok':'no'); el.disabled = true; }
    else if(k.kind==='pair'){ const boxes = [...root.querySelectorAll(`input[data-pair="${k.n}"]`)], chosen = boxes.filter(b=>b.checked).map(b=>b.value); pts = 2; const got = chosen.slice(0,2).filter(c=>k.key.includes(c)).length; raw += got; boxes.forEach(b=>{ b.disabled = true; const lab = b.closest('.mq-opt'); if(k.key.includes(b.value)) lab.classList.add('right'); else if(b.checked) lab.classList.add('wrong'); }); return {n:k.n, n2:k.n2, ok:got===2, got, user:chosen.join(', '), key:k.key.join(', ')}; }
    if(ok) raw++;
    return {n:k.n, ok, user, key:k.key.split('|')[0]};
  });
  root.querySelectorAll('.mq-row').forEach(r=>{ const inp = r.querySelector('[data-q]'); if(!inp) return; const res = results.find(x=>x.n===+inp.dataset.q); if(res && !res.ok && !r.querySelector('.mq-key')) r.insertAdjacentHTML('beforeend', `<span class="mq-key">Answer: <b>${esc(res.key)}</b></span>`); });
  root.querySelectorAll('.mq-sum select').forEach(sel=>{ const res = results.find(x=>x.n===+sel.dataset.q); if(res && !res.ok) sel.insertAdjacentHTML('afterend', `<span class="mq-key in">${esc(res.key)}</span>`); });
  return {raw, results};
}

function renderMockHome(){

    <tbody>${[1,2,3,4,5].map(n=>`<tr><th scope="row">Test ${n}</th>${MOCK_SECTIONS.map(s=>`<td>${cell(s,n)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="tips" style="margin-top:18px">
      <div class="tip">${I.info}<p>Listening and Reading are marked automatically, with a band score and the correct answers. Writing and Speaking get an examiner-style estimate from Vincy when this page is opened in Claude.</p></div>

/* ---------- start screen ---------- */
const MOCK_RULES = {

  'reading-gt':['There are 3 sections and 40 questions.','You have <b>60 minutes</b>. The test submits automatically when time runs out.','Section 1 is quick everyday texts; save time for Section 3.','Spelling counts. Use words from the text where the instructions say so.'],
  'writing-ac':['There are 2 tasks. You have <b>60 minutes</b> in total.','Spend about 20 minutes on Task 1 (at least 150 words) and 40 minutes on Task 2 (at least 250 words).','Task 2 carries more weight than Task 1.','When you submit, you\'ll see model answers and can ask Vincy for a band estimate.'],
  'writing-gt':['There are 2 tasks. You have <b>60 minutes</b> in total.','Spend about 20 minutes on the Task 1 letter (at least 150 words) and 40 minutes on Task 2 (at least 250 words).','Task 2 carries more weight than Task 1.','When you submit, you\'ll see model answers and can ask Vincy for a band estimate.'],
  'speaking':['The examiner\'s questions are read aloud. Answer each one as you would in the real test.','Part 1: short answers about familiar topics. Part 2: 1 minute to prepare, up to 2 minutes to speak. Part 3: longer discussion answers.','In Chrome or Edge, each answer is recorded so you can listen back. You can also type your answers for feedback from Vincy.','Find a quiet place. The whole test takes about 15 minutes.']

  $('page').innerHTML = `<div data-l="ielts" class="mk">

/* ---------- shared runner bits ---------- */
function mockBar(label, secs){
  return `<div class="mk-bar"><span class="mk-bar-t">${label}</span>${secs?`<span class="mk-clock" id="mkClock">${mmss(secs)}</span>`:''}<span class="hspace"></span><button class="btn sm" id="mkSubmit">Submit answers</button></div>`;
}
function startClock(secs, onEnd){
  let left = secs; const h = setInterval(()=>{ left--; const c = $('mkClock'); if(!c){ clearInterval(h); return; } c.textContent = mmss(left); c.classList.toggle('low', left<=300); if(left<=0){ clearInterval(h); onEnd(); } }, 1000);
  mockRun.timers.push(h);
}
function confirmSubmit(onYes){
  const root = $('mkRoot'), unanswered = mockRun.keys.filter(k=>{
    if(k.kind==='text') return !root.querySelector(`.mq-in[data-q="${k.n}"]`).value.trim();
    if(k.kind==='radio') return !root.querySelector(`input[name="q${k.n}"]:checked`);
    if(k.kind==='select') return !root.querySelector(`.mq-sel[data-q="${k.n}"]`).value;
    if(k.kind==='pair') return root.querySelectorAll(`input[data-pair="${k.n}"]:checked`).length<2;
  }).length;
  const bar = document.querySelector('.mk-bar');
  bar.querySelector('.mk-confirm')?.remove();
  bar.insertAdjacentHTML('beforeend', `<div class="mk-confirm"><span>${unanswered ? `${unanswered} question${unanswered>1?'s are':' is'} unanswered. There's no penalty for guessing.` : 'All questions answered.'} Submit now?</span><button class="btn sm" id="mkYes">Submit</button><button class="btn ghost sm" id="mkNo">Keep going</button></div>`);
  $('mkYes').onclick = onYes; $('mkNo').onclick = () => bar.querySelector('.mk-confirm').remove();
}
function finishObjective(sec, n, table){
  const root = $('mkRoot');
  mockRun.timers.forEach(h=>clearInterval(h)); try{ speechSynthesis.cancel(); }catch(e){}
  const {raw, results} = markTest(root, mockRun.keys), band = rawToBand(table, raw);
  const k = mockKey(sec,n), prev = mockScores[k];
  if(!prev || raw > (prev.raw||0)){ mockScores[k] = {raw, band, at:Date.now()}; store.set('mockScores', mockScores); }
  const wrong = results.filter(r=>!r.ok).map(r=>r.n2?`${r.n}–${r.n2}`:r.n);
  document.querySelector('.mk-bar').outerHTML = `<div class="mk-result"><div class="mk-score"><span>Score</span><b>${raw}/40</b></div><div class="mk-score band"><span>Estimated band</span><b>${fmtBand(band)}</b></div><div class="mk-res-t"><p>${raw>=35?'Excellent work.':raw>=30?'Strong result: around band 7.':raw>=23?'Solid. Review the questions you missed below.':'Keep practising. Study the correct answers and the ' + (sec==='listening'?'transcripts.':'passages.')}</p>${wrong.length?`<p class="ie-note">Check questions: ${wrong.join(', ')}</p>`:''}<div class="row"><button class="btn sm" data-go="mock">Back to mock tests</button><button class="btn ghost sm" id="mkRetry">Try this test again</button>${sec==='listening'?'':''}</div></div></div>`;
  $('mkRetry').onclick = () => renderMockStart(sec, n);
  root.querySelectorAll('.mk-transcript').forEach(d=>{ d.hidden = false; });
  root.querySelectorAll('.mk-play').forEach(b=>{ b.disabled = false; b.innerHTML = I.play+'Play again'; });
  mockRun.done = true;
  $('scroller').scrollTop = 0;
}

/* ---------- run a test ---------- */
function startMock(sec, n, opts){
  mockStopAll();
  const T = MOCK_TESTS.find(t=>t.n===n);
  mockRun = {sec, n, keys:[], timers:[], once:opts.once};
  if(sec==='listening') runListening(T, n);
  else if(sec==='reading-ac' || sec==='reading-gt') runReading(T, n, sec);
  else if(sec==='writing-ac' || sec==='writing-gt') runWriting(T, n, sec);
  else if(sec==='speaking') runSpeaking(T, n);
  $('scroller').scrollTop = 0;
}

function runListening(T, n){
  const ctx = {n:0, keys:mockRun.keys};
  const parts = T.listening.map((p,i)=>{
    const qs = renderGroups(p.groups, ctx);
    return `<section class="mk-part" data-part="${i}"><div class="mk-part-h"><h3>${esc(p.title)}</h3><span>${esc(p.context)}</span></div>
      ${p.plan ? planSVG(p.plan) : ''}
      <div class="row mk-playrow">${canSpeak?`<button class="btn sm mk-play" data-part="${i}">${I.play}Play ${esc(p.title)}</button>`:''}<span class="ie-prog" data-prog="${i}"></span></div>
      ${qs}
      <details class="rev mk-transcript" hidden><summary>Transcript</summary><div class="dlg" style="margin-top:10px">${p.lines.map(([w,t],k)=>`<div class="line${k%2?' b':''}"><span class="who">${esc(w)}</span><div class="bub">${esc(t)}</div></div>`).join('')}</div></details>
    </section>`;
  }).join('');
  $('page').innerHTML = `<div data-l="ielts" class="mk mk-run" id="mkRoot">${mockBar(`Test ${n}: Listening`)}${parts}<div class="row" style="margin-top:20px"><button class="btn" id="mkSubmit2">Submit answers</button></div></div>`;
  const submit = () => confirmSubmit(()=>finishObjective('listening', n, 'listening'));
  $('mkSubmit').onclick = submit; $('mkSubmit2').onclick = () => { document.querySelector('.mk-bar').scrollIntoView(); submit(); };
  $('mkRoot').addEventListener('click', e=>{
    const b = e.target.closest('.mk-play'); if(!b) return;
    const i = +b.dataset.part, prog = document.querySelector(`[data-prog="${i}"]`);
    document.querySelectorAll('.mk-play').forEach(x=>{ if(x!==b && x.dataset.playing){ x.dataset.playing=''; } });
    b.disabled = true; b.dataset.playing = '1';
    playLines(T.listening[i].lines, (k,tot)=>{ prog.textContent = `Playing… ${Math.round(k/tot*100)}%`; }, ()=>{
      b.dataset.playing = '';
      if(mockRun && !mockRun.done && mockRun.once){ b.innerHTML = I.check+'Played'; prog.textContent = 'Recording finished.'; }
      else { b.disabled = false; b.innerHTML = I.play+'Play again'; prog.textContent = 'Recording finished.'; }
    });
  });
}
function playLines(lines, onProg, onEnd){
  try{ speechSynthesis.cancel(); }catch(e){}
  const run = mockRun, speakers = [...new Set(lines.map(l=>l[0]))];
  const vs = speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-')===accent);
  let i = 0;
  const next = () => {
    if(!mockRun || mockRun!==run || run.stopped) return;
    if(i >= lines.length){ onEnd(); return; }
    const [who, text] = lines[i], k = speakers.indexOf(who);
    const u = new SpeechSynthesisUtterance(text); u.lang = accent; u.rate = .95;
    if(vs.length > 1) u.voice = vs[k % vs.length]; else { if(voice) u.voice = voice; u.pitch = [.92,1.15,1.03][k%3]; }
    u.onend = () => { i++; setTimeout(next, 300); }; u.onerror = () => { i++; setTimeout(next, 80); };
    onProg(i, lines.length); curUtter = u; speechSynthesis.speak(u);
  };
  setTimeout(next, 200);
}

function readingBlocks(sec){
  // Academic: {title, paras, groups}. General Training: {title, texts, groups, texts2?, groups2?}
  if(sec.paras) return [{texts:[{title:sec.title, paras:sec.paras}], groups:sec.groups}];
  const out = [{texts:sec.texts, groups:sec.groups}];
  if(sec.texts2) out.push({texts:sec.texts2, groups:sec.groups2});
  return out;
}
function runReading(T, n, sec){
  const secs = sec==='reading-ac' ? T.readingAc : T.readingGt, ctx = {n:0, keys:mockRun.keys};
  const panes = secs.map((S,i)=>{
    const blocks = readingBlocks(S);
    const texts = blocks.map(b=>b.texts.map(t=>`<article class="ie-passage mk-text"><h4>${esc(t.title)}</h4>${t.paras.map(([l,p])=>`<div class="ie-para">${l?`<span class="ie-pl">${l}</span>`:''}<p>${p}</p></div>`).join('')}</article>`).join('')).join('<hr class="mk-hr">');
    const qs = blocks.map(b=>renderGroups(b.groups, ctx)).join('');
    return `<section class="mk-rsec" data-sec="${i}" ${i?'hidden':''}><div class="mk-split"><div class="mk-left">${texts}</div><div class="mk-right">${qs}</div></div></section>`;
  }).join('');
  const label = sec==='reading-ac' ? 'Passage' : 'Section';
  $('page').innerHTML = `<div data-l="ielts" class="mk mk-run wide" id="mkRoot">${mockBar(`Test ${n}: Reading, ${MS[sec].ver}`, 3600)}
    <div class="mk-tabs" role="tablist">${secs.map((S,i)=>`<button role="tab" data-tab="${i}" aria-selected="${!i}">${label} ${i+1}</button>`).join('')}</div>${panes}
    <div class="row mk-nav"><button class="btn ghost sm" id="mkPrev">${I.back}Previous ${label.toLowerCase()}</button><span class="hspace"></span><button class="btn sm" id="mkNext">Next ${label.toLowerCase()}${I.next}</button></div></div>`;
  const show = i => { document.querySelectorAll('.mk-rsec').forEach(s=>s.hidden = +s.dataset.sec!==i); document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected', +t.dataset.tab===i)); mockRun.cur = i; $('mkPrev').disabled = i===0; $('mkNext').disabled = i===secs.length-1; $('scroller').scrollTop = 0; document.querySelectorAll('.mk-left,.mk-right').forEach(p=>p.scrollTop=0); };
  mockRun.cur = 0; show(0);
  document.querySelector('.mk-tabs').onclick = e=>{ const t = e.target.closest('[data-tab]'); if(t) show(+t.dataset.tab); };
  $('mkPrev').onclick = () => show(Math.max(0, mockRun.cur-1)); $('mkNext').onclick = () => show(Math.min(secs.length-1, mockRun.cur+1));
  const table = sec==='reading-ac' ? 'acReading' : 'gtReading';
  const finish = () => { finishObjective(sec, n, table); document.querySelectorAll('.mk-rsec').forEach(s=>s.hidden=false); document.querySelector('.mk-tabs')?.remove(); document.querySelector('.mk-nav')?.remove(); };
  $('mkSubmit').onclick = () => confirmSubmit(finish);
  startClock(3600, ()=>{ if(mockRun && !mockRun.done) finish(); });
}

function runWriting(T, n, sec){
  const W = T.writing, t1 = sec==='writing-ac' ? W.ac : W.gt;
  const task = (k, t, min, title) => `<section class="mk-task" data-task="${k}">

    <div class="mk-after" hidden><div class="row"><button class="btn vincy sm mk-fb" data-k="${k}">${mascot()}Get a band estimate from Vincy</button><details class="rev" style="margin:0"><summary>Show the model answer</summary><div class="model">${esc(t.model)}</div></details></div><div class="fb-out"></div></div>
  </section>`;
  $('page').innerHTML = `<div data-l="ielts" class="mk mk-run" id="mkRoot">${mockBar(`Test ${n}: Writing, ${MS[sec].ver}`, 3600)}
    <div class="mk-tabs" role="tablist"><button role="tab" data-tab="1" aria-selected="true">Task 1</button><button role="tab" data-tab="2" aria-selected="false">Task 2</button></div>
    <div class="mk-tpane" data-pane="1">${task(1, t1, 150, sec==='writing-ac'?'Task 1 Academic':'Task 1 General Training')}</div>
    <div class="mk-tpane" data-pane="2" hidden>${task(2, W.t2, 250, 'Task 2')}</div></div>`;
  const show = k => { document.querySelectorAll('.mk-tpane').forEach(p=>p.hidden = p.dataset.pane!==String(k)); document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===String(k))); };
  document.querySelector('.mk-tabs').onclick = e=>{ const t = e.target.closest('[data-tab]'); if(t) show(+t.dataset.tab); };
  $('mkRoot').addEventListener('input', e=>{ const t = e.target.closest('.mk-w'); if(!t) return; const nW = wordCount(t.value), min = +t.dataset.min; document.querySelector(`[data-wc="${t.dataset.k}"]`).innerHTML = `<b>${nW}</b> words${nW<min?` <span class="ie-short">(${min-nW} to go)</span>`:` <span class="ie-ok">${I.check}</span>`}`; });
  const finish = () => {

    document.querySelectorAll('.mk-tpane').forEach(p=>p.hidden=false); document.querySelector('.mk-tabs')?.remove();
    document.querySelectorAll('.mk-after').forEach(a=>a.hidden=false);
    document.querySelector('.mk-bar').outerHTML = `<div class="mk-result"><div class="mk-res-t"><p><b>Submitted.</b> Task 1: ${w1} words${w1<150?' (under 150)':''}. Task 2: ${w2} words${w2<250?' (under 250)':''}. Compare each task with its model answer, and ask Vincy for an examiner-style band estimate.</p><div class="row"><button class="btn sm" data-go="mock">Back to mock tests</button></div></div></div>`;
  };
  $('mkSubmit').onclick = () => { const bar = document.querySelector('.mk-bar'); bar.querySelector('.mk-confirm')?.remove(); bar.insertAdjacentHTML('beforeend', `<div class="mk-confirm"><span>Finish the Writing test now?</span><button class="btn sm" id="mkYes">Submit</button><button class="btn ghost sm" id="mkNo">Keep writing</button></div>`); $('mkYes').onclick = finish; $('mkNo').onclick = () => bar.querySelector('.mk-confirm').remove(); };
  $('mkRoot').addEventListener('click', e=>{ const b = e.target.closest('.mk-fb'); if(!b) return; const k = +b.dataset.k, sec2 = b.closest('.mk-task'), t = k===1 ? t1 : W.t2;
    // reuse the examiner feedback used in lessons by giving it the same data attributes
    Object.assign(sec2.dataset, {task:String(k), gt: (k===1 && sec==='writing-gt') ? '1':'0', min: String(k===1?150:250), prompt: strip(t.prompt), model: t.model||''});
    sec2.querySelector('.mk-w').classList.add('ie-text'); sec2.querySelector('.mk-fb').classList.add('ie-fb'); ieFeedback(sec2); });

}

/* ---------- speaking mock interview ---------- */
function runSpeaking(T, n){
  const S = T.speaking, steps = [];
  steps.push({part:1, q:'Good morning. My name is Vincy, and I\'ll be your examiner today. Can you tell me your full name, please?'});
  S.p1.forEach(t=>{ steps.push({part:1, q:`Now let's talk about ${t.topic.toLowerCase()}. ${t.qs[0]}`, show:t.qs[0], topic:t.topic}); t.qs.slice(1).forEach(q=>steps.push({part:1, q, topic:t.topic})); });
  steps.push({part:2, cue:true, q:'Now I\'m going to give you a topic, and I\'d like you to talk about it for one to two minutes. You have one minute to think about what you\'re going to say. You can make some notes if you wish.'});
  steps.push({part:2, q:S.p2.follow, follow:true});
  steps.push({part:3, q:`We've been talking about ${S.p2.topic.replace(/^Describe /,'').replace(/\.$/,'')}. I'd like to discuss some more general questions related to this. ${S.p3.qs[0]}`, show:S.p3.qs[0], theme:S.p3.theme});
  S.p3.qs.slice(1).forEach(q=>steps.push({part:3, q}));
  mockRun.steps = steps; mockRun.i = -1; mockRun.answers = steps.map(()=>({text:'', url:null}));
  const recOK = canRecord && !inClaude;
  $('page').innerHTML = `<div data-l="ielts" class="mk mk-run" id="mkRoot">
    <div class="mk-bar"><span class="mk-bar-t">Test ${n}: Speaking</span><span class="mk-steps" id="mkPart"></span><span class="hspace"></span><span class="mk-clock" id="mkClock">0:00</span></div>
    <div class="mk-exam" id="mkExam"></div></div>`;
  const exam = $('mkExam');
  const examinerSay = (text, cb) => { if(!canSpeak){ cb && cb(); return; } try{ speechSynthesis.cancel(); }catch(e){} const u = new SpeechSynthesisUtterance(text); u.lang = accent; if(voice) u.voice = voice; u.rate = .95; u.onend = u.onerror = () => cb && cb(); curUtter = u; setTimeout(()=>speechSynthesis.speak(u), 120); };
  let tick = null, secs = 0;
  const startCount = (limit, down) => { clearInterval(tick); secs = down ? limit : 0; const c = $('mkClock'); c.textContent = mmss(secs); tick = setInterval(()=>{ secs += down ? -1 : 1; if(!$('mkClock')){ clearInterval(tick); return; } $('mkClock').textContent = mmss(Math.max(0,secs)); $('mkClock').classList.toggle('low', down && secs<=10); if(down && secs<=0){ clearInterval(tick); onZero && onZero(); } }, 1000); mockRun.timers.push(tick); };
  let onZero = null;
  const startRec = async () => { if(!recOK) return; try{ mockRun.stream = mockRun.stream || await navigator.mediaDevices.getUserMedia({audio:true}); const chunks = []; const r = new MediaRecorder(mockRun.stream); r.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); }; r.start(); mockRun.rec = r; mockRun.chunks = chunks; }catch(e){ mockRun.recBlocked = true; } };
  const stopRec = () => new Promise(res=>{ const r = mockRun && mockRun.rec; if(!r || r.state==='inactive'){ res(null); return; } r.onstop = () => res(mockRun.chunks.length ? URL.createObjectURL(new Blob(mockRun.chunks, {type:r.mimeType||'audio/webm'})) : null); r.stop(); mockRun.rec = null; });
  const partName = p => ['','Part 1: Interview','Part 2: Long turn','Part 3: Discussion'][p];
  const show = async i => {
    if(!mockRun) return;
    if(mockRun.i >= 0){ const url = await stopRec(); if(!mockRun) return; const a = mockRun.answers[mockRun.i]; if(url) a.url = url; const ta = exam.querySelector('.mk-ans'); if(ta) a.text = ta.value.trim(); }
    mockRun.i = i; onZero = null;
    if(i >= steps.length){ return finishSpeaking(); }
    const st = steps[i]; $('mkPart').textContent = `${partName(st.part)}, question ${i+1} of ${steps.length}`;
    if(st.cue){
      exam.innerHTML = `<div class="mk-q"><span class="mk-who">${mascot()}Examiner</span><p>${esc(st.q)}</p></div>
        <div class="ie-card"><b>${esc(S.p2.topic)}</b><p>You should say:</p><ul>${S.p2.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
        <div class="mk-phase" id="mkPhase">Preparation: 1 minute</div>
        <textarea class="w mk-notes" placeholder="Your notes" aria-label="Your notes" rows="3"></textarea>
        <textarea class="w mk-ans" placeholder="${recOK?'Optional: type the main points of your answer for feedback':'Type your answer here, as if you were speaking'}" aria-label="Your answer" hidden></textarea>
        <div class="row"><button class="btn sm" id="mkGo">${I.next}Start speaking now</button></div>`;
      examinerSay(st.q);
      let phase = 'prep';
      const toSpeak = async () => { if(phase!=='prep') return; phase = 'speak'; try{ speechSynthesis.cancel(); }catch(e){} $('mkPhase').textContent = recOK && !mockRun.recBlocked ? 'Speak now (recording). Up to 2 minutes.' : 'Speak now. Up to 2 minutes.'; exam.querySelector('.mk-ans').hidden = false; $('mkGo').innerHTML = I.next+'I\'ve finished'; await startRec(); startCount(120, true); onZero = () => show(i+1); };
      onZero = toSpeak; startCount(60, true);
      $('mkGo').onclick = () => phase==='prep' ? toSpeak() : show(i+1);
      return;
    }
    exam.innerHTML = `<div class="mk-q"><span class="mk-who">${mascot()}Examiner</span><p>${esc(st.q)}</p>${canSpeak?`<button class="btn ghost sm" id="mkRepeat">${I.speak}Repeat the question</button>`:''}</div>
      ${recOK ? `<div class="mk-phase" id="mkPhase">Listen to the question…</div>` : ''}
      <textarea class="w mk-ans" placeholder="${recOK?'Optional: type the main points of your answer for feedback':'Type your answer here, as if you were speaking'}" aria-label="Your answer"></textarea>
      <div class="row"><button class="btn sm" id="mkGo">${I.next}${i===steps.length-1?'Finish the test':'Next question'}</button></div>`;
    const begin = async () => { if(recOK && !mockRun.recBlocked){ await startRec(); const ph = $('mkPhase'); if(ph) ph.textContent = mockRun.recBlocked ? 'The microphone is blocked. Type your answer instead.' : 'Answer now (recording).'; } startCount(0, false); };
    examinerSay(st.q, begin);
    if($('mkRepeat')) $('mkRepeat').onclick = () => examinerSay(st.q);
    $('mkGo').onclick = () => show(i+1);
    setTimeout(()=>{ const ta = exam.querySelector('.mk-ans'); if(ta && !recOK) ta.focus(); }, 60);
  };
  const finishSpeaking = () => {
    clearInterval(tick); try{ speechSynthesis.cancel(); }catch(e){}
    if(mockRun.stream){ mockRun.stream.getTracks().forEach(t=>t.stop()); mockRun.stream = null; }
    mockRun.done = true;
    mockScores[mockKey('speaking',n)] = Object.assign({}, mockScores[mockKey('speaking',n)]||{}, {done:true, at:Date.now()}); store.set('mockScores', mockScores);
    const A = mockRun.answers;
    $('mkPart').textContent = 'Test complete'; $('mkClock').textContent = '';
    exam.innerHTML = `<div class="mk-result" style="margin:0 0 18px"><div class="mk-res-t"><p><b>That's the end of the Speaking test.</b> Listen back to your answers, then ask Vincy for an estimated band. Vincy can only judge what you typed, so Pronunciation isn't assessed.</p>
      <div class="row"><button class="btn vincy sm" id="mkSpFb">${mascot()}Get a band estimate from Vincy</button><button class="btn ghost sm" id="mkLive">Practise this set live with Vincy</button><button class="btn ghost sm" data-go="mock">Back to mock tests</button></div><div class="fb-out" id="mkSpOut"></div></div></div>
      <ol class="mk-review">${steps.map((st,k)=>`<li><div class="mk-rq"><span class="chip">Part ${st.part}</span> ${esc(st.cue ? S.p2.topic : (st.show||st.q))}</div>${A[k].url?`<button class="btn ghost sm" data-playrec="${A[k].url}">${I.play}Your answer</button>`:''}${A[k].text?`<p class="mk-rt">${esc(A[k].text)}</p>`:(!A[k].url?'<p class="ie-note">No answer recorded.</p>':'')}</li>`).join('')}</ol>`;
    $('mkSpFb').onclick = () => speakingFeedback(S, steps, A);
    $('mkLive').onclick = () => { const opener = `Act as an IELTS Speaking examiner and run this exact test with me, asking ONE question at a time and waiting for my typed answer each time. Part 1 questions: ${S.p1.map(t=>t.topic+': '+t.qs.join(' / ')).join('; ')}. Part 2 task card: ${S.p2.topic} You should say: ${S.p2.points.join('; ')} (tell me I have one minute to prepare, then wait for my long answer), then ask: ${S.p2.follow} Part 3 questions: ${S.p3.qs.join(' / ')}. At the end, step out of role and give estimated bands for Fluency and Coherence, Lexical Resource and Grammatical Range and Accuracy (Pronunciation cannot be assessed from text), an overall estimate, and three specific improvements.`; turns = []; greet(); ask(opener, `Start Speaking Test ${n} with Vincy`); };
    $('scroller').scrollTop = 0;
  };
  exam.innerHTML = `<div class="mk-q"><span class="mk-who">${mascot()}Examiner</span><p>When you're ready, press <b>Begin</b>. I'll read each question aloud.${recOK?' Your answers will be recorded so you can listen back at the end.':''}</p></div><div class="row"><button class="btn" id="mkBegin">${I.play}Begin the interview</button></div>`;
  $('mkBegin').onclick = () => show(0);
}
async function speakingFeedback(S, steps, A){
  const out = $('mkSpOut'), typed = steps.map((st,k)=>({q: st.cue ? `Part 2 task: ${S.p2.topic} (${S.p2.points.join('; ')})` : (st.show||st.q), a:A[k].text})).filter(x=>x.a);
  if(typed.length < 4){ out.innerHTML = `<div class="fb">Vincy needs your answers in writing to estimate a band. Type at least four answers, or use <b>Practise this set live with Vincy</b>.</div>`; return; }
  if(!sampleReady){ out.innerHTML = `<div class="fb">Connecting to Vincy…</div>`; for(let i=0;i<40 && !sampleReady;i++) await new Promise(r=>setTimeout(r,250)); }
  if(!sample){ out.innerHTML = `<div class="fb">Band estimates work when this page is opened in Claude. Meanwhile, listen to your recordings and check: did you extend your answers with reasons and examples, and keep talking for the full two minutes in Part 2?</div>`; return; }
  const prompt = `You are an experienced IELTS Speaking examiner. A candidate took a mock Speaking test and typed (or summarised) their answers. Assess them using the public IELTS Speaking band descriptors. You cannot hear the candidate, so do not assess Pronunciation.

${typed.map((x,i)=>`Q${i+1}: ${x.q}\nA${i+1}: ${x.a.slice(0,1200)}`).join('\n\n')}

Reply in simple Markdown (bold, bullet lists; no headings or tables):
1. **Estimated bands**: Fluency and Coherence, Lexical Resource, Grammatical Range and Accuracy, each with a one-line reason, then an overall estimate (state clearly that Pronunciation is not included).
2. **Strengths**: two bullets.
3. **What would raise your band**: three specific, practical changes.
4. **Better answers**: improve two of the weakest answers at about one band higher, keeping the candidate's ideas.
Be honest and calibrated; do not inflate. Under 400 words.`;
  out.innerHTML = `<div class="fb"><div class="who">${mascot()}Vincy, examiner mode</div><div class="md" style="color:var(--muted)">Reading your answers…</div></div>`;
  const body = out.querySelector('.md');
  try{ const { text } = await sample(prompt, { cache:false, onText: ({text}) => { body.style.color=''; body.innerHTML = md(text); } }); body.style.color=''; body.innerHTML = md(text); }
  catch(e){ body.style.color=''; body.innerHTML = (e && e.text ? md(e.text) : '') + `<p style="color:var(--bad)">${esc(errCopy(e && e.code))}</p>`; }
}
