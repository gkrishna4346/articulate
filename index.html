SEC('rules','Grammar essentials',[
{id:'pos', t:'Parts of speech', sub:'The eight jobs a word can do',
 intro:"Every word in a sentence does a job. Traditional grammar names eight parts of speech; modern grammars add <b>determiners</b> as a ninth. Knowing them lets you understand dictionary entries, grammar explanations and your own mistakes.",
 blocks:[
 {k:'table', title:'The parts of speech', head:['Part of speech','Its job','Examples','In a sentence'], rows:[
  ['<b>Noun</b>','Names a person, place, thing or idea','teacher, Delhi, laptop, honesty','§Honesty is the best policy.'],
  ['<b>Pronoun</b>','Replaces a noun','he, they, it, herself, which, someone','§She told them herself.'],
  ['<b>Verb</b>','Shows an action or a state','run, become, seem, have, must','§The price seems high.'],
  ['<b>Adjective</b>','Describes a noun','careful, Indian, expensive, tired','§It was an expensive mistake.'],
  ['<b>Adverb</b>','Describes a verb, adjective, other adverb or a whole sentence','quickly, very, often, fortunately','§Fortunately, she drives very carefully.'],
  ['<b>Preposition</b>','Shows place, time, direction or relationship','in, on, at, since, during, despite','§We met at the station during the rain.'],
  ['<b>Conjunction</b>','Joins words, phrases or clauses','and, but, because, although, unless','§I stayed because it was raining.'],
  ['<b>Interjection</b>','Expresses a sudden feeling','oh, wow, ouch, hey, oops','§Oops! I dropped it.'],
  ['<b>Determiner</b>','Introduces a noun and limits its meaning','a, the, this, my, some, every, few','§Every student has a book.']]},
 {k:'table', title:'One word, many jobs', head:['Word','As…','Example'], rows:[
  ['back','noun','§My back hurts.'],['back','verb','§Will you back my proposal?'],['back','adjective','§Use the back door.'],['back','adverb','§She came back late.'],
  ['round','preposition','§We walked round the lake.'],['round','adjective',"§It's a round table."],['round','noun','§He won the first round.'],
  ['that','determiner','§That book is mine.'],['that','pronoun','§That was easy.'],['that','conjunction','§I know that you tried.']]},
 {k:'tips', items:[
  "A word's part of speech depends on its <b>job in the sentence</b>, not on the word itself. Always look at the context.",
  "Common noun endings: <i>-tion, -ment, -ness, -ity, -er, -ism</i>. Adjective endings: <i>-ful, -less, -ous, -ive, -able, -al</i>. Adverbs often end in <i>-ly</i>, but not always (<i>fast, hard, well</i>).",
  "!<i>Friendly, lovely, lonely</i> and <i>elderly</i> end in -ly but are adjectives. Say <i>in a friendly way</i>, not <i>friendlily</i>.",
  "!<i>Good</i> is an adjective; <i>well</i> is its adverb. <i>She sings well</i>, not <i>She sings good</i>."]},
 {k:'mc', title:'Name the part of speech', items:[
  ["She <b>rarely</b> complains.",["adjective","adverb","verb"],1,"Rarely tells us how often she complains."],
  ["We walked <b>along</b> the river.",["preposition","conjunction","adverb"],0,"Along + noun phrase shows direction."],
  ["The <b>meeting</b> was cancelled.",["verb","noun","adjective"],1,"The meeting is a thing: a noun formed from a verb."],
  ["I'll wait <b>until</b> you arrive.",["preposition","conjunction","adverb"],1,"It joins two clauses: I'll wait / you arrive."],
  ["<b>Several</b> people left early.",["pronoun","determiner","adjective"],1,"It comes before a noun and tells us how many."],
  ["He's a <b>fast</b> runner, and he runs <b>fast</b>.",["adjective, then adverb","adverb, then adjective","both adjectives"],0,"Fast describes runner, then describes runs."]]},
 {k:'gap', title:'Use the correct form', items:[
  ["She explained the rule very","clearly","(clear)","An adverb describes the verb explained."],
  ["His","decision","surprised us all. (decide)","A noun after a possessive."],
  ["The film was","disappointing","(disappoint)","An adjective after was."]]}
 ]},
{id:'stypes', t:'The four types of sentences', sub:'Statements, questions, commands and exclamations',
 intro:"Every English sentence has a <b>function</b>: it tells, asks, directs or exclaims. Each type has its own word order and end punctuation.",
 blocks:[
 {k:'table', head:['Type','Function','Word order','Ends with','Example'], rows:[
  ['<b>Declarative</b>','Makes a statement','Subject + verb','.','§The train leaves at six.'],
  ['<b>Interrogative</b>','Asks a question','Auxiliary + subject + verb, or a wh-word first','?','§When does the train leave?'],
  ['<b>Imperative</b>','Gives an order, request, advice or instruction','Base verb first; the subject "you" is understood','. or !','§Leave your bags here, please.'],
  ['<b>Exclamatory</b>','Shows strong feeling','What + (a) + adjective + noun, or How + adjective / adverb','!','§What a beautiful view this is!']]},
 {k:'ex', title:'Each type in action', items:[
  ["She has finished the report.","Declarative, positive."],
  ["She hasn't finished the report.","Declarative, negative: still a statement."],
  ["Has she finished the report?","Interrogative, yes/no question: auxiliary before subject."],
  ["Who finished the report?","Interrogative, subject question: no auxiliary needed because who is the subject."],
  ["Finish the report by Friday.","Imperative, instruction."],
  ["Don't forget to attach the file.","Negative imperative: Don't + base verb."],
  ["Let's finish it together.","Imperative suggestion with Let's."],
  ["How quickly she finished it!","Exclamatory with How + adverb."]]},
 {k:'tips', items:[
  "<b>What</b> is followed by a noun phrase (<i>What a day! What lovely weather!</i>). <b>How</b> is followed by an adjective or adverb (<i>How kind! How fast he runs!</i>).",
  "Indirect questions are declarative in form: <i>Can you tell me where the station <b>is</b>?</i>, not <i>where is the station</i>.",
  "!A sentence can look like one type but work as another. <i>Could you close the window?</i> is a question in form but a polite request in function.",
  "!Imperatives can sound rude on their own. Soften them with <i>please</i>, <i>could you</i> or <i>would you mind</i>."]},
 {k:'mc', items:[
  ["Which sentence is exclamatory?",["Is it cold today?","How cold it is today!","It is cold today."],1,""],
  ["“Please take a seat.” is…",["declarative","imperative","interrogative"],1,"It begins with the base verb take."],
  ["Choose the correct exclamation.",["What beautiful!","How a beautiful day!","What a beautiful day!"],2,"What + a + adjective + noun."],
  ["“I wonder where she lives.” is…",["declarative","interrogative"],0,"It ends with a full stop and has statement word order."],
  ["Which is a correct question?",["Where you are going?","Where are you going?","Where you going are?"],1,"Wh-word + auxiliary + subject + verb."]]},
 {k:'write', items:[["Write four sentences about your weekend: one of each type.","I visited my grandparents on Saturday. (declarative)\nHave you ever tried my grandmother's biryani? (interrogative)\nCall me before you visit next time. (imperative)\nWhat a wonderful afternoon we had! (exclamatory)"]]}
 ]},
{id:'sstruct', t:'Sentence structures', sub:'Simple, compound, complex and compound-complex',
 intro:"Sentences are also classified by <b>structure</b>: how many clauses they contain and how those clauses are joined. Varying your structures makes writing flow and is assessed in every major exam.",
 blocks:[
 {k:'table', head:['Structure','Clauses','Example'], rows:[
  ['<b>Simple</b>','One independent clause','§The monsoon arrived early.'],
  ['<b>Compound</b>','Two independent clauses joined by and, but, or, so, yet, for, nor','§The monsoon arrived early, so the farmers were happy.'],
  ['<b>Complex</b>','One independent clause + at least one dependent clause','§Because the monsoon arrived early, the farmers were happy.'],
  ['<b>Compound-complex</b>','Two independent clauses + at least one dependent clause','§Although the monsoon arrived early, the dams were empty, and the city still faced shortages.']]},
 {k:'tips', items:[
  "An <b>independent clause</b> can stand alone as a sentence. A <b>dependent clause</b> starts with a word like <i>because, although, when, if, which, who</i> and cannot stand alone.",
  "Remember the seven coordinating conjunctions with <b>FANBOYS</b>: for, and, nor, but, or, yet, so.",
  "!A <b>comma splice</b> joins two independent clauses with only a comma: <i>It was late, we left.</i> Use a full stop, a semicolon, or a conjunction.",
  "!A dependent clause alone is a <b>fragment</b>: <i>Because I was tired.</i> Attach it to a main clause."]},
 {k:'mc', items:[
  ["“She studied hard, but she failed.” is…",["simple","compound","complex"],1,"Two independent clauses joined by but."],
  ["“When the bell rang, the students left.” is…",["compound","complex","simple"],1,"When the bell rang is a dependent clause."],
  ["Which is a comma splice?",["I was hungry, so I ate.","I was hungry, I ate.","Because I was hungry, I ate."],1,"Two independent clauses with only a comma."],
  ["“My brother and I cooked and cleaned all day.” is…",["simple","compound","complex"],0,"One clause with a compound subject and a compound verb."]]},
 {k:'write', items:[["Combine these into one complex sentence and one compound sentence: <i>The road was flooded. We took the train.</i>","Complex: Because the road was flooded, we took the train.\nCompound: The road was flooded, so we took the train."]]}
 ]},
{id:'sva', t:'Subject–verb agreement', sub:'Singular subjects, singular verbs',
 intro:"In the present tense the verb must match its subject: <i>she works</i>, <i>they work</i>. The rule is simple; the traps come from tricky subjects.",
 blocks:[
 {k:'table', head:['Rule','Example'], rows:[
  ['Ignore words between the subject and the verb','§The list of items is on the table.'],
  ['Two subjects joined by and are plural','§My brother and my sister live in Pune.'],
  ['With or / nor, agree with the nearer subject','§Neither the manager nor the staff were informed.'],
  ['Each, every, everyone, nobody, either are singular','§Everyone in the class has passed.'],
  ['Uncountable nouns are singular','§The information is correct. The furniture is new.'],
  ['Amounts of money, time and distance are singular','§Ten thousand rupees is a lot for a phone case.'],
  ['The number of = singular; a number of = plural','§The number of students is rising. A number of students are absent.'],
  ['There is / there are agrees with what follows','§There are three reasons for this.']]},
 {k:'tips', items:[
  "Collective nouns (<i>team, family, government</i>) take a singular verb in American English and either in British English: <i>The team is / are playing well.</i>",
  "!<i>News, mathematics, physics</i> end in -s but are singular: <i>The news is good.</i>",
  "!<i>Police, people, cattle</i> are always plural: <i>The police are investigating.</i>"]},
 {k:'mc', items:[
  ["The quality of these products ___ improved.",["have","has"],1,"The subject is quality."],
  ["Neither the students nor the teacher ___ ready.",["was","were"],0,"Agree with the nearer subject: teacher."],
  ["Each of the rooms ___ a balcony.",["have","has"],1,"Each is singular."],
  ["Mathematics ___ my favourite subject.",["is","are"],0,""],
  ["The police ___ arrested two men.",["has","have"],1,"Police is plural."]]}
 ]},
{id:'arts', t:'Articles: a, an, the, or nothing', sub:'The rule most often broken by fluent speakers',
 intro:"Many languages, including Hindi, Telugu and Tamil, have no articles, so English articles take real attention. The choice depends on whether the noun is <b>countable</b> and whether the listener knows <b>which one</b> you mean.",
 blocks:[
 {k:'table', head:['Use','Rule','Example'], rows:[
  ['a / an','One of many; first mention; jobs',"§She's an engineer. I bought a car."],
  ['an','Before a vowel <b>sound</b>, not letter','§an hour, an MBA, a university, a one-way ticket'],
  ['the','Both speakers know which one; second mention','§I bought a car. The car is red.'],
  ['the','Unique things, superlatives, ordinals','§the sun, the best day, the first time'],
  ['the','Rivers, seas, mountain ranges, plural countries','§the Ganges, the Himalayas, the USA, the UK'],
  ['No article','General plural or uncountable nouns','§Dogs are loyal. Water is essential.'],
  ['No article','Most countries, cities, single mountains, meals, languages','§India, Mumbai, Everest, after lunch, in English']]},
 {k:'tips', items:[
  "!Common Indian English slips: <i>He is <b>a</b> doctor</i> (not <i>He is doctor</i>); <i>I'm going to <b>the</b> office</i>; <i>She plays <b>the</b> veena</i>, but <i>plays cricket</i> (no article with sports).",
  "Institutions used for their purpose take no article: <i>go to school, in hospital (UK), at university, in prison</i>. As a building: <i>I went to the school to meet the teacher.</i>"]},
 {k:'mc', items:[
  ["She's ___ honest person.",["a","an","the"],1,"Honest starts with a vowel sound /ɒ/."],
  ["I want to be ___ architect.",["–","an","the"],1,"Jobs take a / an."],
  ["___ Ganga is a sacred river.",["–","The","A"],1,"Rivers take the."],
  ["___ life is too short to worry.",["The","–","A"],1,"Life in general: no article."],
  ["He's studying at ___ university in Leeds.",["an","a","the"],1,"University starts with a /j/ sound."]]}
 ]},

{id:'ie-l3', t:'Practice: Part 3 discussion', sub:'Students and a tutor discuss a project',
 intro:"Part 3 is a conversation between up to four people, usually students and a tutor, about an assignment or research. Opinions change as they talk, so listen for agreement and disagreement: <i>I'm not sure about that</i>, <i>That's a good point</i>, <i>Let's go with…</i>. Press <b>Play recording</b> once, answer, then check.",
 blocks:[
 {k:'audio', title:'Planning a research project on food waste', instr:"Choose the correct answer. Then match each task to the person who will do it.", lines:[
  ['Tutor','So, Arjun and Lena, how is your project on food waste in the student canteen going?'],
  ['Arjun','Quite well, thanks. We originally wanted to weigh all the food that was thrown away, but the canteen manager said that would take too much staff time.'],
  ['Lena','So instead we are going to photograph a sample of plates as they are returned, and estimate how much is left on each one.'],
  ['Tutor','That sounds more realistic. How big will your sample be?'],
  ['Arjun','We thought about fifty plates a day, but Lena suggested we should do a hundred, to make the results more reliable.'],
  ['Lena','And only at lunchtime, because the evening canteen is much quieter.'],
  ['Tutor','Good. What about a survey of the students themselves?'],
  ['Lena','Yes, we want to ask why they leave food. My guess is that the portions are simply too large.'],
  ['Arjun','I\'m not so sure. I think a lot of students just don\'t like some of the vegetables. The survey should tell us.'],
  ['Tutor','Then let the data decide. Now, who is doing what?'],
  ['Arjun','I will design the survey questions, and Lena will take the photographs, since she has the better camera.'],
  ['Lena','And I will also contact the canteen manager to agree on the dates.'],
  ['Arjun','Then I will put all the results into a spreadsheet at the end.'],
  ['Tutor','Excellent. Remember to send me a draft of the survey before you use it with students.']]},
 {k:'mc', title:'Questions 1 to 4: choose the correct answer', items:[

  ["How many plates will they record each day?",["Fifty","A hundred","A hundred and fifty"],1,"Fifty was Arjun's first idea; Lena suggested a hundred."],
  ["When will they collect the data?",["At lunchtime only","In the evening only","At lunch and in the evening"],0,"The evening canteen is much quieter."],
  ["What do Arjun and Lena disagree about?",["How to take photographs","Why students leave food","Which canteen to study"],1,"Lena thinks portions are too large; Arjun thinks students dislike some vegetables."]]},
 {k:'mc', title:'Questions 5 to 8: who will do each task?', items:[
  ["Design the survey questions",["Arjun","Lena","The tutor"],0,""],
  ["Take the photographs",["Arjun","Lena","The tutor"],1,"She has the better camera."],
  ["Contact the canteen manager",["Arjun","Lena","The tutor"],1,""],

{id:'ie-l4', t:'Practice: Part 4 lecture', sub:'Note completion and multiple choice in an academic talk',
 intro:"Part 4 is a lecture on an academic subject, with no break in the middle, so you must follow the speaker's structure. Listen for signposts like <i>first</i>, <i>however</i> and <i>the main reason</i>. Press <b>Play recording</b> once, answer, then check.",
 blocks:[
 {k:'audio', title:'Lecture: cooling hot cities', instr:"Complete the notes. Write ONE WORD ONLY for each answer.", lines:[
  ['Lecturer','Today I want to look at why cities are often several degrees warmer than the countryside around them, an effect known as the urban heat island.'],
  ['Lecturer','The first cause is surfaces. Dark materials such as asphalt absorb sunlight during the day and release the heat slowly at night, so cities stay warm long after sunset.'],
  ['Lecturer','The second cause is the lack of vegetation. Trees cool the air in two ways: they provide shade, and they release water from their leaves, which cools the air around them.'],
  ['Lecturer','A third factor is heat from human activity, such as air conditioners and traffic. Ironically, as cities get hotter, people use more air conditioning, which adds even more heat outside.'],
  ['Lecturer','So what can be done? One cheap solution is to paint roofs white. A white roof reflects most of the sunlight that hits it, and can lower the temperature inside a building noticeably.'],
  ['Lecturer','Green roofs, which are covered with plants, are more expensive, but they also absorb rainwater and provide a habitat for insects.'],
  ['Lecturer','However, the most effective long-term measure is planting trees along streets. Their benefits grow every year as the trees mature, which is why many city councils now see them as essential infrastructure rather than decoration.']]},
 {k:'gap', title:'Lecture notes', items:[
  ["Dark surfaces like","asphalt","absorb heat by day and release it at night.",""],
  ["Trees cool the air by giving","shade","and releasing water from their leaves.",""],
  ["More air","conditioning","in hot cities adds extra heat outside.",""],
  ["A cheap solution: paint roofs","white","",""],
  ["Green roofs also absorb","rainwater|rain","and provide a habitat for insects.",""]]},
 {k:'mc', title:'Multiple choice', items:[
  ["According to the lecturer, the most effective long-term measure is",["white roofs","green roofs","street trees"],2,"“The most effective long-term measure is planting trees along streets.”"],
  ["Why does the lecturer say “ironically”?",["Air conditioning makes the outside hotter","Trees are expensive","White roofs make buildings colder in winter"],0,"The solution people use for heat creates more heat outside."]]}
 ]}
]);

{id:'ie-rac', t:'Practice: Academic passage', sub:'The return of the stepwells',
 intro:"This passage is about the length and difficulty of an Academic Reading text. Give yourself 20 minutes for the passage and all 13 questions.",
 blocks:[
 {k:'passage', title:'The return of the stepwells', paras:[
  ['A',"For more than a thousand years, communities in the dry west of India relied on stepwells to survive the long months between monsoons. Unlike an ordinary well, a stepwell allowed people to walk down flights of stone steps to reach the water, however far the water level had fallen. Some were simple; others were elaborate structures several storeys deep, decorated with carvings and used as cool places to meet and rest."],
  ['B',"The decline of the stepwell began in the nineteenth century. Colonial administrators regarded the wells as unhygienic and promoted piped water and hand pumps instead. As water became available at the turn of a tap, many stepwells were abandoned, filled with rubbish or simply forgotten. Falling groundwater levels made matters worse: in many places the water that once filled them disappeared altogether."],
  ['C',"Interest in stepwells has grown again in recent decades, partly because of their architecture. Rani ki Vav in Gujarat was listed as a UNESCO World Heritage Site in 2014, and images of the deep, geometric steps of Chand Baori in Rajasthan are now shared widely online. Tourism has brought money for restoration, although some conservationists worry that a focus on the most photogenic sites leaves thousands of smaller wells neglected."],
  ['D',"A more practical reason for the revival is water security. As cities face shortages, engineers have begun to see the old wells not as monuments but as working infrastructure. When cleaned and reconnected to the drainage channels that once fed them, a stepwell can collect rainwater and help to recharge the ground beneath it. Several municipal projects have restored wells for exactly this purpose."],
  ['E',"Restoration is rarely straightforward. Many wells are surrounded by buildings that block the channels that once carried rainwater to them, and decades of rubbish must be removed by hand. Success also depends on local people: wells that are cleaned but not maintained quickly fill up again. Projects that involve residents from the start, giving them responsibility for the site, appear to last far longer."]]},
 {k:'mc', title:'Questions 1 to 5: choose the best heading for each paragraph', items:[
  ["Paragraph A",["i. Why wells were abandoned","ii. More than a source of water","iii. A tourist attraction","iv. The key to long-term success"],1,"Paragraph A describes how wells worked and were also meeting places."],
  ["Paragraph B",["i. Why wells were abandoned","ii. More than a source of water","iii. A new role in managing water","iv. The key to long-term success"],0,""],
  ["Paragraph C",["i. Engineering problems","ii. Renewed attention, mixed results","iii. A new role in managing water","iv. The cost of tourism"],1,"Interest has grown, but smaller wells are still neglected."],
  ["Paragraph D",["i. Engineering problems","ii. Renewed attention, mixed results","iii. A new role in managing water","iv. The key to long-term success"],2,"Engineers see the wells as working infrastructure."],
  ["Paragraph E",["i. Why wells were abandoned","ii. Obstacles and what helps overcome them","iii. A new role in managing water","iv. More than a source of water"],1,"Problems, then the importance of involving residents."]]},
 {k:'mc', title:'Questions 6 to 10: True, False or Not Given', items:[
  ["Stepwells allowed people to reach water even when the water level was low.",["True","False","Not Given"],0,"“However far the water level had fallen.”"],
  ["Colonial administrators built new stepwells in the nineteenth century.",["True","False","Not Given"],1,"They promoted piped water and hand pumps instead."],
  ["Chand Baori is a UNESCO World Heritage Site.",["True","False","Not Given"],2,"The text says this only about Rani ki Vav."],
  ["Some conservationists believe tourism has helped all stepwells equally.",["True","False","Not Given"],1,"They worry smaller wells are neglected."],
  ["Restored stepwells can help to recharge groundwater.",["True","False","Not Given"],0,"Paragraph D."]]},
 {k:'gap', title:'Questions 11 to 13: complete the sentences with ONE WORD from the passage', items:[

  ["Projects last longer when they involve local","residents|people","from the start.",""]]}
 ]},

SEC('ielts','Writing',[
{id:'ie-w1ac', t:'Task 1 Academic: describing a chart', sub:'Overview, key features and comparisons in 150 words',
 intro:"In Academic Task 1 you describe a chart, table, map or process in at least 150 words. You don't give opinions or reasons. The single most important thing is a clear <b>overview</b>: one or two sentences that sum up the main trends. Answers without an overview rarely score above band 5 for Task Achievement.",

  ['Top and bottom','peak at, reach a low of','the peak, the lowest point'],

 {k:'chart', title:'Practice chart', caption:'Percentage of adults who read the news online, by age group, 2010 to 2025 (invented data for practice)', years:[2010,2015,2020,2025], series:[['18 to 34',[42,61,78,85]],['35 to 54',[25,40,58,70]],['55 and over',[8,15,30,46]]]},
 {k:'iwrite', task:1, minutes:20, min:150, prompt:"The chart above shows the percentage of adults in three age groups who read the news online between 2010 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.", model:"The line graph illustrates the proportion of adults in three age groups who read news online between 2010 and 2025.\n\nOverall, online news reading increased considerably in all three groups. Young adults were consistently the most likely to read news online, although the oldest group saw the fastest relative growth.\n\nIn 2010, 42% of 18 to 34-year-olds read the news online, compared with a quarter of those aged 35 to 54 and only 8% of people aged 55 and over. Over the next decade, the youngest group's figure rose steadily to 78%, while the middle group more than doubled to 58%.\n\nThe most dramatic change was among the oldest adults. Their figure almost doubled between 2010 and 2015 and then rose sharply to 46% by 2025, nearly six times its starting level. By the end of the period, the youngest group had reached 85% and the middle group 70%, so the gap between young and old had narrowed but remained substantial."}
 ]},

 {k:'iwrite', task:1, gt:true, minutes:20, min:150, prompt:"You recently bought a laptop from an online shop, but it stopped working after two weeks. Write a letter to the shop. In your letter:<br>• describe the problem<br>• explain what you have already done about it<br>• say what you would like the shop to do<br>Begin your letter: <i>Dear Sir or Madam,</i>", model:"Dear Sir or Madam,\n\nI am writing to complain about a laptop I purchased from your website on 2 September (order number 58291).\n\nFor the first two weeks the laptop worked well. However, since last Monday it has failed to start. When I press the power button, the screen stays black and the fan makes a loud noise for a few seconds before switching off.\n\nI have tried to solve the problem myself by charging the battery overnight and following the reset instructions in the user manual, but neither has made any difference. I also contacted your customer helpline twice, but on both occasions I waited over thirty minutes without speaking to anyone.\n\nAs the laptop is clearly faulty and still under warranty, I would like you to arrange a collection and either replace it with a new one or provide a full refund. I would be grateful if you could reply within seven days.\n\nYours faithfully,\nRahul Verma"}
 ]},

 {k:'iwrite', task:2, minutes:40, min:250, prompt:"Some people believe that university education should be free for all students. Others think students should pay for their own studies.<br>Discuss both views and give your own opinion.", model:"Whether university education should be funded by the state or by students themselves is a question that divides governments and families alike. While there are strong arguments on both sides, I believe that tuition should be free, provided the system is carefully designed.\n\nThose who argue that students should pay point out that graduates usually earn more than non-graduates over their lifetimes. From this perspective, it seems unfair to ask all taxpayers, including those who never attended university, to fund an investment that mainly benefits the individual. Fees may also encourage students to choose their courses carefully and take their studies seriously.\n\nOn the other hand, free education ensures that talent rather than family income decides who studies. In countries with high fees, many capable young people from poorer backgrounds either avoid university or graduate with debts that limit their choices for years. Moreover, society as a whole benefits from a well-educated population: doctors, engineers and teachers serve everyone, not only themselves.\n\nIn my view, the second argument is more convincing. Higher education is not simply a private advantage but a public good, and a nation that restricts it to those who can pay wastes much of its potential. However, free tuition should be linked to responsibilities, such as minimum attendance and academic standards, so that public money is used well.\n\nIn conclusion, although graduates do gain personally from their degrees, the wider benefits to society and the importance of equal opportunity mean that university education should be free for all qualified students."},
 {k:'iwrite', task:2, minutes:40, min:250, prompt:"In many cities, traffic congestion is becoming a serious problem.<br>What are the causes of this problem, and what measures could be taken to solve it?"}
 ]},
{id:'ie-wband', t:'How Writing is marked', sub:'The four criteria and what limits your band',

 blocks:[
 {k:'table', head:['Criterion','What examiners look for','Quick win'], rows:[
  ['<b>Task Achievement</b> (Task 1) / <b>Task Response</b> (Task 2)','Answering every part of the question with a clear position or overview and well-supported ideas.','Underline every part of the question before you plan.'],
  ['<b>Coherence and Cohesion</b>','Logical paragraphs, clear progression and natural linking.','One idea per paragraph; vary linkers instead of starting every sentence with <i>Moreover</i>.'],
  ['<b>Lexical Resource</b>','Range and precision of vocabulary, collocation and spelling.','Use precise words naturally; don\'t force rare words.'],
  ['<b>Grammatical Range and Accuracy</b>','A mix of simple and complex sentences with few errors.','Check articles, plurals and subject–verb agreement in the last 3 minutes.']]},
 {k:'tips', title:'What holds scores back', items:[
  "!Task 1 Academic without an overview: Task Achievement is usually limited to band 5.",
  "!Copying the question: copied words aren't counted, and it shows limited vocabulary.",
  "!Memorised phrases such as <i>In this contemporary era of globalisation</i> sound unnatural and don't help.",
  "!Writing under the word limit loses marks under Task Achievement or Task Response.",

readingAc:[
 {title:'The humble pencil', paras:[
  ['',`Few objects are as ordinary as the pencil, yet its history involves mining secrets, wartime shortages and centuries of small improvements. The story begins in the 1560s, when a large deposit of unusually pure graphite was discovered at Borrowdale in the north of England. Local shepherds used the soft black material to mark their sheep, and it soon became clear that it also made clean, dark lines on paper.`],
  ['',`At first, people believed the substance was a form of lead, which is why we still talk about pencil "lead" today, even though pencils have never contained the metal. Because the Borrowdale graphite was so pure, it could be sawn into sticks and used directly. These sticks were brittle and marked the fingers, so users wrapped them in string or sheepskin, and later inserted them into hollowed-out pieces of wood.`],
  ['',`Graphite became so valuable that the English government took control of the mine. At times it was flooded deliberately to prevent theft, and guards searched the miners as they left. Because good graphite was found in so few places, England had something close to a monopoly on high-quality pencils for nearly two hundred years.`],
  ['',`That monopoly ended because of war. In the 1790s France, then at war with Britain, could no longer import English pencils. The French government asked an engineer and inventor, Nicolas-Jacques Conté, to find an alternative. In 1795 he developed a process that mixed powdered graphite with clay, shaped the mixture into rods and baked them in a kiln. The method had a remarkable advantage: by changing the amount of clay, manufacturers could produce harder or softer leads. More clay produced a harder, lighter line; less clay produced a softer, darker one. The same basic process is still used today.`],
  ['',`Across the Atlantic, the Thoreau family ran a small pencil business in Massachusetts. In the 1840s Henry David Thoreau, now better known as a writer and philosopher, worked on improving its pencils, and for a time they were regarded as among the best made in the United States. Thoreau later lost interest in the business, reportedly feeling that he had little more to achieve once he had made a good pencil.`],
  ['',`One familiar feature arrived only in the mid-nineteenth century. In 1858 an American, Hymen Lipman, received a patent for a pencil with an eraser attached to one end. Not everyone welcomed the idea: some teachers argued that it encouraged careless work, and in parts of Europe pencils without erasers remain common.`],
  ['',`The colour of the pencil also has a story. In the 1890s a European company launched an expensive, high-quality pencil painted yellow, a colour associated at the time with luxury. The pencil was a great success, and competitors soon painted their own pencils yellow so that customers would link them with quality. In North America, yellow is still the most common colour for pencils.`]],

 {title:'The making of the Panama Canal', paras:[
  ['A',`For centuries, ships travelling between the Atlantic and Pacific oceans had to make a long and dangerous voyage around the southern tip of South America. A canal across the narrow Isthmus of Panama, less than eighty kilometres wide, promised to cut thousands of kilometres from the journey. The idea had been discussed since the sixteenth century, but the engineering and medical challenges proved far greater than anyone expected.`],
  ['B',`The first serious attempt was made by a French company led by Ferdinand de Lesseps, who had successfully built the Suez Canal in Egypt. Work began in 1881. De Lesseps insisted on a canal at sea level, as at Suez, which meant cutting through mountains and controlling a powerful river that flooded in the rainy season. The scale of the excavation was enormous, and the landslides were constant.`],
  ['C',`Disease proved even more destructive than the landscape. Yellow fever and malaria killed thousands of workers. At the time, doctors did not know that both diseases were carried by mosquitoes, and some precautions actually made things worse: the legs of hospital beds were placed in bowls of water to keep ants away, unintentionally creating ideal places for mosquitoes to breed. By 1889 the French company had run out of money, and the project collapsed.`],
  ['D',`In 1904 the United States took over the project. Before any major digging began, the chief medical officer, William Gorgas, launched a campaign against mosquitoes, based on recent research showing how the diseases spread. Teams drained standing water, covered water containers, spread oil on pools and fitted screens to windows. Within a few years, yellow fever had been eliminated from the canal zone, and deaths from malaria fell sharply.`],
  ['E',`The American engineers also abandoned the idea of a sea-level canal. Instead, they built a system of locks that would raise ships about twenty-six metres to an artificial lake and then lower them again on the other side. The lake was created by damming the Chagres River, the same river that had caused so many problems for the French. This solution dramatically reduced the amount of rock that had to be removed.`],
  ['F',`Much of the hardest and most dangerous labour was done by workers from the Caribbean, many of them from Barbados. They were often paid less than workers from the United States, lived in worse housing and were given the riskiest jobs, particularly in the deep cut through the mountains, where repeated landslides buried equipment and undid months of work. Huge steam shovels loaded the rock onto trains, which carried it away to be used, among other things, in building the dam.`],
  ['G',`The canal opened in 1914, but its opening attracted less attention than expected, because the First World War had begun in Europe only days earlier. Nevertheless, it transformed world shipping. A voyage from New York to San Francisco became roughly half as long, and the canal remains one of the busiest shipping routes in the world.`]],
  groups:[
   {type:'headings', instr:'Choose the correct heading for each paragraph, B to G, from the list of headings.', options:[['i','A change of engineering plan'],['ii','An invisible enemy'],['iii','A delayed celebration'],['iv','Controlling disease before construction'],['v','The cost of a sea-level design'],['vi','Workers who carried the heaviest burden'],['vii','Choosing a new route'],['viii','Twenty-first-century improvements']], items:[
    ['Paragraph B','v'],['Paragraph C','ii'],['Paragraph D','iv'],['Paragraph E','i'],['Paragraph F','vi'],['Paragraph G','iii']]},
   {type:'gap', instr:'Complete the sentences. Choose NO MORE THAN TWO WORDS from the passage for each answer.', items:[
    ['De Lesseps had previously built the','Suez Canal',''],
    ['Bowls of water placed under hospital beds were intended to keep away','ants',''],
    ['Gorgas\'s teams spread','oil','on pools of water'],
    ['The Americans created an artificial lake by damming the','Chagres River|Chagres',''],
    ['Rock from the excavation was used partly to build the','dam','']]},
   {type:'mc', instr:'Choose the correct letter, A, B or C.', items:[
    ['According to the passage, the French project ended mainly because',['the company had no money left','the engineers chose the wrong route','the workers refused to continue'],0],
    ['The opening of the canal received less attention because',['it was delayed for several years','a war had just started','ships were slow to use it'],1]]}]},
 {title:'Can machines be creative?', paras:[
  ['A',`When a computer program produces a painting that sells at auction, or a piece of music that moves its listeners, people are quick to ask whether machines have become creative. The question is usually framed as a simple yes or no. In my view, this framing is the main reason the debate has made so little progress.`],
  ['B',`Part of the difficulty is that "creativity" covers several different abilities. One is the ability to combine familiar ideas in new ways. Another is the ability to explore a set of rules, such as the conventions of a musical style, and find possibilities nobody had noticed. A third, rarer ability is the capacity to change the rules themselves, as the Impressionist painters did when they abandoned the careful realism expected by the art academies of their time.`],
  ['C',`Modern AI systems are clearly capable of the first kind of creativity and, increasingly, the second. Trained on enormous collections of existing work, they produce combinations that can be surprising and even beautiful. Critics argue that this is merely sophisticated copying. I find this objection less convincing than it first appears. Human artists, too, learn by absorbing the work of others; no composer begins from silence.`],
  ['D',`The third kind of creativity is a different matter. To change the rules of an art form, an artist must care about something: a frustration with what already exists, a vision of what might be. Current systems have no such concerns. They produce what they are asked to produce, and their output is judged and selected by people. It is the person who chooses one image from a thousand who makes the most important creative decision.`],
  ['E',`Some commentators predict that machines will soon replace human artists altogether. I think this is unlikely, not because machines lack skill, but because much of the value of art lies in the connection between the work and the experience of the person who made it. A song about loss means something different when we know the singer has lost someone. A machine can imitate the song, but it cannot have the experience.`],
  ['F',`What seems more likely is that these tools will change how creative work is done. Photography did not end painting; it freed painters from the need to record faces and landscapes accurately, and encouraged them to explore other directions. AI may similarly take over the routine parts of creative work, such as producing variations or background music, while increasing the value placed on work that is clearly personal.`],
  ['G',`This does not mean the change will be painless. Illustrators, translators and session musicians are already losing work, and it is not obvious that new kinds of jobs will appear quickly enough to replace it. Societies will need to decide how creators are paid when their work is used to train the systems that compete with them. That question, rather than whether machines are "really" creative, is the one that deserves our attention.`]],
  groups:[
   {type:'tfng', yn:true, instr:'Do the following statements agree with the views of the writer? Write YES, NO or NOT GIVEN.', items:[
    ['The debate about machine creativity has been held back by treating it as a yes-or-no question.','Y'],
    ['The Impressionists changed the rules of painting.','Y'],
    ['AI systems are only copying existing work, so they cannot be creative in any sense.','N'],
    ['The person who selects one machine-made image makes an important creative decision.','Y'],
    ['AI-generated music is more popular than music by human composers.','NG'],
    ['Machines will soon replace human artists completely.','N']]},
   {type:'mc', instr:'Choose the correct letter, A, B or C.', items:[
    ['In paragraph C, the writer mentions composers to show that',['human artists also learn from earlier work','music is the easiest art form for machines','composers have opposed AI'],0],
    ['According to the writer, current AI systems cannot change the rules of an art form because they',['lack technical skill','do not care about anything','are controlled by companies'],1],
    ['The writer refers to photography in order to',['give an example of a technology that changed but did not end an art form','show that painting declined in the nineteenth century','argue that new technology is always harmful'],0]]},
   {type:'summary', instr:'Complete the summary using the list of words, A to H. Write the correct letter.', options:[['A','connection'],['B','payment'],['C','skill'],['D','routine'],['E','experience'],['F','variety'],['G','training'],['H','value']], text:`The writer believes much of the value of art comes from the {1} between a work and its creator. AI is likely to take over the {2} parts of creative work, while personal work gains more {3}. However, some creators are already losing income, and societies must decide on fair {4} when creators' work is used for {5} AI systems.`, answers:['A','D','H','B','G']}]}
],

 {title:'Section 3', texts:[
  {title:'Under the streets of London', paras:[
   ['A',`By the middle of the nineteenth century, the streets of London were among the most crowded in the world. Horse-drawn buses, carts and carriages moved so slowly that it could take longer to cross the city than to travel to it by train from many towns outside. The main railway stations had been built around the edge of the centre, and passengers arriving there faced a long and frustrating journey to their final destinations.`],
   ['B',`The solution proposed by Charles Pearson, a city official, was remarkable for its time: an underground railway. Many people thought the idea absurd and dangerous. Nevertheless, the Metropolitan Railway opened in January 1863, running for about six kilometres between Paddington and Farringdon. On its first day, some thirty-eight thousand passengers made the journey.`],
   ['C',`The first lines were built using a method called "cut and cover". Workers dug a deep trench along the line of a street, built the tunnel inside it and then covered it over again. This was relatively cheap, but it caused enormous disruption to traffic and businesses above, and it meant the railway had to follow existing roads.`],
   ['D',`The early trains were pulled by steam locomotives, which were designed to reduce smoke in the tunnels. Despite this, the air underground was often thick and unpleasant, and passengers complained. The problem was solved only with the arrival of electric trains.`],
   ['E',`In 1890 the City and South London Railway opened as the world's first deep-level electric underground railway. Rather than digging from the surface, engineers used a tunnelling shield, a device that allowed workers to bore circular tunnels deep below the streets without disturbing anything above. The round shape of these tunnels gave the network its popular name: the Tube.`],
   ['F',`As more lines were built by competing private companies, the network became confusing for passengers. The famous map designed in 1931 by Harry Beck, an engineering draughtsman, solved this by ignoring real distances and showing lines as straight horizontal, vertical and diagonal paths, rather like an electrical circuit. Officials were doubtful at first, but the map proved extremely popular when it was published in 1933, and its style has been copied by transport systems around the world.`]]}],

writing:{
 ac:{chart:'bar', caption:'Main reasons for visiting public libraries in one city, 2005 and 2025 (% of visitors; invented data for practice)', cats:['Borrowing books','Studying','Using computers','Attending events','Meeting friends'], series:[['2005',[68,22,30,8,6]],['2025',[41,38,12,27,19]]],
  prompt:`The chart shows the main reasons people gave for visiting public libraries in one city in 2005 and 2025.<br>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.<br>Write at least 150 words.`,
  model:`The bar chart compares the main reasons why people visited public libraries in a city in 2005 and 2025.

Overall, borrowing books remained the most common reason in both years, but its share fell sharply, while studying, attending events and meeting friends all became far more popular. The use of library computers declined.

In 2005, more than two thirds of visitors (68%) came to borrow books, a figure that dropped to 41% by 2025. Using computers was the second most common reason in 2005, at 30%, but this fell to just 12% twenty years later, probably reflecting the spread of home internet access.

By contrast, the proportion of people who visited libraries to study rose from 22% to 38%, making it almost as common as borrowing books. Attendance at events more than tripled, from 8% to 27%, and the share of visitors who came to meet friends increased from only 6% to 19%. These changes suggest that libraries had become more important as social and study spaces.`},
 gt:{prompt:`You are going abroad for three weeks and need a friend to look after your home and your pet while you are away.<br>Write a letter to your friend. In your letter:<br>• explain why you are going abroad<br>• describe what needs to be done in your home<br>• say how you will thank your friend<br>Write at least 150 words. You do NOT need to write any addresses. Begin your letter: <i>Dear ...,</i>`,
  model:`Dear Kavya,

I hope you're well! I'm writing to ask you a big favour. My company is sending me to Singapore for three weeks next month to train a new team, and I'll be leaving on the 6th.

I was wondering if you could look after my flat and, of course, Biscuit, while I'm away. He needs feeding twice a day, once in the morning and once in the evening, and his food is in the cupboard next to the fridge. He also loves a short walk in the park, but only if you have time.

Apart from that, could you water the plants on the balcony every two or three days and put my post on the kitchen table? You're very welcome to stay at the flat if it's easier for you.

To say thank you, I'd love to take you out for dinner at that Italian restaurant you like as soon as I'm back, and I'll bring you something special from Singapore too!

Let me know what you think.

Lots of love,
Ananya`},
 t2:{prompt:`Some people think that children should start learning a foreign language at primary school rather than at secondary school.<br>Do the advantages of this outweigh the disadvantages?<br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.<br>Write at least 250 words.`,
  model:`In many countries, children now begin learning a foreign language at the age of six or seven rather than waiting until secondary school. Although this approach has some drawbacks, I believe its benefits are considerably greater.

The main disadvantage is that an early start places extra demands on young children and on schools. Primary pupils are still developing literacy in their first language, and some educators worry that a second language may confuse them. In addition, primary schools often lack teachers who are fluent in a foreign language, so lessons may be poorly taught, which could make children dislike the subject before they have really begun.

However, the advantages are more significant. Young children are generally less self-conscious than teenagers and are more willing to imitate new sounds, which helps them develop a more natural accent. They also tend to enjoy learning through songs, games and stories, so they associate the language with pleasure rather than examinations. In India, for example, many children grow up speaking two or three languages at home, which suggests that young minds are well able to handle more than one language at once.

Furthermore, starting early simply gives learners more years of practice. A student who begins at seven will have studied the language for over ten years by the time they leave school, which makes genuine fluency far more achievable.

In conclusion, while early language learning requires well-trained teachers and careful planning, its benefits for pronunciation, motivation and long-term ability clearly outweigh the disadvantages.`}
},

 {title:'Part 3', context:'Two students and a tutor discuss a survey on sleep and phones', lines:[
  ['Tutor',"Hello, Maya, hello, Jack. You're doing your survey on phone use and sleep. How's it going?"],
  ['Maya',"Well, we planned to give questionnaires out in lectures, but we decided an online survey would be quicker, and we could reach students from other departments."],

  ['Maya',"We expected that students who used their phones late would sleep less, and they did. But the surprise was that it made no difference whether they used social media or just watched videos."],

 {title:'Part 4', context:'A lecture on the history of salt', lines:[
  ['Lecturer',"Today's lecture is about something we rarely think about: salt. For most of human history, salt was one of the most valuable substances in the world."],
  ['Lecturer',"Its value came from one key property. Before refrigeration, salt was the main way to preserve food, especially meat and fish, which would otherwise rot within days."],
  ['Lecturer',"People obtained salt in three main ways. In hot coastal areas, seawater was left in shallow ponds so that the sun could evaporate the water. Inland, salt was mined from underground deposits. And in some regions, water from salty springs was boiled over fires."],
  ['Lecturer',"Because it was so important, salt was taxed heavily by governments. In India, the salt tax imposed under British rule led to Gandhi's famous march to the sea in 1930, when he and his followers made salt from seawater in protest."],
  ['Lecturer',"Salt also shaped our language. The English word salary is often linked to the Latin word for salt, although historians disagree about whether Roman soldiers were really paid in salt."],
  ['Lecturer',"Trade routes developed specifically to carry salt. In West Africa, camel caravans carried slabs of salt across the Sahara, where it was sometimes exchanged for gold."],
  ['Lecturer',"In the twentieth century, two developments changed everything. Refrigeration meant salt was no longer essential for preserving food, and new mining technology made salt cheap and plentiful."],
  ['Lecturer',"Today, the biggest single use of salt in many cold countries isn't food at all: it's spread on roads in winter to melt ice."],
  ['Lecturer',"And from a health point of view, the concern has reversed. Instead of too little salt, most people now eat too much, which is linked to high blood pressure."]],

 {title:'The great monarch migration', paras:[
  ['',`Every autumn, millions of monarch butterflies leave southern Canada and the northern United States and fly south. Some travel more than four thousand kilometres to reach a small area of mountain forest in central Mexico, where they spend the winter packed together on the branches of fir trees. The sight of entire trees turned orange by resting butterflies has made the area a famous destination for visitors.`],
  ['',`What makes the journey extraordinary is that no individual butterfly makes the round trip. Monarchs born in summer live for only two to six weeks. The generation that emerges in late summer, however, is different: these butterflies delay breeding and can live for up to eight months. It is this long-lived generation that flies to Mexico, survives the winter and begins the journey north in spring. Their children and grandchildren complete the return, so the butterflies that arrive in Canada the following summer have never made the trip before.`],
  ['',`How butterflies that have never been to Mexico find their way there has puzzled scientists for decades. Research has shown that monarchs use the position of the sun as a compass, and that they can correct for the sun's movement across the sky using an internal clock located partly in their antennae. On cloudy days, there is evidence that they can also sense the Earth's magnetic field.`],
  ['',`Monarchs depend on a single group of plants, milkweeds, to reproduce. Females lay their eggs only on milkweed, and the caterpillars feed on nothing else. The plant contains chemicals that are poisonous to many animals; caterpillars store these chemicals in their bodies, which makes adult monarchs taste unpleasant to birds. Their bright orange colour acts as a warning.`],
  ['',`Over recent decades, the number of monarchs reaching Mexico has fallen considerably, although numbers vary greatly from year to year. Scientists point to several causes. Milkweed has disappeared from large areas of farmland, partly because of the use of herbicides. Logging has damaged parts of the winter forests, although protection has improved. Extreme weather, which may become more frequent as the climate changes, can kill large numbers of butterflies during the migration.`],
  ['',`The response has been unusually broad. Farmers, schools and homeowners in all three countries have been encouraged to plant milkweed and other flowering plants along roadsides and in gardens. In Mexico, local communities that once depended on cutting trees have been supported to protect the forests instead, partly through income from tourism.`]],

 {title:'Printing before and after Gutenberg', paras:[
  ['A',`Johannes Gutenberg is often described as the inventor of printing. In fact, printing had a long history in East Asia before he was born. In China, text and images were printed from carved wooden blocks by the eighth century, and the oldest surviving dated printed book, a copy of a Buddhist text known as the Diamond Sutra, was produced in 868 CE.`],
  ['B',`Woodblock printing had an obvious limitation: every page required a new block to be carved by hand. Around 1040, a Chinese craftsman named Bi Sheng found a solution. He made individual characters from baked clay, which could be arranged to form a page, printed and then rearranged for the next page. This was the first known system of movable type.`],
  ['C',`Movable type was developed further in Korea, where printers began casting characters in metal. A Buddhist text printed in 1377, known as the Jikji, is the oldest surviving book printed with movable metal type, produced several decades before Gutenberg's work.`],
  ['D',`Why, then, did movable type have a far greater impact in Europe? Part of the answer lies in writing systems. Chinese uses thousands of different characters, so a printer needed an enormous stock of type. European languages, written with an alphabet of a few dozen letters, were far better suited to the technique.`],
  ['E',`Gutenberg, a goldsmith working in Mainz in the 1440s and 1450s, combined several innovations. He developed a mould that allowed metal letters to be cast quickly and in identical sizes, an oil-based ink that stuck well to metal type, and a printing press adapted from the screw presses used to make wine. His most famous work, a Latin Bible completed around 1455, was produced in about 180 copies.`],
  ['F',`The new technology spread with remarkable speed. Within fifty years, printing presses were operating in more than two hundred European towns. The price of books fell sharply, and the number in circulation rose from thousands to millions.`],
  ['G',`The consequences went far beyond books. Printing allowed new religious and political ideas to spread rapidly, most famously during the Protestant Reformation. It also helped to standardise spelling and grammar, as printers chose particular forms of their languages, and it made it possible for scientists to share detailed observations and illustrations accurately.`]],

 {title:'Why we put things off', paras:[
  ['A',`Almost everyone procrastinates sometimes, but for some people, putting things off is a constant source of stress. Traditionally, procrastination was seen as a problem of time management: people delayed tasks because they were disorganised or lazy. Increasingly, psychologists argue that this view misses the point.`],
  ['B',`According to a growing body of research, procrastination is primarily a problem of managing emotions, not time. When a task makes us feel anxious, bored, insecure or frustrated, delaying it provides immediate relief. The relief is real, but short-lived; the task remains, and the negative feelings usually return, often stronger, together with guilt about the delay.`],
  ['C',`This explains why simply giving procrastinators a calendar or a to-do list often fails. They usually know exactly what they need to do and when. What they lack is a way of dealing with the uncomfortable feelings the task produces. In my view, much productivity advice is therefore aimed at the wrong target.`],
  ['D',`One factor that appears to make procrastination worse is self-criticism. It might seem logical that people who are hard on themselves would be more motivated to work. Yet studies of students have found the opposite: those who forgave themselves for procrastinating on one exam were less likely to procrastinate before the next. Harsh self-judgement seems to add to the very negative feelings that cause delay in the first place.`],
  ['E',`Another approach focuses on making the first step as small as possible. Rather than planning to "write the report", a person might decide simply to open the document and write one sentence. Because the step is so small, it produces little anxiety, and once people have started, they often continue. Starting, not finishing, is usually the hardest part.`],
  ['F',`It would be a mistake, however, to treat all delay as harmful. Some delays are strategic: waiting for more information before making a decision can be sensible. The difference is that strategic delay is chosen deliberately, while procrastination is delay that we know is against our own interests.`],
  ['G',`Technology has made the problem more visible, if not necessarily worse. Phones and social media offer an endless supply of easy, pleasant distractions at exactly the moment a difficult task begins. Whether this has increased procrastination overall is hard to measure, but it has certainly made avoiding unpleasant tasks easier than ever.`]],

 {title:'Section 3', texts:[
  {title:'The box that changed the world', paras:[
   ['A',`For most of history, loading a ship was slow, expensive and dangerous work. Goods arrived at ports in sacks, barrels and crates of every size, and teams of dockworkers loaded them by hand, one item at a time. A ship could spend a week or more in port, and theft and damage were common.`],
   ['B',`The man most often credited with changing this was Malcolm McLean, the owner of an American trucking company. Frustrated by the time his trucks spent waiting at ports, he had a simple idea: instead of unloading goods from a truck and loading them onto a ship, why not lift the whole container onto the ship?`],
   ['C',`In April 1956, an old tanker called the Ideal X sailed from Newark, New Jersey, to Houston, Texas, carrying fifty-eight metal containers on its deck. The voyage is usually seen as the start of modern container shipping. McLean calculated that loading cost a small fraction of what it would have cost using traditional methods.`],
   ['D',`Early progress was slow, partly because different companies used containers of different sizes, which meant they could not be handled by the same equipment. In the 1960s, international standards were agreed for container dimensions and the fittings used to lift and lock them. From then on, a container could move from a ship to a train to a truck anywhere in the world.`],
   ['E',`The effects were dramatic. Ships could be unloaded in hours rather than days, and the cost of transporting goods across oceans fell so far that it became a minor part of the price of most products. This made it practical for companies to manufacture goods far from where they were sold, contributing to the growth of global supply chains.`],
   ['F',`The change was painful for some. Huge numbers of dockworkers lost their jobs, and many traditional ports, built in city centres with narrow streets, declined because they lacked space for container cranes and storage. New ports were built further from cities, on cheaper land with deep water.`]]}],
  groups:[
   {type:'headings', instr:'The text has six paragraphs, A to F. Choose the correct heading for paragraphs B to F from the list of headings.', options:[['i','A historic first voyage'],['ii','Winners and losers'],['iii','One businessman\'s frustration'],['iv','Agreeing on a common size'],['v','The rise of air freight'],['vi','Cheaper transport, global production'],['vii','Old methods of loading']], items:[

 ac:{chart:'table', caption:'Average time spent per day on four activities by adults in one country, 2000 and 2020 (minutes; invented data for practice)', cols:['Activity','2000','2020'], rows:[['Watching TV','168','102'],['Using the internet (leisure)','14','146'],['Reading','34','21'],['Exercise and sport','22','31']],
  prompt:`The table shows the average time adults in one country spent each day on four leisure activities in 2000 and 2020.<br>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.<br>Write at least 150 words.`,
  model:`The table compares the average number of minutes per day that adults in one country spent on four leisure activities in 2000 and 2020.

Overall, the most striking change was the enormous growth in leisure internet use, which almost replaced television as the main activity. Time spent reading fell, while exercise increased slightly.

In 2000, watching television was by far the most time-consuming activity, at 168 minutes a day, nearly three hours. By 2020, this had fallen by more than a third, to 102 minutes. Over the same period, leisure internet use rose dramatically, from just 14 minutes to 146 minutes, more than ten times its original level, overtaking television.

The two remaining activities took up much less time. Reading declined from 34 to 21 minutes a day, whereas time spent on exercise and sport rose from 22 to 31 minutes. As a result, by 2020 adults spent more time exercising than reading, the reverse of the situation twenty years earlier.`},
 gt:{prompt:`You joined a gym three months ago, but you are unhappy with some of the facilities and services.<br>Write a letter to the manager of the gym. In your letter:<br>• explain when and why you joined the gym<br>• describe the problems you have experienced<br>• say what you would like the manager to do<br>Write at least 150 words. You do NOT need to write any addresses. Begin your letter: <i>Dear Sir or Madam,</i>`,
  model:`Dear Sir or Madam,

I am writing to express my dissatisfaction with the facilities at your Riverside branch, which I joined in March on a twelve-month contract. I chose your gym mainly because your website advertised modern equipment and evening yoga classes, which fit around my working hours.

Unfortunately, my experience has been disappointing. Three of the six running machines have been out of order for over a month, so there is usually a long wait to use the others in the evening. In addition, the evening yoga class has been cancelled at short notice on at least five occasions, without any explanation or replacement. Finally, the changing rooms are frequently untidy, and the showers are often cold.

I would therefore like you to repair the running machines as soon as possible and ensure that classes run as advertised. Given the problems I have described, I would also appreciate a refund of one month's membership fee.

I look forward to your reply.

Yours faithfully,
Arjun Menon`},
 t2:{prompt:`In many countries, people are living longer than ever before.<br>Is this a positive or a negative development? What problems might it cause, and how can they be solved?<br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.<br>Write at least 250 words.`,
  model:`Thanks to better healthcare, nutrition and living conditions, people in many countries can now expect to live into their eighties or beyond. In my view, this is an overwhelmingly positive development, although it does create challenges that governments and families must address.

Longer lives are clearly good for individuals and society. Older people can spend more years with their families, share their experience with younger generations and continue to contribute to their communities, for example through voluntary work. In many Indian families, grandparents play a vital role in raising children while parents work.

However, an ageing population creates two main problems. First, as the proportion of older people grows, pension and healthcare costs rise, while the number of working-age taxpayers may fall. Second, many elderly people experience loneliness and long-term illnesses that require care, which places pressure on families and health services.

These problems can be addressed in several ways. Governments could gradually raise the retirement age in line with life expectancy, allowing healthy people to keep working and paying taxes for longer. At the same time, investment in preventive healthcare, such as encouraging exercise and regular check-ups, would help people stay healthy and independent in old age. Community programmes that connect older people with neighbours and volunteers could also reduce loneliness at relatively low cost.

In conclusion, people living longer is a significant achievement rather than a problem in itself. With sensible planning for pensions, health and social care, societies can ensure that these extra years are healthy and fulfilling.`}
},

readingAc:[
 {title:'The return of the wolves', paras:[
  ['',`By the 1920s, grey wolves had been eliminated from Yellowstone National Park in the United States, killed as part of government programmes to protect livestock. For the next seventy years, the park had no wolves at all. In 1995 and 1996, after years of debate, thirty-one wolves were captured in Canada and released in the park.`],
  ['',`The reintroduction has become one of the most studied events in ecology, and it is often presented as a clear example of a "trophic cascade", a chain of effects that spreads through an ecosystem when a top predator is added or removed. In the absence of wolves, the park's elk population had grown large, and elk had spent long periods feeding on young trees, particularly willows and aspens, along rivers.`],
  ['',`After wolves returned, elk numbers fell. Researchers also reported that willows began to recover in some places, which in turn provided food and building material for beavers. Beaver dams created ponds that supported fish, birds and amphibians. In popular accounts, the wolves are sometimes said to have "changed the course of rivers".`],
  ['',`Many ecologists now believe these popular accounts are too simple. The decline in elk had several causes, including hunting by humans outside the park, drought, and the growing numbers of other predators, such as bears and cougars. Some studies also found that the recovery of willows was patchy, and in many areas the trees remain short, because the streams had changed during the decades without beavers and the water table had dropped.`],
  ['',`One idea that has been particularly debated is the "landscape of fear": the suggestion that elk avoided certain dangerous areas, such as river valleys where wolves could easily catch them, allowing plants there to recover. Later research using GPS collars on elk found that this effect was weaker than first thought, as elk did not consistently avoid the areas where wolves hunted.`],
  ['',`None of this means the wolves had no effect. Most scientists agree they have played an important role in the park's ecosystem. But Yellowstone shows how difficult it is to separate a single cause in a complex natural system, and how a good story can spread faster than the evidence supporting it.`]],

 {title:'The science of sleep in young people', paras:[
  ['A',`Teenagers are often accused of being lazy for staying up late and finding it hard to get up in the morning. Sleep scientists, however, argue that this pattern is largely biological. During adolescence, the body's internal clock shifts, so that teenagers naturally begin to feel sleepy later at night than they did as children.`],
  ['B',`This shift is linked to the hormone melatonin, which helps to signal to the body that it is time to sleep. In teenagers, melatonin tends to be released later in the evening than in children or adults. As a result, a teenager who goes to bed at ten o'clock may simply lie awake.`],
  ['C',`At the same time, teenagers still need a lot of sleep: most recommendations suggest between eight and ten hours a night. If school starts early, many students cannot get this amount, and they build up what researchers call "sleep debt" during the week, which they often try to repay by sleeping late at weekends.`],
  ['D',`The consequences of too little sleep are well documented. Sleep-deprived students find it harder to concentrate and remember information, and they are more likely to experience low mood. There is also evidence that tired teenage drivers are at greater risk of accidents.`],
  ['E',`These findings have led some schools and education authorities to experiment with later start times. In 2019, the US state of California passed a law requiring most public high schools to start no earlier than 8.30 a.m. Studies of schools that have made similar changes have generally reported that students sleep longer, although results for academic performance have been more mixed.`],
  ['F',`Later start times are not without problems. They can be difficult for parents who need to leave for work early, and they may affect after-school activities such as sports. Bus schedules, which are often shared between primary and secondary schools, may also need to be reorganised.`],
  ['G',`Technology adds another layer to the issue. The light from phone and computer screens can delay the release of melatonin, and messages and notifications can keep teenagers awake. Many experts therefore advise that devices be kept out of bedrooms at night, although persuading teenagers to follow this advice is another matter.`]],

 {title:'Should cities be designed for walking?', paras:[
  ['A',`For much of the twentieth century, cities in many countries were planned around the car. Wide roads, large car parks and separate zones for housing, shopping and work assumed that most people would drive for almost every journey. In recent decades, a growing number of planners have argued that this approach has made cities less healthy, less sociable and less efficient.`],
  ['B',`The alternative, often called walkable urbanism, aims to put most everyday needs within a short walk of people's homes. One version of this idea, the "15-minute city", promoted by the researcher Carlos Moreno and adopted as a goal by the mayor of Paris, proposes that residents should be able to reach work, shops, schools and parks within fifteen minutes on foot or by bicycle.`],
  ['C',`The case for walkable neighbourhoods rests on several kinds of evidence. People who live in such areas tend to walk more, which is linked to better physical health. Local shops benefit from passing customers, and streets with more people on them are often perceived as safer. There are environmental benefits, too, as fewer car journeys mean lower emissions.`],
  ['D',`I find much of this evidence persuasive, but I am less convinced by some of the claims made for the idea. Simply placing shops and services near homes does not guarantee that people will use them, particularly if they are more expensive than large stores further away. And for many people, work cannot easily be brought closer: a hospital nurse or a factory worker cannot choose to work in their own neighbourhood.`],
  ['E',`A more serious concern is cost. When a neighbourhood becomes more pleasant and walkable, property prices often rise, and existing residents with lower incomes may be forced to move out. In my view, policies that make cities walkable must be combined with measures to protect affordable housing; otherwise the benefits will go mainly to the wealthy.`],
  ['F',`The idea has also become, unexpectedly, the subject of political controversy. In some places, it has been criticised by people who fear it will be used to restrict their freedom to drive. These fears seem to me largely based on a misunderstanding, since most proposals aim to add options rather than to ban cars. Nevertheless, they show that planners need to explain their plans more clearly.`],
  ['G',`Ultimately, the question is not whether cities should be designed only for walking, but whether walking should be a realistic choice. For most of the last century, in many cities, it was not. Making it one again seems to me a reasonable aim, provided that it is done fairly.`]],

 {title:'Section 3', texts:[
  {title:'The story of the paperback', paras:[
   ['A',`In the early twentieth century, new books in Britain were usually published in hardback and were too expensive for many people to buy. Cheap paper-covered editions existed, but they were often poorly printed and associated with low-quality fiction.`],
   ['B',`This changed in 1935, when the publisher Allen Lane launched Penguin Books. According to a well-known story, Lane had the idea while waiting at a railway station, where he could find nothing good to read. His plan was to sell high-quality books, both fiction and non-fiction, in paperback for sixpence, the same price as a packet of cigarettes.`],
   ['C',`Many in the publishing industry believed the plan would fail. Booksellers worried that cheap books would reduce their profits, and authors feared lower earnings. The breakthrough came when the chain store Woolworths placed a large order, which helped to make the business viable.`],
   ['D',`Penguin's design was simple and distinctive. Covers were colour-coded by subject, for example orange for fiction and green for crime, and featured the company's penguin logo. The approach made books easy to recognise and gave the company a strong identity.`],
   ['E',`The Second World War increased demand for paperbacks. They were light and easy to carry, and many were sent to soldiers serving abroad. Paper rationing, however, limited how many books publishers could produce.`],
   ['F',`After the war, paperbacks spread around the world, and today they are standard. While e-books have taken some of their market, printed paperbacks remain popular, partly because many readers simply prefer the experience of holding a physical book.`]]}],
